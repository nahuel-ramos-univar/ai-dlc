without disable-model-invocation: true.","change":"Document this as an intentional sync exception or align metadata with the intended manual-only policy. Preserve informational Stage 1–2 behavior.","acceptance":"A plain repository question does not accidentally perform a write workflow. Explicit sync remains available.","guardrail":"This is a static wording/metadata mismatch, not proof that the host currently auto-runs sync or writes files."}],"sources":[{"name":"Cursor hooks","url":"https://cursor.com/docs/hooks","topic":"Lifecycle observation and targeted tool controls","note":"Native JSON hooks include tool, MCP, subagent and compaction events. Hook payloads vary; do not infer billable totals from duration or context occupancy."},{"name":"Cursor rules","url":"https://cursor.com/docs/rules","topic":"Scoped instructions","note":"Project rules can be scoped; keep always-on guidance small and move task procedures to skills."},{"name":"Cursor subagents","url":"https://cursor.com/docs/subagents","topic":"Independent context","note":"Separate contexts protect the parent from verbose work, but subagents still consume tokens. Supply bounded evidence and preserve independence."},{"name":"Cursor Admin API","url":"https://cursor.com/docs/account/teams/admin-api","topic":"Usage events","note":"Usage events may expose conversationId, model, tokenUsage, cache read/write and chargedCents. Availability and stage attribution must be checked; not every event is token-based."},{"name":"Cursor ignore files","url":"https://cursor.com/docs/reference/ignore-file","topic":"Discovery hygiene","note":"Use ignore/indexing controls for irrelevant generated data. They do not provide a complete shell/MCP security boundary."},{"name":"Claude Code costs","url":"https://code.claude.com/docs/en/costs","topic":"Context efficiency","note":"Keep sessions focused, load task instructions on demand, inspect context and avoid verbose repeated outputs. Model routing should be evaluated against quality."},{"name":"Claude Code monitoring","url":"https://code.claude.com/docs/en/monitoring-usage","topic":"OpenTelemetry","note":"Token and cost metrics can include skill/plugin/agent attribution. Provider billing remains authoritative; preserve input/cache/output categories when normalizing."},{"name":"Claude Code subagents","url":"https://code.claude.com/docs/en/sub-agents","topic":"Bounded specialist work","note":"Custom subagents have their own context and usage. Configuration and inherited instruction behavior are host-specific."},{"name":"Anthropic AI-native SDLC","url":"https://claude.com/es/resources/articles/the-ai-native-sdlc-playbook","topic":"Workflow and evaluation","note":"Supports existing systems such as Jira as the authoritative record and recommends continuous evaluations for agent configuration. Adapt the feedback loop, not an extra document lifecycle."},{"name":"Codex skills","url":"https://learn.chatgpt.com/docs/build-skills","topic":"Progressive disclosure","note":"Skill metadata is discovered first; full instructions load on selection. Keep entry points small and supporting material conditional."},{"name":"Codex AGENTS.md","url":"https://learn.chatgpt.com/docs/agent-configuration/agents-md","topic":"Repository instruction hierarchy","note":"Guidance is assembled from root toward the working directory. Use a small navigation/rules bridge rather than copying the whole AI-DLC method."},{"name":"Codex hooks","url":"https://learn.chatgpt.com/docs/hooks","topic":"Host-specific controls","note":"Current documentation includes hooks and trust review. Non-managed plugin hooks require trust of the current definition; installation is not consent to execute them."},{"name":"Codex App Server","url":"https://learn.chatgpt.com/docs/app-server","topic":"Usage events for custom clients","note":"Documents thread/tokenUsage/updated. Useful only when this protocol is exposed; it does not mean every IDE skill can read that event."},{"name":"AWS AI-DLC on Codex","url":"https://awslabs.github.io/aidlc-workflows/guide/harnesses/codex-cli/","topic":"Method vs host","note":"AWS AI-DLC is a separate methodology with harness-specific integration. It is not a built-in OpenAI lifecycle."},{"name":"AWS AI-DLC on Cursor","url":"https://awslabs.github.io/aidlc-workflows/guide/harnesses/cursor/","topic":"Method vs host","note":"Borrow capability-aware integration and evidence discipline. Do not import another orchestrator or parallel Story store into this plugin."}]}</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('atlas-data').textContent),N=Object.fromEntries(D.nodes.map(n=>[n.id,n])),S=Object.fromEntries(D.skills.map(s=>[s.id,s]));
const main=document.getElementById('main'),dialog=document.getElementById('detail');
let page='overview',selected='plan-work',query='',kind='all',roadFilter='all',modalId=null,modalTab='overview',modalHistory=[],usage=null;
const tabs=[['overview','01','Overview'],['lifecycle','02','Skill journeys'],['reviews','03','Agents & reviews'],['atlas','04','Source atlas'],['tokens','05','Token lab'],['roadmap','06','Improvements'],['hosts','07','Hosts & research']];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-US');
const badge=(t,c='')=>`<span class="tag ${c}">${esc(t)}</span>`;
const list=a=>`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
const sourceButton=(id)=>`<button data-source="${esc(id)}" class="ref-btn"><b>${esc(N[id]?.name||id)}</b><small>${N[id]?fmt(N[id].words)+' words':'source'}</small></button>`;
const sourceChips=a=>`<div class="source-links">${a.filter(x=>N[x]).map(x=>`<button data-source="${esc(x)}">${esc(x.split('/').pop())} ↗</button>`).join('')}</div>`;
const footer=()=>`<footer class="footer">SOURCE SNAPSHOT ${esc(D.meta.commit)} · PACKAGE ${D.meta.version} · ${D.meta.date.toUpperCase()}<br>${esc(D.meta.scope)} Original plugin files were not modified. All sizes are measured from this ZIP; no live token usage was supplied.</footer>`;
const heading=(eyebrow,title,lead)=>`<div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="muted" style="max-width:850px">${lead}</p>`;
function nav(){document.getElementById('nav').innerHTML=tabs.map(([id,num,title])=>`<button data-page="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}><span>${num}</span><span>${title}</span></button>`).join('');document.getElementById('crumb').textContent=tabs.find(x=>x[0]===page)?.[2].toUpperCase()||'OVERVIEW';document.getElementById('stamp').textContent=`v${D.meta.version} · ${D.meta.commit}`}
function go(p,s){page=p;if(s)selected=s;document.body.classList.remove('menu-open');location.hash=p+(p==='lifecycle'?'/'+selected:'');render();window.scrollTo({top:0,behavior:'instant'})}
function flow(){let boxes=[['sync-context',28,40,'Existing project'],['scaffold-project',28,136,'New foundation'],['plan-work',286,87,'Product intent'],['refine-story',544,87,'Technical DEV / QA'],['implement-change',544,251,'Approved implementation'],['validate-change',286,251,'Independent evidence'],['create-e2e-tests',28,251,'Optional journey coverage']];return `<div class="flow-wrap"><svg class="flow-svg" viewBox="0 0 800 370" role="img" aria-label="Skill handoff map. Only implement to validate supports authorized continuous execution."><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="currentColor"/></marker></defs><path class="edge" d="M238 73 C265 73 260 120 286 120 M238 169 C265 169 260 120 286 120 M496 120H544 M649 153V251 M286 284H238" marker-end="url(#arrow)"/><path class="continuous" d="M544 284H496" marker-end="url(#arrow)"/><text x="519" y="325" text-anchor="middle" class="tiny">authorized continuation</text>${boxes.map(([id,x,y,label])=>`<g tabindex="0" role="button" aria-label="Explore ${id}" data-skill="${id}"><rect class="node" x="${x}" y="${y}" width="210" height="66" rx="10"/><text x="${x+15}" y="${y+25}">/${id}</text><text x="${x+15}" y="${y+47}" class="tiny">${label}</text></g>`).join('')}</svg><div class="legend"><span><i class="dashed"></i>Possible manual handoff, not a mandatory sequence</span><span><i></i>Only when requested together</span></div></div>`}
function overview(){return `<section class="hero"><div class="hero-art"><svg viewBox="0 0 400 400"><circle cx="200" cy="200" r="160"/><circle cx="200" cy="200" r="125" class="orbit"/><circle cx="200" cy="200" r="85"/><path d="M200 0v400M0 200h400M40 40l320 320M40 360 360 40"/><path d="M200 40 340 120v160l-140 80-140-80V120Z" class="orbit"/><circle cx="200" cy="40" r="8"/><circle cx="340" cy="280" r="8"/><circle cx="60" cy="280" r="8"/></svg></div><div class="copy"><div class="eyebrow">ENGINEERING SYSTEM / INTERACTIVE FIELD GUIDE</div><h1>See the lifecycle.<br><span style="color:var(--cyan)">Keep the control.</span></h1><p class="lead">Explore what each skill reads, produces and delegates. Follow the approval boundaries. Find where context grows—and where it can be reduced safely.</p><div class="badges">${badge('CURRENT · '+D.meta.commit,'current')}${badge('RECOMMENDATIONS LABELED','proposed')}${badge('ENGLISH · OFFLINE')}</div><div class="actions"><button class="primary" data-page="lifecycle">Explore the workflow →</button><button data-page="roadmap">View improvement roadmap</button></div></div></section><div class="stats"><div class="stat"><b>${String(D.skills.length).padStart(2,'0')}</b><small>SKILL ENTRY POINTS</small></div><div class="stat"><b>${String(D.nodes.filter(n=>n.kind==='agent').length).padStart(2,'0')}</b><small>AGENT DEFINITIONS</small></div><div class="stat"><b>${D.nodes.filter(n=>n.kind==='reference').length}</b><small>REFERENCE DOCUMENTS</small></div><div class="stat"><b>${Object.values(D.meta.tests).reduce((a,b)=>a+b,0)}</b><small>LOCAL TESTS PASSED</small></div></div><div class="section-head"><h2>A map, not an autopilot</h2><small>Click a node to inspect its contract</small></div>${flow()}<div class="section-head"><h2>Choose your starting point</h2><small>Every entry point keeps its own scope</small></div><div class="choice"><button data-skill="scaffold-project"><b>Starting from zero</b><small>Clarify the purpose and build an approved foundation.</small></button><button data-skill="sync-context"><b>Joining an existing project</b><small>Recover current architecture and trustworthy navigation.</small></button><button data-skill="plan-work"><b>Defining the next feature</b><small>Work with the PO before technical refinement.</small></button></div><div class="grid"><article class="card"><div class="eyebrow">ALREADY STRONG</div><h3>Separation of responsibilities</h3><p class="muted">Jira owns requirements. Accepted ADRs own binding architecture decisions. Context maps navigate source. Independent reviewers challenge evidence without approving publication.</p>${sourceChips(['references/architecture-decisions.md','references/work-record.md','references/skill-composition.md'])}</article><article class="card"><div class="eyebrow">NEXT LEVER</div><h3>Less repeated context, same assurance</h3><p class="muted">Prioritize phase-aware loading, bounded review deltas and observable runs. Do not cut independent validation or claim savings from word counts alone.</p><button data-page="tokens">Open the token lab →</button></article></div>${footer()}`}
function lifecycle(){let s=S[selected];return `${heading('CURRENT CONTRACT / SKILL JOURNEYS','From input to evidence.','Select a skill to inspect its scope, expected outputs, lifecycle states, real delegation rules and directly linked documents. State labels summarize the workflow; they are not all persisted enum values.')}<div class="selector-row">${D.skills.map(x=>`<button data-skill="${x.id}" class="${x.id===selected?'active':''}">/${x.id}</button>`).join('')}</div><div class="skill-heading"><div><div class="eyebrow">${esc(s.group)} / ${esc(s.title)}</div><h1>/${esc(s.id)}</h1><p class="muted">${esc(s.summary)}</p></div><button data-source="${s.source}">Inspect SKILL.md ↗</button></div><div class="phase-list">${s.states.map((x,i)=>`<div class="phase"><span>${String(i+1).padStart(2,'0')}</span>${esc(x)}</div>`).join('')}</div><div class="grid"><article class="card"><h3>Inputs</h3>${list(s.inputs)}</article><article class="card"><h3>Outputs</h3>${list(s.outputs)}</article><article class="card"><h3>What it loads</h3>${list(s.reads)}</article><article class="card"><h3>Approval & write boundary</h3><p class="muted">${esc(s.writes)}</p></article></div><div class="note warn"><b>Important distinction.</b> ${esc(s.gotcha)}</div><div class="section-head"><h2>Agent dispatch</h2><small>Contracts, not a trace of an actual run</small></div><div class="card">${s.agents.length?s.agents.map(([id,why])=>`<div class="review-row"><h3>${esc(id)}</h3><p>${esc(why)}</p><div><button data-source="agents/${id}.md">Agent contract ↗</button></div></div>`).join(''):'<p class="muted">No specialist-agent dispatch is required by this skill. The current chat owns this workflow.</p>'}${s.external?`<div class="note">${esc(s.external)}</div>`:''}</div><div class="section-head"><h2>Direct reference branches</h2><small>${s.links.length} unique document links · not a mandatory load list</small></div><div class="grid">${s.links.map(id=>sourceButton(id)).join('')}</div><details><summary>Example starting prompt</summary><pre class="schema">${esc(s.example)}</pre><button data-copy="${esc(s.example)}">Copy prompt</button></details>${footer()}`}
function reviews(){return `${heading('CURRENT CONTRACT / INDEPENDENT ASSURANCE','Review the right thing.','Separate product review, technical refinement, architecture approach, acceptance validation and code-diff review. More reviewers are not automatically more assurance.')}<div class="grid"><article class="card"><h3>Product & technical proposals</h3><ol class="steps-list"><li>Main chat drafts and resolves user decisions.</li><li>Deterministic structure checks run where required.</li><li>Independent reviewer assesses the bounded proposal.</li><li>Material changes trigger affected-scope re-review.</li><li>The human approves exact mutations; review is not approval.</li></ol></article><article class="card"><h3>Implementation & validation</h3><ol class="steps-list"><li>Approach review only for a material new decision.</li><li>Implementation adds tests and exercises regression.</li><li>A fresh validator inspects acceptance evidence.</li><li>The parent coordinates Bugbot against the diff.</li><li>Fixes invalidate affected evidence; delta review restores coverage.</li></ol></article></div><div class="section-head"><h2>Seven configured agents</h2><small>Discoverable files are not proof of runtime availability</small></div><div class="card">${D.nodes.filter(n=>n.kind==='agent').map(n=>`<div class="review-row"><h3>${esc(n.id.split('/').pop().replace('.md',''))}</h3><p>${esc(n.summary)}</p><div><button data-source="${n.id}">Inspect contract ↗</button></div></div>`).join('')}</div><div class="note"><b>Bugbot is external to these seven definitions.</b> Both validate-change and scaffold-project coordinate a supported host attempt in their own flows. A missing, partial or failed execution is never a passing review.</div><div class="section-head"><h2>What should cause another pass?</h2>${badge('CURRENT + PROPOSED INSTRUMENTATION','proposed')}</div><div class="table-wrap"><table><thead><tr><th>Change</th><th>Expected handling</th><th>Measure in a future trace</th></tr></thead><tbody><tr><td>Wording or layout only</td><td>No semantic re-review merely for formatting.</td><td>Draft version, zero material delta.</td></tr><tr><td>Shared product behavior changed</td><td>Review affected items and their dependency boundary.</td><td>Reason, changed criteria and scope.</td></tr><tr><td>Code fix after validation</td><td>Fresh validator for delta + complete evidence matrix; renew Bugbot for changed code.</td><td>Standing / invalidated / new evidence.</td></tr><tr><td>Context fingerprint only</td><td>Scaffold context review can remain valid if semantics are unchanged.</td><td>Mechanical refresh classification.</td></tr><tr><td>No progress on the same failure</td><td>Stop with diagnosis; do not repeat indefinitely.</td><td>Failure identity and new evidence since last attempt.</td></tr></tbody></table></div><div class="note warn"><b>Do not remove independent reading to save tokens.</b> Repeated parent reads and unnecessary reruns are candidates for reduction. An independent reviewer inspecting the authoritative source is a deliberate assurance cost.</div>${sourceChips(['.cursor/skills/plan-work/references/product-review.md','.cursor/skills/refine-story/references/review-profiles.md','.cursor/skills/validate-change/SKILL.md','.cursor/skills/scaffold-project/references/foundation-and-review.md'])}${footer()}`}
function atlas(){return `${heading('SOURCE ATLAS / SEARCHABLE CONTRACTS','Follow the branches.','Search the actual Markdown from the uploaded package. Inspect summaries, exact source and incoming/outgoing links. A document link means reference—not guaranteed loading or an agent invocation.')}<div class="atlas-controls"><input id="atlas-search" aria-label="Search source documents" placeholder="Search skills, references, rules or source text…" value="${esc(query)}"><select id="kind-filter" aria-label="Filter document type">${['all','skill','reference','agent','rule','package'].map(x=>`<option value="${x}" ${x===kind?'selected':''}>${x==='all'?'All document types':x}</option>`).join('')}</select></div><div id="atlas-count" class="eyebrow"></div><div class="grid three" id="atlas-results"></div>${footer()}`}
function filterAtlas(){let q=query.toLowerCase();let nodes=D.nodes.filter(n=>(kind==='all'||n.kind===kind)&&(!q||(n.id+' '+n.name+' '+n.source).toLowerCase().includes(q)));document.getElementById('atlas-count').textContent=`${nodes.length} DOCUMENTS / ${D.nodes.length} INDEXED`;document.getElementById('atlas-results').innerHTML=nodes.length?nodes.map(n=>`<button class="card source-card" data-source="${n.id}">${badge(n.kind,n.kind)}<h3>${esc(n.name)}</h3><p>${esc(n.summary)}</p><div class="file-path">${esc(n.id)}</div><footer>${fmt(n.words)} words · ${n.links.length} outgoing · ${n.inbound.length} incoming</footer></button>`).join(''):'<div class="empty">No matching source. Try a skill name, “approval”, “snapshot” or “review”.</div>'}
function tokenBars(){let max=Math.max(...D.skills.map(s=>s.words));return `<div class="bars">${[...D.skills].sort((a,b)=>b.words-a.words).map(s=>`<div class="bar-row"><button data-skill="${s.id}">/${s.id}</button><div class="track"><div class="fill" style="width:${s.words/max*100}%"></div></div><span class="value">${fmt(s.words)}</span></div>`).join('')}</div>`}
function tokens(){return `${heading('EFFICIENCY / MEASURED STATIC SIZE ≠ RUNTIME USAGE','Find context gravity.','This lab measures files in the ZIP. It does not know what Cursor loaded, how often content was reused, cache pricing, hidden instructions or subagent billing.')}<div class="grid"><article class="card"><h3>Entry-point size</h3><p class="muted compact-text">Measured whitespace-separated words in each SKILL.md.</p>${tokenBars()}</article><article class="card"><h3>Potential one-hop reading surface</h3><p class="muted compact-text">Unique existing documents directly linked by each SKILL. Includes conditional paths and other skills. This is an exposure inventory, not a per-run token total.</p><div class="table-wrap"><table><thead><tr><th>Skill</th><th>Links</th><th>Linked words</th></tr></thead><tbody>${D.skills.map(s=>`<tr><td>${esc(s.id)}</td><td>${s.links.length}</td><td>${fmt(s.refWords)}</td></tr>`).join('')}</tbody></table></div></article></div><div class="section-head"><h2>Build a hypothetical reading set</h2>${badge('STATIC ESTIMATE','proposed')}</div><div class="grid"><article class="card"><div class="lab-controls"><label>Skill <select id="lab-skill">${D.skills.map(s=>`<option value="${s.id}" ${selected===s.id?'selected':''}>${s.id}</option>`).join('')}</select></label><label>Characters / token <input id="ratio" type="number" min="2" max="8" step="0.25" value="4" style="width:80px"></label></div><div class="actions"><button id="all-refs">Select all links</button><button id="no-refs">Entry point only</button></div><div class="check-list" id="check-list"></div></article><article class="card"><h3>One-time text size estimate</h3><div class="calc-value" id="estimate"></div><div id="estimate-detail" class="muted compact-text"></div><div class="note warn">Not billed tokens. A real run adds conversation, tool schemas/results, output, reasoning and independent-agent requests. Cache categories and repeated turns cannot be derived from this calculator.</div><p class="muted compact-text">Unchecking a document is an experiment, not authorization to skip its contract. Use phase conditions before removing a load.</p></article></div><div class="section-head"><h2>Proposed Canvas: run efficiency</h2>${badge('DESIGN PROTOTYPE · NOT CONNECTED','proposed')}</div><article class="card"><p class="muted">No telemetry has been imported. Unknown values remain unavailable. The optional import below accepts a manually normalized single-run summary; it does not connect to a host or aggregate billing events.</p><div class="metric-grid" id="usage-metrics"></div><div class="actions"><label style="display:inline-block"><span class="tag">IMPORT NORMALIZED JSON</span> <input type="file" id="usage-file" accept=".json,application/json" aria-label="Import a normalized usage summary"></label><button id="clear-usage">Clear imported summary</button></div><div id="usage-message" class="muted compact-text" style="margin-top:14px"></div><details><summary>Suggested summary schema & attribution rules</summary><pre class="schema">{
  "host": "cursor",
  "source": "authorized usage export",
  "coverage": "parent-only",
  "runId": "your-run-id",
  "inputTokens": null,
  "outputTokens": null,
  "cacheReadTokens": null,
  "cacheWriteTokens": null,
  "elapsedSeconds": null,
  "reviewPasses": null,
  "toolCalls": null,
  "chargedUSD": null
}</pre><p class="muted compact-text">Use non-negative numbers or null. Coverage: parent-only, parent-and-children, partial or unknown. Imported values are user-supplied, not independently verified. Normalize host semantics before any aggregation; distinguish cumulative counters from deltas, avoid double-counting parent/child events, and separate charged cost from list-price estimates. Do not calculate a universal “total tokens” from overlapping fields.</p></details></article><div class="note"><b>Start small.</b> Track review rounds and duplicate same-agent reads first. Add token counters only through a documented, authorized host source. Do not add a telemetry server or credentials to every consumer repository.</div>${footer()}`}
function initLab(){const s=S[selected];document.getElementById('check-list').innerHTML=s.links.map(id=>`<label><input type="checkbox" data-ref="${id}"><span>${esc(N[id].name)}<br><small>${esc(id)}</small></span><small>${fmt(N[id].chars)} chars</small></label>`).join('');updateEstimate();renderUsage()}
function updateEstimate(){let s=S[selected],chars=s.chars,checked=[...document.querySelectorAll('[data-ref]:checked')].map(x=>x.dataset.ref);for(let id of checked)chars+=N[id].chars;let ratio=Math.min(8,Math.max(2,Number(document.getElementById('ratio').value)||4));document.getElementById('estimate').textContent='≈ '+fmt(Math.ceil(chars/ratio));document.getElementById('estimate-detail').textContent=`Estimated text tokens at ${ratio} characters/token · ${fmt(chars)} measured characters · entry point + ${checked.length} selected documents. This is a coarse, model-independent heuristic, not a tokenizer measurement.`}
function renderUsage(){const fields=[['inputTokens','Input tokens'],['outputTokens','Output tokens'],['cacheReadTokens','Cache-read tokens'],['cacheWriteTokens','Cache-write tokens'],['elapsedSeconds','Elapsed seconds'],['reviewPasses','Review passes'],['toolCalls','Tool calls'],['chargedUSD','Charged USD']];document.getElementById('usage-metrics').innerHTML=fields.map(([key,label])=>`<div class="metric"><b>${usage?.[key]!=null?fmt(usage[key]):'—'}</b><small>${label}${usage?' · supplied':' · unavailable'}</small></div>`).join('');document.getElementById('usage-message').textContent=usage?`User-supplied summary · ${usage.host||'unknown host'} · ${usage.coverage||'unknown'} coverage · ${usage.source||'source not supplied'}. Not independently verified.`:'No live usage source. Missing data is not zero.'}
function roadmap(){let items=D.improvements.filter(x=>roadFilter==='all'||x.priority===roadFilter);return `${heading('PROPOSED / PRIORITIZED IMPROVEMENTS','Reduce waste.<br>Keep the evidence.','Recommendations from the actual package and official host documentation. None of these proposed changes were applied to the AI-DLC source. Priorities reflect expected value and risk—not measured token savings.')}<div class="selector-row">${['all','P0','P1','P2'].map(x=>`<button data-priority="${x}" class="${roadFilter===x?'active':''}">${x==='all'?'All improvements':x}</button>`).join('')}</div>${items.map((x,i)=>`<article class="roadmap-item"><div class="priority">${x.priority}</div><div>${badge(x.kind,'proposed')}<h3>${esc(x.title)}</h3><p>${esc(x.problem)}</p><p><b style="color:var(--ink)">Change:</b> ${esc(x.change)}</p><details><summary>Acceptance check, owner and safety boundary</summary><p><b>Owner:</b> ${esc(x.owner)}</p><p><b>Acceptance:</b> ${esc(x.acceptance)}</p><p><b>Preserve:</b> ${esc(x.guardrail)}</p>${sourceChips(x.evidence)}</details></div></article>`).join('')}<div class="section-head"><h2>Suggested delivery slices</h2><small>Small PRs, separate behavior from infrastructure</small></div><div class="grid three"><article class="card"><div class="eyebrow">SLICE 01</div><h3>Prompt efficiency</h3><p class="muted">Phase loading, bounded review deltas, concise Canvas output and the sync invocation clarification. Preserve approvals and independent reviews.</p></article><article class="card"><div class="eyebrow">SLICE 02</div><h3>Observability pilot</h3><p class="muted">One host, opt-in metadata hooks, a provenance-aware run summary and a Canvas panel. Prove parent/child coverage before showing totals.</p></article><article class="card"><div class="eyebrow">SLICE 03</div><h3>Behavioral benchmark</h3><p class="muted">Shared synthetic fixtures, measured host runs and quality/cost comparison before broad contract reduction or model routing.</p></article></div>${footer()}`}
function hosts(){return `${heading('OFFICIAL RESEARCH / HOST CAPABILITIES','Use the harness.<br>Do not rebuild it.','Research checked on 22 October 2026. Documented capabilities are not confirmation that the installed host version, plan or permissions expose them. AI-DLC remains your methodology; the host supplies execution primitives.')}<div class="grid three"><article class="card"><div class="eyebrow">CURSOR</div><h3>Native extension surfaces</h3><p class="muted">Scoped rules, skills, subagents and lifecycle hooks. Use authorized usage events for token data; lifecycle counters alone are not billing evidence.</p><p class="compact-text">AI-DLC today: Cursor manifest, seven skills, seven agents, one conditional rule, and a project hook that refreshes this explorer snapshot after plugin source edits. Methodology skills still have no runtime token-usage hooks.</p></article><article class="card"><div class="eyebrow">CLAUDE CODE</div><h3>Context + observability</h3><p class="muted">Progressively loaded procedures and bounded subagents reduce parent-context noise. Monitoring can expose token/cost attribution; retain provider billing as authority.</p><p class="compact-text">Borrow measured feedback and skill evaluations. Do not add a second set of Story Markdown documents.</p></article><article class="card"><div class="eyebrow">CODEX</div><h3>Instructions + trusted hooks</h3><p class="muted">AGENTS.md hierarchy, skill discovery and current hook support provide integration points. App Server usage events apply only where that protocol is available.</p><p class="compact-text">Add a capability-tested adapter, not a claim that a Cursor plugin automatically works everywhere.</p></article></div><div class="note warn"><b>AWSlabs AI-DLC is a separate project.</b> Its Codex and Cursor integrations demonstrate harness adaptation. They do not make AWS AI-DLC a built-in Claude, OpenAI or Cursor workflow. Import useful principles without importing another orchestrator.</div><div class="section-head"><h2>What to pilot in .cursor</h2><small>Proposal—not installed configuration</small></div><div class="table-wrap"><table><thead><tr><th>Surface</th><th>Useful application</th><th>Boundary</th></tr></thead><tbody><tr><td>hooks / tool lifecycle</td><td>Count calls, failures, elapsed time and review launches with minimal metadata.</td><td>No raw prompts, secrets or automatic write approval.</td></tr><tr><td>subagent lifecycle</td><td>Observe review rounds and outcomes, then correlate supported IDs.</td><td>Agent existence is not a complete token total.</td></tr><tr><td>preCompact</td><td>Retain current scope, pending decisions and evidence pointers.</td><td>Context occupancy is not cumulative spending.</td></tr><tr><td>Scoped .mdc rules</td><td>Apply real project policies only when relevant.</td><td>Existing AI-DLC rule is already Agent Decides.</td></tr><tr><td>Ignore/index settings</td><td>Reduce generated-file discovery noise.</td><td>Do not hide required source; shell/MCP access differs.</td></tr><tr><td>Versioned host capability checks</td><td>Check review, Canvas, hook and usage availability.</td><td>Do not infer runtime access from a documentation page.</td></tr></tbody></table></div><div class="section-head"><h2>Primary sources</h2><small>External links require connectivity; this atlas does not</small></div><div class="grid">${D.sources.map(x=>`<article class="card"><div class="eyebrow">${esc(x.topic)}</div><h3><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.name)} ↗</a></h3><p class="muted compact-text">${esc(x.note)}</p></article>`).join('')}</div>${footer()}`}
function render(){nav();main.innerHTML=({overview,lifecycle,reviews,atlas,tokens,roadmap,hosts}[page]||overview)();if(page==='atlas')filterAtlas();if(page==='tokens')initLab()}
function openSource(id,push=true){if(!N[id])return;if(push&&modalId&&dialog.open)modalHistory.push(modalId);modalId=id;modalTab='overview';renderSource();if(!dialog.open)dialog.showModal()}
function renderSource(){let n=N[modalId];document.getElementById('detail-title').innerHTML=badge(n.kind,n.kind)+`<h2>${esc(n.name)}</h2><div class="file-path">${esc(n.id)}</div>`;document.getElementById('detail-body').innerHTML=`${modalHistory.length?'<button id="source-back">← Previous document</button>':''}<div class="badges">${badge(fmt(n.words)+' WORDS')}${badge(n.lines+' LINES')}${badge(n.links.length+' OUTGOING')}${badge(n.inbound.length+' INCOMING')}</div><p class="muted">${esc(n.summary)}</p><div class="modal-subnav">${['overview','branches','source'].map(x=>`<button data-modal-tab="${x}" class="${modalTab===x?'active':''}">${x==='overview'?'Sections':x==='branches'?'Reference branches':'Exact source'}</button>`).join('')}</div>${modalTab==='source'?`<button data-copy="${esc(n.source)}">Copy exact source</button><pre>${esc(n.source)}</pre>`:modalTab==='branches'?`<div class="note">These are static Markdown references. They are not an observed tool-call graph or guaranteed load sequence.</div><div class="grid"><section><h3>References from this file</h3><div class="refs">${n.links.length?n.links.map(sourceButton).join(''):'<p class="muted">No indexed outgoing links.</p>'}</div></section><section><h3>Referenced by</h3><div class="refs">${n.inbound.length?n.inbound.map(sourceButton).join(''):'<p class="muted">No incoming Markdown links in this index. Manifest discovery or prose dispatch can still make this reachable.</p>'}</div></section></div>`:`<div class="refs">${n.headings.map(h=>`<button data-line="${h.line}" class="ref-btn"><b>${esc(h.text)}</b><small>line ${h.line}</small></button>`).join('')}</div><div class="note">Summaries aid navigation. Read the exact source before editing a contract. The source snapshot is ${D.meta.commit}. A project hook refreshes it when plugin source files change.</div>`}`}
function toast(t){let el=document.getElementById('announcer');el.className='toast';el.textContent=t;setTimeout(()=>{el.textContent='';el.className=''},2500)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copied to clipboard')}catch(e){let ta=document.createElement('textarea');ta.value=t;document.body.append(ta);ta.select();let ok=document.execCommand('copy');ta.remove();toast(ok?'Copied to clipboard':'Clipboard unavailable; select the source text to copy')}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-skill],[data-source],[data-modal-tab],[data-line],[data-priority],[data-copy]');if(!b)return;if(b.dataset.page)go(b.dataset.page);else if(b.dataset.skill)go('lifecycle',b.dataset.skill);else if(b.dataset.source)openSource(b.dataset.source);else if(b.dataset.modalTab){modalTab=b.dataset.modalTab;renderSource()}else if(b.dataset.line){let line=Number(b.dataset.line);modalTab='source';renderSource();let pre=document.querySelector('#detail-body pre');let lines=N[modalId].source.split('\n');pre.innerHTML=lines.map((x,i)=>`<span class="source-line" id="src-line-${i+1}">${esc(x)}\n</span>`).join('');document.getElementById('src-line-'+line)?.scrollIntoView({block:'start'})}else if(b.dataset.priority){roadFilter=b.dataset.priority;render()}else if(b.dataset.copy!==undefined)copy(b.dataset.copy)});
document.addEventListener('input',e=>{if(e.target.id==='atlas-search'){query=e.target.value;filterAtlas()}if(e.target.id==='ratio')updateEstimate()});
document.addEventListener('change',async e=>{if(e.target.id==='kind-filter'){kind=e.target.value;filterAtlas()}if(e.target.id==='lab-skill'){selected=e.target.value;initLab()}if(e.target.dataset.ref)updateEstimate();if(e.target.id==='usage-file'){try{let f=e.target.files[0];if(!f)return;if(f.size>100000)throw Error('Use a normalized summary below 100 KB.');let u=JSON.parse(await f.text());if(!u||Array.isArray(u)||typeof u!=='object')throw Error('Expected one summary object.');for(let key of ['inputTokens','outputTokens','cacheReadTokens','cacheWriteTokens','elapsedSeconds','reviewPasses','toolCalls','chargedUSD'])if(u[key]!=null&&(typeof u[key]!=='number'||!Number.isFinite(u[key])||u[key]<0))throw Error(key+' must be non-negative or null.');for(let key of ['host','source','runId','coverage'])if(u[key]!=null&&typeof u[key]!=='string')throw Error(key+' must be text.');if(u.coverage&&!['parent-only','parent-and-children','partial','unknown'].includes(u.coverage))throw Error('Unknown coverage value.');usage=u;renderUsage();toast('Summary imported locally; not independently verified')}catch(err){toast('Import rejected: '+err.message)}}});
document.addEventListener('click',e=>{if(e.target.id==='all-refs'||e.target.id==='no-refs'){document.querySelectorAll('[data-ref]').forEach(x=>x.checked=e.target.id==='all-refs');updateEstimate()}if(e.target.id==='clear-usage'){usage=null;renderUsage()}if(e.target.id==='source-back'){modalId=modalHistory.pop();modalTab='overview';renderSource()}});
document.getElementById('close-detail').onclick=()=>dialog.close();dialog.addEventListener('close',()=>{modalId=null;modalHistory=[]});
document.getElementById('theme').onclick=()=>{document.body.classList.toggle('light');try{localStorage.setItem('atlas-theme',document.body.classList.contains('light')?'light':'dark')}catch{}};
document.getElementById('menu').onclick=()=>document.body.classList.toggle('menu-open');document.getElementById('print').onclick=()=>window.print();document.getElementById('search-open').onclick=()=>{go('atlas');document.getElementById('atlas-search').focus()};
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!dialog.open){e.preventDefault();go('atlas');document.getElementById('atlas-search').focus()}if(e.key==='Escape')document.body.classList.remove('menu-open');if(e.key==='Enter'&&e.target.matches('svg [data-skill]'))go('lifecycle',e.target.dataset.skill)});
function restoreHash(){let [p,s]=location.hash.slice(1).split('/');if(tabs.some(x=>x[0]===p))page=p;if(S[s])selected=s;render()}
window.addEventListener('hashchange',()=>{let [p,s]=location.hash.slice(1).split('/');if(p!==page||(s&&s!==selected))restoreHash()});try{if(localStorage.getItem('atlas-theme')==='light')document.body.classList.add('light')}catch{}restoreHash();
</script></body></html>
