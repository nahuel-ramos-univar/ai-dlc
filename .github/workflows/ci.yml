name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Structural tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run static contract tests
        run: |
          echo "Static layout and helper checks only. This job does not launch Cursor and does not prove runtime plugin discovery."
          python3 tests/skill_contracts.py
          python3 tests/context_tools_tests.py
          python3 tests/release_contracts.py
