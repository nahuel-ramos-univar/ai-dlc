ls.py` exists relative to the target\nrepository's current working directory — it does not; it ships inside this\nplugin's own installation. Resolve it relative to a file you already loaded\nfrom this skill. From this skill's own reference files (for example this\nfile, `references/validation.md`), the script is four directories up, then\ninto `scripts/`: `../../../../scripts/context_tools.py`. From `SKILL.md`\nitself, it is three directories up: `../../../scripts/context_tools.py`. If\nyou loaded either file by absolute path, use that same absolute path's parent\nplugin root instead of a relative guess.\n\n```bash\npython3 \u003cresolved-path-to>/context_tools.py validate \u003cindex-path> \\\n  --root \u003crepo-id>=\u003crepo-root> [--root \u003crepo-id>=\u003crepo-root> ...] \\\n  [--index-repository-id \u003crepo-id>] [--index-budget 150] \\\n  [--candidate \u003cfinal-absolute-path>=\u003cstaged-file> ...]\n```\n\n`--module-budget` is still accepted so older invocations do not fail; it\ndoes not produce a check. Module line count is a metric from\n`document_metrics`, not a validation result.\n\nTo check a proposal before writing it, write each proposed document's text to\na temporary staging file, then pass `--candidate\n\u003cfinal-absolute-path>=\u003cstaged-file>` once per proposed document (repeatable).\n`\u003cfinal-absolute-path>` is where the document would live once applied; it is\nread only to resolve links and compute identity, never written to.\n`\u003cindex-path>` itself may be a `--candidate` final path for a brand-new index\nthat does not exist on disk yet.\n\nExit code `1` means at least one check failed. That takes precedence when\nfailed and unresolved checks are both present. Exit code `2` means no check\nfailed, but at least one is unresolved, or the arguments are invalid. Exit\ncode `0` means every check passed or was not applicable. Incomplete\nvalidation must never look like a clean success. Report the exit code and\nevery individual check result; do not summarize a mixed run as simply\n\"passed.\"\n\n## Boundaries\n\nThese checks are read-only and mechanical. They do not confirm that an\nUnknown is accurate, that a described dependency is correct, that a claim is\nwell-supported, or that a coverage statement matches actual inspection depth.\nDo not build a keyword-matching system on top of these checks that claims to\ncatch semantic contradictions; that is what `context-reviewer` is for, and a\nclean deterministic run does not prove semantic correctness. Report each\ncheck's result explicitly, including when a reference is unresolved because\nthe path or repository is unavailable; never report an unavailable reference\nas successfully verified.\n","inbound":[".cursor/skills/plan-work/SKILL.md",".cursor/skills/scaffold-project/SKILL.md",".cursor/skills/scaffold-project/references/foundation-and-review.md",".cursor/skills/sync-context/SKILL.md",".cursor/skills/sync-context/references/artifact-home.md",".cursor/skills/sync-context/references/legacy-migration.md",".cursor/skills/sync-context/references/review-handoff.md"]},{"id":".cursor/skills/validate-change/SKILL.md","kind":"skill","name":"Validate change","summary":"Validate an approved change against acceptance criteria by dispatching an independent validator and coordinating real Bugbot results or a pending handoff.","words":1821,"chars":13430,"lines":103,"links":["references/response-style.md","references/context-retrieval.md","agents/validator.md","references/skill-composition.md","references/repository-preflight.md","references/requirement-snapshot.md","references/architecture-decisions.md",".cursor/skills/validate-change/references/evidence-and-bugbot.md","references/verification-evidence.md","references/work-record.md","references/approval-contract.md","references/criterion-ids.md","references/e2e-environment.md","references/model-evaluation.md"],"headings":[{"text":"Validate change","line":7},{"text":"Response shape","line":9},{"text":"Context retrieval","line":12},{"text":"Start condition","line":15},{"text":"Independent validator","line":22},{"text":"Workflow","line":44},{"text":"In-run corrections","line":53},{"text":"Bugbot","line":73},{"text":"Output","line":86},{"text":"Reference loading","line":89}],"source":"---\nname: validate-change\ndescription: Validate an approved change against acceptance criteria by dispatching an independent validator and coordinating real Bugbot results or a pending handoff.\ndisable-model-invocation: true\n---\n\n# Validate change\n\n## Response shape\nFollow the shared [compact response style](../../../references/response-style.md).\n\n## Context retrieval\nUse [context retrieval](../../../references/context-retrieval.md). Read selected module context, then current source, tests, contracts, and the reviewed diff only as needed to prepare a bounded handoff and to apply authorized fixes. Do not treat the implementer's summary as proof.\n\n## Start condition\nStart when the user runs `/validate-change`, or when `/implement-change` continues here because the user authorized that successor workflow in the same request. Every invocation, including that continuation, starts a **new** independent `validator` delegation. The chat that implemented the change coordinates; it does not evaluate its own conclusions.\n\nThis skill owns Bugbot coordination, authorized in-run fixes, and the closing report. It does not require an extra `/implement-change` slash command for otherwise authorized in-scope fixes. Independent validation is the `validator` agent's assessment, not this chat's re-check.\n\nIf the user asked for review only, or no modifications, propose targeted fixes and do not apply them.\n\n## Independent validator\nUse the host's real independent-delegation facility. Prefer the named plugin agent `validator`. If the host exposes only a general-purpose independent subagent, give it [validator.md](../../../agents/validator.md) as bounded task context and report that as general-purpose independent review, not native named-agent dispatch. Follow [skill composition](../../../references/skill-composition.md).\n\nIf independent delegation is unavailable, report **independent validation pending**. Useful checks may still run. Do not declare independent validation completed. Do not label this chat's own assessment independent.\n\nDo not pass the whole conversation history by default. If the host cannot isolate the validator from this chat's context, say that limitation. Static contract tests in this plugin do not prove that a validator agent was invoked.\n\nGive the validator a bounded handoff:\n\n- pass reason: first validation of this change, or delta review after an in-run fix;\n- objective and authorized Jira items, acceptance criteria, approved constraints with sources, and the approved refinement;\n- the requirement snapshot (scope, exclusions, criteria, constraints including applicable architecture decisions, contracts, refinement) labeled as claims to re-read, not as proof;\n- repositories, baseline, and current diff state, including relevant new files;\n- changed dependency manifests, public contracts, migrations, security-sensitive paths, and shared files, when those paths are in the diff;\n- unrelated staged, unstaged, and untracked changes to preserve;\n- applicable rules, known commands, and environment restrictions;\n- prior evidence, labeled as claims the validator must verify, not as results;\n- after a fix: the prior evidence matrix labeled standing, invalidated, or still-open, plus the delta to recheck;\n- when the change affects model or generative-system behavior, the approved evaluation contract and its sources: dataset and versions, metrics or rubric, thresholds, configuration, evaluation budget, and restrictions when those exist. Do not assume the independent validator inherits this chat's file reads.\n\nDo not request `implementation-reviewer` for a post-code architecture review or a full code review of the diff. Approach review belongs to `/implement-change` before code. Bugbot owns the diff. The validator owns acceptance and evidence sufficiency. Do not require the validator to launch subagents.\n\n## Workflow\n1. Run [repository preflight](../../../references/repository-preflight.md). Confirm the authorized repository, actual Git root, branch, and unrelated staged, unstaged, and untracked modifications to preserve. Capture the revision, changed paths, and a [requirement snapshot](../../../references/requirement-snapshot.md). Recover applicable accepted architecture decisions into `constraints` with the implementation snapshot's binding clauses as the baseline — see [architecture-decisions.md](../../../references/architecture-decisions.md). Extract with `--repository-id` and `--root` set to the owning repository. Compare with `python3 ../../../scripts/context_tools.py snapshot-compare -` on a JSON object with `baseline` and `current`, resolved from this plugin, not from the consumer working directory. Pass that JSON on standard input or a temporary file outside the consumer repository. Compare again before close-out. After an authorized write that changes those requirements, re-read and compare. Report constraint `clause-changed`, `removed`, and `added` ids. A disappeared, replaced, or no-longer-applicable decision is that delta. An unreadable or unsupported architecture source is `not-compared`. Do not declare the work ready against outdated requirements. Incomplete recovery is `not-compared`, not unchanged.\n2. Build the bounded handoff above. Then start a new independent `validator` delegation. Wait for that result, or for a documented unavailable/pending outcome, before treating the change as independently validated.\n3. Coordinate Bugbot in this chat — see [evidence-and-bugbot.md](references/evidence-and-bugbot.md). Do not ask the validator to invoke Bugbot.\n4. Keep findings, test results, and Bugbot status distinct. The independent validator assesses what each check actually demonstrates and classifies a failure as a regression this change introduced, a pre-existing failure with baseline evidence, an environment problem, or uncertain. Follow [verification evidence](../../../references/verification-evidence.md). Passing mocks do not prove deployed integration. Do not generate a new end-to-end suite, a new journey, or a first framework. Do not claim `create-e2e-tests` ran.\n5. Invalidated evidence is not current. If material code or configuration changes after a check, drop the affected validator and Bugbot results.\n6. For high-risk changes or materially stale review rules, identify the required review and approval. Dedicated governance integration is deferred. Do not widen documented review exceptions by implication.\n7. Before the closing report, run `python3 ../../../scripts/context_tools.py closeout-validate -` on a JSON payload of declared criteria, independent validation, Bugbot, requirement drift, blockers, and `ready_to_deliver`. Resolve the script from this plugin, not from the consumer working directory. Write the JSON to a temporary file outside the consumer repository, or pass it on standard input. Do not create that file inside the consumer repository. The helper checks coherence of declared data; it does not prove agents or tests ran and does not replace the independent `validator` or Bugbot. Unknown statuses fail closed. Then close with separate statuses, not a single \"done\": implementation; independent validation and criteria; tests, regression, and environment; Bugbot; requirement drift; blockers and delivery readiness. Required independent validation still pending means this flow is not complete. Return **ready for the developer to deliver** only when policy-required evidence is passed, including independent validation and Bugbot, and requirement drift is unchanged, or an explicit applicable policy records an approved exception for a named gate. A pending, partial, or execution-error Bugbot review is not passed. A required not-compared snapshot is not unchanged. Delivery means the developer commits, pushes, opens the pull request, obtains approvals, and merges with normal Git and pull-request tools. This skill does not commit, push, open a pull request, or merge. After showing that result, offer an optional Jira comment per [work record](../../../references/work-record.md). Publication is a separate approval.\n\n## In-run corrections\nDo not apply a fix when the user asked for review only or no modifications. Propose it instead.\n\nBefore the first edit, reuse repository preflight and the same implementation protections: stay in the authorized repository, preserve unrelated staged, unstaged, and untracked changes, and do not perform unauthorized external writes or apply/deploy operations. Do not run `terraform apply`, `sam deploy`, or an equivalent apply or deploy. Do not create or update a Jira record unless the user authorizes that write.\n\nApply a targeted fix in this run only when all of these hold:\n\n- the user did not ask for review only or no modifications;\n- the fix stays inside the authorized functional scope;\n- evidence justifies it;\n- it needs no new business decision and no unauthorized external operation.\n\nShared files may change when the authorized behavior requires it. Check affected contracts, consumers, and tests. Do not treat file paths as belonging to one Story. Do not require another slash command for those authorized in-scope fixes.\n\nIf the same failing check returns without material progress toward the cause, stop and report the diagnosis. Do not keep retrying. Do not change tests so they pass by dropping the expected behavior. Do not delete tests, add skips, weaken assertions, or update snapshots only to get a green result. Do not rerun the whole suite without a concrete reason.\n\nIf the fix needs a new business decision, hand off to `/plan-work`. If the approved technical design no longer applies, hand off to `/refine-story`. Do not claim those slash commands ran.\n\nAfter an applied fix, invalidate affected validator and Bugbot evidence. Start a **new** independent `validator` delegation for the delta and the affected tests, with a bounded handoff that includes the prior evidence matrix and those states. The new agent rechecks the delta. The closing report must still cover every acceptance criterion: keep standing evidence, drop invalidated evidence, add delta evidence, and carry open findings. Do not treat a delta-only result as complete validation. Do not rerun the whole suite without a concrete reason. Renew Bugbot for the new code state when the diff changed. Do not treat the earlier assessment as current.\n\n## Bugbot\n`validate-change` owns Bugbot. For a code change in this flow, attempt the real supported Bugbot invocation without asking the user to request it again. Use a supported host facility to run the official review-bugbot skill or the host `bugbot` subagent. If that facility is not available, ask the developer to run `/review-bugbot` and mark Bugbot pending. Never invent findings. Never claim it ran without a real result. Static contract tests in this plugin do not prove that Bugbot was invoked.\n\nDo not declare delivery ready while Bugbot is pending, partial, or an execution error, unless an explicit applicable policy permits an approved exception.\n\nRecord the repository, the reviewed diff and working-tree state, whether the run finished, whether the review was complete or partial, the findings, and later edits that invalidate that evidence.\n\nDistinguish a code finding from an execution error and from a partial review. An execution error is not a code finding. A partial review is not passed. A result of no bugs is not evidence that acceptance criteria passed. A pending review is not passed.\n\nUse **not-applicable** only with a concrete reason, for example that this run changed no code. Do not mark a code change not-applicable because the user did not mention Bugbot.\n\nObserve remote Bugbot only when it appears in actual configured checks; do not assume it is configured. This skill does not merge.\n\n## Output\nReturn distinct sections for implementation, independent validation and criteria (verified, failed, pending, or not-verifiable), tests/regression and environment, Bugbot with the code state reviewed, and blockers or delivery readiness. Required independent validation pending is not a completed flow.\n\n## Reference loading\nThe links below are an allowlist. Do not open every file at the start of the run.\n\n- [repository preflight](../../../references/repository-preflight.md) at the start of the run.\n- [requirement snapshot](../../../references/requirement-snapshot.md) when capturing or comparing requirements.\n- [architecture decisions](../../../references/architecture-decisions.md) when recovering constraints.\n- [skill composition](../../../references/skill-composition.md) when dispatching the validator.\n- [validator.md](../../../agents/validator.md) when using a general-purpose subagent as bounded task context.\n- [evidence-and-bugbot.md](references/evidence-and-bugbot.md) when coordinating Bugbot.\n- [verification evidence](../../../references/verification-evidence.md) when classifying checks and failures.\n- [approval-contract.md](../../../references/approval-contract.md) when a write or exception needs approval.\n- [work record](../../../references/work-record.md) when offering the optional Jira comment.\n- [criterion identifiers](../../../references/criterion-ids.md) when criteria ids are in play.\n- [end-to-end environment](../../../references/e2e-environment.md) only when an existing end-to-end check is in play.\n- [model evaluation](../../../references/model-evaluation.md) only when the change affects model or generative-system behavior.\n","inbound":[".cursor/skills/implement-change/SKILL.md"]},{"id":".cursor/skills/validate-change/references/evidence-and-bugbot.md","kind":"reference","name":"Evidence and Bugbot","summary":"Real Bugbot invocation, complete/partial/error distinction and code-state binding.","words":418,"chars":2671,"lines":31,"links":["references/verification-evidence.md"],"headings":[{"text":"Evidence and Bugbot","line":1}],"source":"# Evidence and Bugbot\n\nEvidence identifies the checked revision, uncommitted state, command or inspection performed, result, and acceptance criterion covered. A test command that did not run is unavailable, not passed. Sufficiency — what a check actually exercised versus replaced, regression versus a pre-existing failure, and the close-out — lives in [verification evidence](../../../../references/verification-evidence.md). Passing mocks do not prove deployed integration.\n\n`validate-change` owns Bugbot coordination in the main chat, separately from the independent `validator`. Do not require the validator to launch Bugbot. For a code change in this flow, attempt the real supported Bugbot invocation without asking the user to request it again. Use a supported host facility to run the official review-bugbot skill or the host `bugbot` subagent. If that facility is not available, ask the developer to run `/review-bugbot` and mark Bugbot pending. Never invent findings. Never claim it ran without a real result.\n\nDo not declare delivery ready while Bugbot is pending, partial, or an execution error, unless an explicit applicable policy permits an approved exception.\n\nA launch of Bugbot in another chat does not count as this run's review. Static contract tests in this plugin do not prove that Bugbot was invoked.\n\nRecord, for the review that actually ran:\n\n- repository;\n- reviewed diff and working-tree state;\n- whether the run finished;\n- whether the review was complete or partial;\n- findings, or a visible no-bugs result;\n- later edits that invalidate that evidence.\n\nStatus vocabulary:\n\n- **passed** — a complete review finished and reported no code findings;\n- **failed** — a complete review finished with code findings;\n- **partial** — some but not all of the intended diff was reviewed;\n- **execution-error** — the review did not run or did not return a real result;\n- **pending** — waiting for the developer or the host to run it;\n- **not-applicable** — used only with a concrete reason, for example that this run changed no code.\n\nAn execution error is not a code finding. A partial review is not passed. A pending review is not passed. A result of no bugs is not evidence that acceptance criteria passed. Later edits invalidate the Bugbot evidence tied to the previous code state.\n\nRemote Bugbot depends on actual repository and pull-request settings. Do not promise remote execution, deduplication, or billing behavior. `validate-change` records Bugbot status from the result this run obtained, from evidence the developer supplies, or from checks that are actually visible. It does not merge, and it does not infer a result that was not observed.\n","inbound":[".cursor/skills/validate-change/SKILL.md"]},{"id":"MANUAL_EVALUATION.md","kind":"package","name":"Manual evaluation checklist","summary":"Manual evaluation checklist","words":14179,"chars":93574,"lines":388,"links":["references/context-retrieval.md",".cursor/skills/sync-context/references/context-quality.md",".cursor/skills/sync-context/references/architecture-discovery.md"],"headings":[{"text":"Manual evaluation checklist","line":1}],"source":"# Manual evaluation checklist\n\n- [ ] Merge a `feat:` or `fix:` commit to `main` and confirm `plugin.json`, `CHANGELOG.md`, tag `vX.Y.Z`, and a GitHub Release update together.\n\n- [ ] Install the plugin into a clean consumer and confirm all seven skills and seven agents are discovered.\n\nCursor runtime smoke (not covered by `python3 tests/*.py` or `.github/workflows/ci.yml`; those jobs are static layout and helper checks only):\n\n- [ ] **Plugin discovery in Cursor.** Install `simplified-ai-dlc-lifecycle` from Team Marketplace or the documented local clone. Reload the window. Confirm agent chat offers `/sync-context`, `/scaffold-project`, `/plan-work`, `/refine-story`, `/implement-change`, `/validate-change`, and `/create-e2e-tests`. This is the only check that the host actually loaded the plugin. Not executed.\n- [ ] **Implement-change continues into validate-change in Cursor.** In a disposable consumer, authorize `/implement-change` to continue into validation in the same request. Confirm validation actually follows and the run does not claim the user typed `/validate-change`. Not executed.\n- [ ] Run `scaffold-project` in an empty authorized destination. Confirm it presents an approved minimal proposal before writing, preserves existing files, writes a concise README, and reports actual validation results.\n- [ ] Run `scaffold-project` in an existing application. Confirm it proposes a bounded addition or stops for clarification without overwriting the application.\n- [ ] Run `sync-context` against a small behaviorful single-module service (API handler, database, external integration, authentication, retries/errors). Confirm it creates `AIDLC_CONTEXT.md`, is not treated as index-only merely because it is single-module, and that `## Material architecture details` preserves the important discovered information rather than reducing it to one-line Coverage rows.\n- [ ] Run `sync-context` against a genuinely trivial repository (documentation-only, trivial metadata/config, or an extremely small passive types/constants package). Confirm index-only behavior is an empty `## Modules` table with no module row pointing nowhere, and that validation still passes.\n- [ ] Run `sync-context` against a monorepo. Confirm it creates `\u003cmodule-root>/AIDLC_CONTEXT.md` only for meaningful architectural modules.\n- [ ] Run initial discovery in a clean repository with no prior context. Confirm it finds representative modules without claiming every source file was read.\n- [ ] Re-run as incremental refresh after a shared contract changes. Confirm affected consumers expand while unrelated contexts remain unchanged.\n- [ ] Run `sync-context` against two accessible Git roots. Confirm the short index distinguishes both roots, links to their colocated contexts, and adds `integration-map.md` only after a verified cross-repository dependency.\n- [ ] Use a read-only source repository with an authorized writable artifact home. Confirm the index and fallback context save there without modifying the source root.\n- [ ] Use a non-writable module root. Confirm the index links to `aidlc-docs/context/\u003crepo-id>/\u003cmodule-id>.md` fallback instead of writing in the source tree.\n- [ ] Confirm `repo-id` is stable across clones: persisted ID, or canonical remote when no ID exists; never an absolute checkout path.\n- [ ] Re-run `sync-context` without relevant source changes. Confirm it preserves human content and does not rewrite unaffected module context.\n- [ ] Change one module after context generation. Confirm only that module is refreshed and stale evidence is flagged.\n- [ ] Confirm context retrieval reads the short index first, then selected colocated `AIDLC_CONTEXT.md` or its fallback, then current source and tests for implementation or review.\n- [ ] Decline the proposed BUGBOT files. Confirm the artifact-home `.ai-dlc-config.md` records `## Bugbot decisions` and later sync runs do not prompt again.\n- [ ] Approve a proposed BUGBOT file in a disposable repository. Confirm only the previewed file is written and existing BUGBOT content is preserved.\n- [ ] Use a module with a distinct runtime or invariant. Confirm a nested BUGBOT proposal is created only for that boundary and does not repeat the root file.\n- [ ] Confirm each proposed Bugbot rule names an observed path plus helper, interface, or invariant, and avoids formatter or generic-security guidance.\n- [ ] Confirm generated, vendor, build, coverage, lockfile, and fixture directories receive no BUGBOT files.\n- [ ] Confirm BUGBOT guidance is not reported as Bugbot execution.\n- [ ] **Sync-context can start from a natural-language request.** In Cursor, ask to refresh repository context without typing `/sync-context`. Confirm this skill can be selected, and that `/plan-work` or `/implement-change` is not selected from that phrasing. Not executed.\n- [ ] **Plan-work does not load the Jira story template during product questions.** During step 2 of a new User Story, confirm `jira-story-template.md` is not opened. Confirm it is opened only when preparing the publication payload. Not executed.\n- [ ] **Independent review handoff names pass reason, draft version, and delta.** On a first product review, confirm the reviewer receives first-pass reason and a draft version. After a material revision, confirm the second handoff names the delta and does not resend the whole chat. Not executed.\n- [ ] **Canvas run cost shows unavailable rather than zero.** Close a `/plan-work` run with no host usage summary. Confirm the Canvas does not show 0 tokens as if they were measured. Not executed.\n- [ ] **Optional Cursor observation hooks are not installed in a clean consumer.** Install the plugin into a disposable consumer. Confirm `.cursor/hooks.json` does not gain `observe.py` unless someone copied `optional/cursor-observation/` on purpose. Not executed.\n- [ ] Run a single Story intake. Confirm the draft becomes ready for review, product review is requested, and publication needs an exact approved change set.\n- [ ] **Plan-work Validation Notes placeholder when they only restate ACs.** Draft a Story whose Acceptance Criteria are complete and the Product Owner supplies no extra validation information. Confirm the draft does not paraphrase the ACs as validation, and the default Jira payload keeps the Validation Notes heading with the reader-facing placeholder rather than invented or restated criteria. Not executed.\n- [ ] **Plan-work valid extra validation scenario.** An Acceptance Criterion already says the order list shows each order's status, and the Product Owner asks to exercise it with an account that has both a completed order and one still in progress. Confirm that covering condition appears as validation guidance and does not change the Acceptance Criterion. Not executed.\n- [ ] **Plan-work Testing cannot introduce new behavior.** The model considers adding \"unauthenticated users redirect to `/login`\" but no source defines that behavior. Confirm it is not put into Testing and becomes an Open Question instead. Not executed.\n- [ ] **Plan-work Goals placeholder without a metric.** Draft a Story with no Product Owner or evidence-supplied success measure. Confirm the draft does not invent a metric, and the default Jira payload keeps the Goals & Metrics heading with the reader-facing placeholder. Not executed.\n- [ ] **Plan-work explicit Story-level metric preserved.** The Product Owner supplies a Story-specific success measure that is not already an Acceptance Criterion. Confirm it is preserved as a goal or measure, not rewritten as an Acceptance Criterion. Not executed.\n- [ ] **Plan-work ambiguous status surfaces an Open Question.** A requirement says \"display stored status\" with no evidence whether that is internal or user-facing. Confirm an Open Question is produced rather than silently choosing one meaning. Not executed.\n- [ ] **Plan-work ambiguous unauthenticated access uses evidence then asks.** A requirement says signed-out visitors cannot access the data, but the resulting experience is undefined. Confirm existing conventions or design are used when they resolve it; otherwise an Open Question is surfaced. Not executed.\n- [ ] **Plan-work Story-specific design reference included.** A concrete Figma file, frame, or section relevant to this Story exists. Confirm that artifact is included as the Story-level design reference. Not executed.\n- [ ] **Plan-work project-level Figma is not copied into the Story.** Project references include a Figma workspace, but no Story-specific artifact exists. Confirm the Story does not copy the whole project-level Figma configuration. Not executed.\n- [ ] **Plan-work design versus AC conflict is surfaced.** Acceptance Criteria require error and empty states to be distinguishable, and the referenced design shows the same UI for both. Confirm the conflict is surfaced to the Product Owner rather than silently choosing one source. Not executed.\n- [ ] **Plan-work approved scope exclusions survive the Jira payload.** Approve a Story whose exclusions say it displays existing order information and that updating status and historical paid prices are out of scope. Confirm the published Jira description still contains those boundaries in Scope / Out of Scope, not only in chat. Not executed.\n- [ ] **Plan-work existing Story-specific design link survives update-existing.** Update a Story that already has a concrete Figma URL or node identifier. Confirm the proposed diff keeps that reference unless the Product Owner replaces it, and does not substitute the project-level Figma URL. Not executed.\n- [ ] **Plan-work supplied design link is not described as inspected without access.** The Product Owner supplies a Figma URL and the host tool cannot read it. Confirm the Story keeps the link as confirmed and unverified, and the report does not claim that frames or contents were inspected. Not executed.\n- [ ] Run an Epic intake. Confirm overlapping Stories and missing outcome coverage are reported.\n- [ ] Run a backlog proposal. Confirm dependencies are identified without inventing sprint capacity.\n- [ ] Update an existing Story. Confirm unrelated fields are preserved in the proposed diff.\n- [ ] Confirm `plan-work` does not run a standalone duplicate search before product review. If an obvious duplicate is already referenced or appears while reading a candidate parent, it is surfaced. Disconnecting Jira is not reported as \"no duplicates.\"\n- [ ] Disconnect Jira during a prepared operation. Reconnect and confirm the draft resumes without restarting i ion follows what the workflow checks. A workflow that only enforces retired Markdown artifacts can be proposed for retirement. A workflow that also enforces tests or branch protection is not retired merely because this plugin has no workflow of the same name.\n- [ ] Confirm a repository classified as a shared methodology checkout is never offered retirement option A (migrate and delete) in this workflow, even if the user asks to delete it.\n\nMulti-root workspace, sibling-context retrieval, and scaffold membership\n(instruction behavior; not proved by the Python tests). The deterministic\nhelpers behind these scenarios -- `parse_related_repositories`,\n`match_related_repositories`, `detect_repository_id_collision`,\n`detect_canonical_remote_collision`, `resolve_related_context_index`,\n`checkout_deletion_readiness` -- are unit-tested as pure functions in\n`tests/context_tools_tests.py` against supplied inputs. That is a different\nclaim from the one these checklist items make. A test asserting that\n`SKILL.md` references `context-retrieval.md` proves wiring exists in the\ninstructions; it does not prove Cursor actually followed those instructions\nin a live run. Every item below is unproven until actually performed in\nCursor, and none of it should be reported as passed on the strength of the\nPython test suite alone:\n\n- [ ] Open the same multi-root `.code-workspace` in the Cursor IDE and in a local Agents Window. Confirm the same set of intended repositories is available and discoverable in both.\n- [ ] In that workspace, run a context-consuming skill against one repository and confirm it actually reads the relevant sibling's context (not just this repository's own), per [context-retrieval.md](references/context-retrieval.md), \"Resolving related repositories.\"\n- [ ] Repeat the same run with one declared sibling repository not open or unavailable this session. Confirm the agent reports that repository as unavailable and continues with the rest of the task, rath her value is inferred or written.\n- [ ] Confirm the same Jira project across several repositories in one engagement. Confirm the agent asks once and reuses that confirmation, instead of asking the same question for every repository.\n\nProduct Owner planning with `plan-work` (instruction behavior; not proved by the Python tests — `validate_work_item_type`, `validate_plan_item_id`, `validate_parent_reference`, `validate_dependency_graph`, `topological_plan_order`, `plan_outcome`, `jira_mutation_authorized`, `decision_reprompt_allowed`, and `plan_validate_proposal` are unit-tested as pure functions in `tests/context_tools_tests.py`, but none of them prove the agent's Product Owner judgment below, or that the agent actually calls `plan_validate_proposal` / `context_tools.py plan-validate` during a real run; every item here is unproven until actually run in Cursor):\n\n- [ ] Ask `/plan-work` to define a User Story with a short, incomplete request. Confirm it asks only the small number of Product Owner questions that genuinely fill a gap, not a generic questionnaire.\n- [ ] Ask `/plan-work` to define the same User Story but supply complete information up front. Confirm it does not ask a redundant question the request already answered.\n- [ ] Ask `/plan-work` to define an Epic. Confirm the conversation and the resulting draft stay at Epic granularity, with no premature decomposition into implementation tasks unless explicitly requested.\n- [ ] Ask `/plan-work` to define a technical Task, for example configuring an API Gateway integration. Confirm the draft is not rewritten as a fake \"As a developer, I want...\" Story.\n- [ ] Ask `/plan-work` to define a brand-new Epic or Story in a repository with no `/sync-context` output yet (no code exists for this capability). Confirm business-only planning proceeds — facts, constraints, assumptions, draft content — and that only the technical-feasibility part is marked \"not yet assessed\" rather than the whole draft being blocked r example a Task declaring itself as its own parent, or two items with a duplicated dependency edge. Confirm the agent actually runs deterministic validation (`context_tools.py plan-validate` over the staged proposal, or the equivalent direct calls) before requesting independent review, and that the reported failure blocks moving to review rather than being silently skipped.\n- [ ] Complete a draft and mark it ready for review. Confirm an independent `product-reviewer` assessment actually runs (or is reported unavailable with a reason) before publication approval is requested.\n- [ ] Deliberately draft a weak Story: a vague outcome, an untestable acceptance criterion, and a hidden assumption. Confirm the independent review returns meaningful findings that name each problem.\n- [ ] Draft a genuinely strong, complete Story. Confirm **no findings** is accepted as a valid, complete review result, and that the skill does not manufacture a finding to prove review happened.\n- [ ] Have the reviewer identify a finding that would change product scope, behavior, assumptions, or intent. Confirm the main chat surfaces that finding to the Product Owner for a decision rather than silently applying it.\n- [ ] Approve the local plan but withhold approval for the Jira mutation. Confirm nothing is created or changed in Jira, and the report distinguishes the approved local plan from the still-unauthorized Jira write.\n- [ ] During an early planning conversation (before the Story's content is agreed), confirm `plan-work` does not interrupt with the Jira description-template question. Only once the draft is ready and the agent is preparing the Jira write payload should it read the `## Planning template` decision and, when appropriate, offer the template.\n- [ ] Run `/plan-work` for the first time in an engagement with no `## Planning template` decision, through to the point of preparing a Jira write. Confirm it offers the default User Story description once at that point and lets the Product Owner accept, edit, or decline it. Run it again after an approval and confirm it does not offer the template again. Defer it instead, start a new run, and confirm it is offered again (not permanently suppressed merely because a `## Planning template` section now exists).\n- [ ] **Plan-work AC field available is not duplicated in Description.** Publish a User Story whose issue type has a writable acceptance-criteria field. Confirm the criteria are in that field, the description does not repeat them, and the payload showed that location before approval. Not executed.\n- [ ] **Plan-work confirmed missing AC field uses Description fallback.** Publish to a project whose Story type has no acceptance-criteria field. Confirm the criteria appear last under Acceptance Criteria in Description, with no operational disclaimer about fields, MCP, or fallback in the ticket. Not executed.\n- [ ] **Plan-work inaccessible AC metadata is not treated as absent.** Simulate an access error or incomplete issue-type metadata when discovering the acceptance-criteria field. Confirm the run reports uncertainty, agrees the destination with the Product Owner, and does not publish as if the field were confirmed missing. Not executed.\n- [ ] **Plan-work AC field exists but is not writable.** Discover an acceptance-criteria field that exists but cannot be written. Confirm the run does not assume Description fallback, reports the limitation, and agrees the destination in the approved payload. Not executed.\n- [ ] **Plan-work review runs with open product questions.** Finish a drafting round while at least one product question is still open. Confirm independent review still runs (or is reported unavailable), the reviewer is given those questions, and findings name which ones block implementation or publication. Confirm the draft is not called ready to implement until those blockers are resolved. Not executed.\n- [ ] **Plan-work reviewer Blocker leaves the item blocked.** Run independent review rk` asks once, in plain language and with draft identifiers (\"Story A blocks Story B\"), creates the issues, then creates the link with the keys Jira returned. Confirm it maps that sentence using the discovered link type's own inward and outward labels, re-reads the link, and stops to ask if the stored relationship does not mean the approved sentence. Confirm it does not ask for a second approval only because the keys did not exist yet.\n- [ ] Prepare a Jira write payload and confirm `plan-work` offers Priority, Labels, Fix Version, Sprint, and Story Points in that same confirmation, each with its evidence (an existing sprint, pointed issues from the same team and estimation convention, labels already used by the parent Epic, stated urgency, an existing project version). Confirm the Product Owner can accept, edit, or skip any of them in that one reply, and that a skipped value is not written.\n- [ ] Ask for a Story Points suggestion when no pointed issue shares the same team, estimation convention, and similar scope. Confirm `plan-work` does not suggest a number. If the Product Owner then supplies a number, confirm the payload labels it a human estimate.\n- [ ] Draft an Epic from a short request that omits the expected outcome. Confirm `plan-work` says that context is missing instead of inventing it.\n- [ ] Ask for a Sprint suggestion when no sprint exists yet, or the board does not support sprints. Confirm `plan-work` reports that rather than inventing a sprint, a date, or team capacity, and that this is distinct from Sprint Backlog mode's own capacity-planning rule.\n\nTechnical refinement with `refine-story` (instruction behavior; not proved by the Python tests — the structural checks in `tests/skill_contracts.py` confirm the required language is present in the skill and its references, not that Cursor follows the workflow or that a Jira write succeeds; every item below is unproven until actually run in Cursor):\n\n- [ ] Hand `refine-story` an Epic that genuinely supports technical enablement, dependencies, or decomposition. Confirm it refines the Epic directly instead of forcing selection of an artificial intermediate Story.\n- [ ] Hand `refine-story` an Epic that is missing essential business scope (for example, no stated expected outcome). Confirm it returns that gap to the Product Owner through a `/plan-work` handoff instead of guessing the missing scope.\n- [ ] As the developer, propose an approach with a real technical flaw — for example, one that ignores an existing contract or breaks a known caller. Confirm the challenge step names the flaw with evidence from the code actually read, and that the developer can accept, rebut, or revise it.\n- [ ] As the developer, propose an approach with no legitimate technical concern. Confirm the challenge step says what was checked and does not invent an objection just to appear thorough.\n- [ ] Refine a change that touches both the database and the frontend but has one coherent, independently useful outcome. Confirm it stays one technical item rather than splitting by layer.\n- [ ] Refine a change with a concrete reason to split — for example, two parts with independent deployment or different ownership. Confirm it splits only with that reason stated, not by default.\n- [ ] Run `refine-story` in a project where a DevOps-task-split policy is an active, applicable workspace rule. Confirm the split is respected and explained in that policy's own terms. Run it again in a project with no such policy. Confirm `refine-story` does not invent or assume that split just because it exists in this development workspace.\n- [ ] Seed a deliberate defect in a drafted technical proposal — for example, a missing consumer or an untestable technical acceptance criterion. Confirm the independent `refinement-reviewer` assessment actually runs and names the defect before publication approval is requested.\n- [ ] Run `refine-story` on a host where independent delegation is unavailable, on a change that eld. Confirm the same approved payload offers them as a Technical acceptance criteria section in the description. Decline that location and confirm publication stays pending, the criteria are not dropped, and the handoff is not reported complete.\n- [ ] **Refine-story AC field exists but is not writable.** Discover a technical item whose acceptance-criteria field exists but cannot be written, or whose field metadata cannot be read. Confirm the run does not write to that field, does not treat it as absent, agrees the destination in the approved payload, and keeps publication pending until that destination is approved. Not executed.\n- [ ] After an approved write, confirm the read-back checks that the technical criteria are actually stored on the issue. If they are missing, confirm the handoff is not reported complete.\n- [ ] Start from an approved standalone technical draft that has no parent. Confirm `refine-story` does not force a `/plan-work` handoff or an artificial parent. Start from a draft that has neither approved business scope nor approved standalone technical scope. Confirm it does hand off to `/plan-work` before creating a Task or Subtask.\n\nContext quality across repository types (instruction behavior; not proved by the Python tests — `validate_generated_context`'s mechanical checks are unit-tested in `tests/context_tools_tests.py`, but none of them judge semantic quality; every item below is unproven until actually run against a real repository of that type). For each scenario, evaluate the generated context against these nine quality dimensions, defined in [context-quality.md](.cursor/skills/sync-context/references/context-quality.md) and [architecture-discovery.md](.cursor/skills/sync-context/references/architecture-discovery.md):\n\n1. **Accuracy** — every `verified` or `partial` claim matches the source it cites.\n2. **Completeness** — the dimensions that matter for this module's actual responsibility are covered, not padded with irrelevant ones.\n3. **Runtime flows** — at least one representative end-to-end flow is documented when the module has one.\n4. **Honest unknowns** — a genuine gap is recorded as `unknown` with what is missing, never filled with an invented behavior.\n5. **Evidence citation** — every verified or partial claim names a repository-relative path plus the relevant symbol, route, table, or configuration key.\n6. **Right-sized, not gamed** — length tracks what the module actually has to say; no padding toward a target, no truncation of real detail to dodge the guideline ceiling.\n7. **Coverage table correctness** — each `## Coverage` row's state is backed by what was actually inspected, not a convention guess. Coverage is a summary; material architecture belongs in `## Material architecture details`.\n8. **Independent review depth** — `context-reviewer` findings (or the lack of any) are split into accuracy and completeness, and an honest unknown is not reported as a defect.\n9. **Right-tiered effort** — the sync used the exploration depth its tier (initial/full, material change, or small factual update) actually calls for: not a full architecture pass for a one-line config fix, and not a one-line pass for a new integration.\n\n- [ ] Before treating this quality redesign as proven, run `/sync-context` against at least one real REST service, one Terraform or infrastructure repo, and one small frontend or utility, and compare the result with the previous index-only or shallow output. Unit tests cannot prove this.\n\n- [ ] **Small single-file utility or library module** (a handful of pure functions, no I/O). If it is listed as a module, it still has its own `AIDLC_CONTEXT.md`. Confirm the architecture inventory evaluates dimensions such as security, error handling, retry/idempotency, and deployment as `not applicable` with a real reason. Confirm the published Coverage table does not pad every N/A dimension — it includes an N/A row only when the absence is important or non-obvious — and that this short document still answers the quality-bar questions in context-quality.md that actually apply to it.\n- [ ] **REST/HTTP API service with an external integration** (for example a payment or email provider client). Confirm entry points, the external call site, retry/idempotency behavior, and at least one runtime flow from request to external call to response are all documented with evidence, not just the route existing.\n- [ ] **Event-driven or asynchronous background worker** (a queue consumer or scheduled job). Confirm the delivery guarantee the code actually relies on (at-least-once, ordering, idempotency) is stated from the code, not assumed from a comment, and that a downstream consumer of anything this worker publishes is identified.\n- [ ] **Frontend or UI application module.** Confirm state management, the API calls it makes, and user-facing error handling are covered, not just component existence and routing.\n- [ ] **Infrastructure-as-code or Terraform repository.** Confirm the deployment topology dimension documents what actually provisions what, with resource names and files, and that a security- or access-boundary claim is backed by the actual policy or resource definition, not a assumed convention.\n- [ ] **Monorepo with several independent packages.** Confirm each meaningful package gets its own `AIDLC_CONTEXT.md` only where it has a distinct responsibility, that a shared package used by several others has its consumers listed, and that exploration was not dispatched one subagent per package by default for a monorepo small enough for one pass.\n- [ ] **Multi-repository engagement (two or more Git roots).** Confirm the repository index stays `multi-repository` with a `Repository` column, a cross-repository dependency is only recorded in `integration-map.md` once actually verified, and exploration scope stayed within the repository actually being synced rather than silently expanding to a sibling.\n- [ ] **Repository with stale or misleading prior context** (an existing `AIDLC_CONTEXT.md` that no longer matches current code). Confirm the refresh flags the stale claim explicitly, cites the current source that contradicts it, and does not silently keep the old prose because the fingerprint happened to still read `unchanged` for an unrelated reason.\n- [ ] **Repository with a security- or payment-sensitive module** (handles authentication, authorization, or payment data). Confirm the security-and-trust-boundary dimension is not marked `not applicable` without a specific, correct reason, and that secrets or sensitive values are never copied into the generated document even as an example.\n- [ ] **Repository with heavy persistence and several external integrations** (a service with its own database plus two or more third-party API clients). Confirm the data-model/persistence dimension and each integration are each covered with their own evidence, not collapsed into one generic \"talks to a database and some APIs\" sentence.\n\nRegression scenarios that must never pass review or be reported as a successful sync (see [context-quality.md](.cursor/skills/sync-context/references/context-quality.md), \"What good and bad look like\"; the fixture at `tests/fixtures/context_review/` demonstrates three of these four seeded into one module):\n\n- [ ] **Shallow service context.** A module with real external calls, state, or a trust boundary produces a context document that only restates framework scaffolding (a route exists, a controller exists) with no runtime flow and no failure-mode mention. Confirm `context-reviewer` reports this as a completeness finding, not a pass.\n- [ ] **False completeness.** A coverage row, an `Examined` field, or prose claims a dimension is `verified` when the cited evidence does not actually back it (see `tests/fixtures/context_review`'s `false-completeness-coverage` seeded defect: a `verified` idempotency claim for code that has no idempotency guard at all). Confirm this is reported as an accuracy finding with severity blocker or major, never waved through because the prose reads confidently.\n- [ ] **Length gaming.** A document is padded toward its target line count with generic, non-specific prose (\"this module handles orders and ensures reliability\") instead of specific, evidence-backed statements. Confirm `context-reviewer` or a human reviewer flags the padding as a completeness problem even though the document is \"within budget,\" and confirm that the absence of a `modules:budget` validation check is never cited as proof the document is actually complete.\n- [ ] **Honest unknown must beat invented behavior.** Compare two drafts of the same module, one that marks a genuinely uninspected dimension `unknown` with what is missing, and one that fills the same gap with a plausible-sounding but unverified behavior. Confirm review treats the honest `unknown` draft as acceptable (not a finding) and the invented-behavior draft as a defect, even if the invented text happens to be true — the problem is that it is unverified, not that it is wrong.\n\nHardening scenarios for architectural preservation, index-only representation, evidence catalog, and secret safety (instruction behavior; not proved by Python):\n\n- [ ] **A. Behaviorful single-module service.** One service or module with an API handler, database, external integration, authentication, and retries or errors. Confirm it gets `AIDLC_CONTEXT.md`, is not treated as index-only merely because it is single-module, and that Material architecture details preserve the important discovered information.\n- [ ] **B. Truly trivial repository.** A genuinely passive or documentation-only repository. Confirm index-only is an empty `## Modules` table (or equivalent explicit representation) and that validation remains compatible — no module row with a missing Context target.\n- [ ] **C. Rich architecture preservation.** Have `context-architect` discover persistence, auth, retries, a feature flag, and an external integration. Confirm the final context does not reduce all of that knowledge to only one-line Coverage rows.\n- [ ] **D. Secret safety.** A repository containing `.env`, environment-variable references in source, and secret-manager configuration. Confirm explorer and reviewer describe secret handling without opening or reproducing actual secret values.\n- [ ] **E. Evidence catalog.** Confirm material local evidence paths used throughout Coverage, runtime flows, Material architecture details, and constraints also appear in `## Evidence and existing docs`.\n- [ ] **F. Honest partial coverage.** Only part of a security flow can be inspected. Confirm the Coverage state is `partial`, not incorrectly `verified`.\n\n- [ ] **Initial behaviorful service.** Run `/sync-context` against a small-but-behaviorful service. Confirm `context-architect` is preferred when available, rich context is generated, and runtime behavior or material architecture is preserved.\n- [ ] **Reviewer unavailable.** Run in an environment without independent subagent delegation. Confirm the proposal can still be presented, independent review is explicitly reported unavailable, quality assurance is reported partial, self-review is not presented as equivalent, and persistence requires explicit approval.\n- [ ] **Empty structural context.** Confirm an almost-empty `AIDLC_CONTEXT.md` cannot pass mechanical validation just because `## Identity and scope` exists. Missing `## Coverage`, `## Evidence and existing docs`, or `## Unknowns` must fail.\n- [ ] **Evidence catalog missing.** Confirm a generated module context without `## Evidence and existing docs` fails structural validation.\n- [ ] **Evidence exists but no local paths.** Confirm the deterministic result is `not_applicable` with `no local evidence paths to resolve`, and does not say semantic evidence validation passed.\n\nScaffold-project foundation and review (instruction behavior; not executed — a structural test does not prove Cursor followed this workflow):\n\n- [ ] **Empty directory without a Git root.** Run `scaffold-project` in an empty authorized directory that is not a Git repository. Confirm the proposal appears before any write, the baseline is `unversioned`, no commit SHA or remote is invented, and `git init` is not run. Confirm a `Related repository` entry is deferred only when that referenced repository's remote cannot be established.\n- [ ] **Existing Git repository without a remote.** Run `scaffold-project` in a Git repository that has a HEAD revision and no remote. Confirm the recorded baseline is that real revision, `Canonical remote` is omitted, an already persisted repository ID is kept, and Git is not re-initialized.\n- [ ] **Git working tree without commits and without a remote.** Run `scaffold-project` in a Git repository that has no commits and no remote. Confirm it stays a Git working tree, the baseline is `no-commit`, file discovery stays Git-based, no SHA is invented, and the scaffold is not blocked.\n- [ ] **Git working tree without commits but with a configured remote.** Same destination, with a real remote configured and no commits. Confirm the remote can be recorded, the baseline is still `no-commit`, and the remote is not treated as proof that a commit exists.\n- [ ] **New project without a remote referencing a confirmed sibling.** Scaffold `payments-web` with no remote of its own, and a confirmed membership whose sibling `payments-api` has verified remote `github.com/example/payments-api`. Confirm the outgoing reference is recorded and the reverse reference is not written into the sibling.\n- [ ] **Referenced repository whose remote is unavailable.** Propose two `Related repository` entries and leave one target remote unknown. Confirm only that entry is deferred, with that entry named and the reason stated, and the entry with a real remote is kept.\n- [ ] **Existing persisted repository identity remains unchanged.** Scaffold a destination that already has a persisted repository ID and has no remote. Confirm the skill does not ask for a new ID.\n- [ ] **Bounded addition to an existing monorepo.** Approve a scaffold that must edit one existing manifest or workspace file. Confirm only the named edit lands, unrelated content and local changes stay, and an ambiguous or conflicting edit stops for clarification instead of overwriting the file.\n- [ ] **Approved creation then an approved manifest edit.** Approve creating a source file and editing an existing manifest. Confirm that after the source file is created, the manifest edit proceeds without a new approval caused only by that creation.\n- [ ] **External edit before the manifest write.** After approval, and before the manifest is written, change that manifest outside the run. Confirm the edit is preserved and detected, and the approved text is not written over it.\n- [ ] **Path expected to be absent already exists.** Approve a new file. Create that path from outside the run before the scaffold writes it. Confirm the existing file is preserved and not overwritten.\n- [ ] **Partial apply reported honestly.** Apply part of an approved change set, then introduce an unexpected edit. Confirm the run stops, names what was already applied and what remains pending, does not roll back, and does not claim the writes were atomic.\n- [ ] **Independent reviewer unavailable.** Generate a runnable application or library when this host cannot run an independent subagent. Confirm the scaffold can still be written, independent review is reported as not performed, a self-review is not labeled independent, and the required review stays pending.\n- [ ] **Real defect caught during review.** Scaffold a small runnable project that contains one concrete defect, such as a start script that points at a missing entrypoint. Confirm `implementation-reviewer` (or the general-purpose review that was given that agent file) reports the defect from the generated files, and that a fix outside the approved scope is not applied without a new approval.\n- [ ] **Scaffold-project always dispatches independent reviewers.** Scaffold a runnable application. Confirm a new independent `implementation-reviewer` and a new independent `context-reviewer` actually run, the implementing chat does not score its own files, and a generated web app, API, or infrastructure is not treated as a documented review skip. Static plugin tests do not prove this. Not executed.\n- [ ] **Scaffold-project code changes trigger Bugbot by default.** Scaffold a project that creates code. Confirm the main chat attempts the real Bugbot facility without asking the user to request it again, that writing `BUGBOT.md` is reported separately from that review, and that a missing facility is marked pending rather than invented. Not executed.\n- [ ] **Scaffold-project does not skip Bugbot after reviewer findings.** After independent scaffolding and context reviews, confirm the chat still attempts Bugbot. Confirm that explaining `BUGBOT.md` is later guidance, that no pull request was opened, or that Git or Jira identity was filled in later, does not replace that run. Not executed.\n- [ ] **Generic product request with no detail.** Ask `scaffold-project` to \"create an e-commerce project\" with no further detail. Confirm it asks about purpose, users or consumers, the primary interaction, and initial scope before finalizing any stack or architecture, and does not propose a backend, a database, or infrastructure before that purpose is established.\n- [ ] **Detailed request already supplies the facts.** Supply purpose, users, and the primary interaction up front in the request. Confirm the proposal summarizes those facts instead of asking again, and asks a follow-up only about a genuinely material gap.\n- [ ] **Explicitly generic starter.** State that the purpose is not yet known and a generic technical starter is wanted. Confirm the proposal states that limitation plainly and stays deliberately minimal instead of inventing a product, a persona, or a business journey.\n- [ ] **Static website does not gain a backend.** Request a static website. Confirm the proposal does not add an API, a database, authentication, or AWS infrastructure merely because the broad category could support them.\n- [ ] **Standalone folder inside an unrelated parent Git repository.** Scaffold a new, untracked folder inside an existing, unrelated checkout, with no monorepo membership confirmed. Confirm `classify_repository_scope` reports the `untracked-tree` kind, the destination's baseline, revision, and remote stay independent of that parent repository, and the parent repository is not modified.\n- [ ] **Explicitly requested new module inside an existing monorepo.** Confirm membership in an existing monorepo through an explicit answer, then scaffold a new module inside it. Confirm the module inherits that repository's already-confirmed identity (its real revision and remote, when they resolve) and the write scope stays bounded to the files this run actually proposed.\n- [ ] **New module plus an approved root workspace manifest.** Confirm a new module inside an existing monorepo, and approve one named edit to a root workspace manifest such as `package.json` or `pnpm-workspace.yaml`. Confirm that named edit lands, a root file the proposal did not name stays unchanged, and unrelated local changes stay. Not executed.\n- [ ] **Organization already specified.** Say \"scaffold a monorepo with a backend and a frontend\" up front. Confirm the organization question is not asked again, the proposal summarizes the already-selected organization, and the components and their directories are established before files are proposed. Not executed.\n- [ ] **Organization unspecified.** Ask for a new project with no organization stated. Confirm the three choices (single repository, monorepo, multiple repositories) are explained in plain language, a recommendation is offered only when the confirmed product need actually calls for it, and having a frontend, a backend, and infrastructure does not by itself trigger a multi-repository recommendation. Not executed.\n- [ ] **Existing multi-repo product offers a workspace.** Confirm membership in an existing multi-repository product that already has a `.code-workspace` file. Confirm the workspace question offers reuse or an update, not a duplicate file, and the organization question and the workspace question are presented as two separate decisions. Not executed.\n- [ ] **New multi-repo product separates directories from Git setup.** Confirm a brand-new multi-repository product with no existing repositories. Confirm the proposal states this run scaffolds one destination, names which directories this run creates now versus which stay deferred, and says plainly that Git setup for each repository is a developer step this skill does not perform. Not executed.\n- [ ] **Monorepo does not require a workspace.** Scaffold a monorepo with multiple components. Confirm no `.code-workspace` question is asked and no workspace file is proposed merely because the monorepo has multiple components. Not executed.\n- [ ] **Fresh scaffold with approved Bugbot setup.** Scaffold a project where the approved foundation already includes a concrete, groundable boundary (for example a declared API contract or an infrastructure execution-role limit). Confirm step 12, after both reviews, proposes a `BUGBOT.md` naming that concrete evidence, shows the exact path and content before writing, and records `approved` under the configured artifact home. Not executed.\n- [ ] **Declined setup without repeated questions.** Decline the proposed `BUGBOT.md` or project rule. Confirm the decision is recorded as `declined`, the scaffold still completes and reports success, and the same run does not ask again. Not executed.\n- [ ] **Project-rule declined policy does not suppress another policy in the same repository.** Record `declined` for policy A in repository X. Confirm a later proposal for policy B in repository X is still asked. Confirm the same policy slug in a different repository has an independent decision. Rename the approved rule file and confirm the policy slug that identifies the decision does not change. Instruction behavior; the Python helper takes an already-looked-up value and does not parse `## Project rule decisions`. Not executed.\n- [ ] **Existing BUGBOT.md preserved.** Scaffold a bounded addition to a project that already has a root `BUGBOT.md`. Confirm the existing file is preserved untouched unless current evidence makes a narrow, named patch warranted, and that patch is proposed separately from the rest of the scaffold's approval. Not executed.\n- [ ] **Insufficient evidence for useful rules.** Scaffold a foundation with only placeholder handlers and no concrete contract, security boundary, or integration yet. Confirm step 12 explains briefly why no rule is proposed, does not write an empty or generic `BUGBOT.md`, records `deferred` (not `declined`), and the scaffold still completes. Confirm a later `sync-context` run on the same project is allowed to reconsider this `deferred` result. Not executed.\n- [ ] **Scaffold offers a pull-request template independently.** Scaffold a Git repository whose remote is GitHub and that has no template. Confirm step 12 shows a proposed `.github/pull_request_template.md`, asks separately from Bugbot and project rules, and does not commit, push, or open a pull request. Not executed.\n- [ ] **Existing pull-request template is preserved.** Scaffold or sync a repository that already has a GitHub, GitLab, or Bitbucket Cloud template, including a GitHub `docs/PULL_REQUEST_TEMPLATE/` directory. Confirm the existing file or directory is left untouched and no duplicate default is added. Not executed.\n- [ ] **Unknown Git host defers a pull-request template.** Scaffold an unversioned directory with no remote. Confirm no `.github/pull_request_template.md` is written by implication, and the decision is `deferred`. Not executed.\n- [ ] **GitLab remote does not write a GitHub template path.** Run `sync-context` on a repository whose remote is GitLab and that has no template. Confirm any offer uses `.gitlab/merge_request_templates/Default.md` or is deferred, and `.github/pull_request_template.md` is not written. Not executed.\n- [ ] **Bitbucket Cloud offers `.bitbucket/pull_request_template.md`.** Scaffold or sync a repository whose remote host is `bitbucket.org` and that has no Cloud template. Confirm the offer uses `.bitbucket/pull_request_template.md`, not a root `pull_request_template.md`. Confirm a leftover root file is left untouched and does not block the Cloud offer. Not executed.\n- [ ] **GitHub path containing gitlab is not GitLab.** Run `sync-context` on a repository whose remote is `github.com/org/gitlab-runner` with no template. Confirm the host is GitHub, not GitLab, and any offer uses `.github/pull_request_template.md`. Not executed.\n- [ ] **Bitbucket Server host stays unknown.** Run `sync-context` on a repository whose remote host is `bitbucket.example.com`. Confirm the template decision is `deferred` and `.bitbucket/pull_request_template.md` is not written by implication. Not executed.\n- [ ] **Sync-context still detects set B without always loading those contracts.** Open a repository with current context, a declined pull-request template decision, and no Bugbot or legacy work. Confirm the run reviews the persisted decision, does not re-ask, and still reports the template status. Not executed.\n- [ ] **Sync-context declined policy does not silence another policy in the same repository.** Record `declined` for one project-rule policy. Confirm a later confirmed policy with a different policy ID in the same repository is still offered. Confirm a declined Bugbot decision does not suppress a pull-request template offer, and the reverse. Not executed.\n- [ ] **Declined pull-request template is not re-asked in the same run.** Decline the template offer. Confirm `declined` is recorded, the skill still completes, and the same run does not ask again. Not executed.\n- [ ] **Sync-context can offer a pull-request template when source is unchanged.** Open a repository with current context and no template, with a GitHub remote. Confirm `sync-context` can still propose the template (`pr_template_pending`) instead of reporting \"no relevant changes\" only because the source fingerprint is unchanged. Not executed.\n- [ ] **Reviewer source fix followed by context refresh.** Trigger a concrete finding in step 10 or step 11 that changes source evidence (for example a corrected entrypoint path). Confirm the fix is applied inside the approved scope, the affected context is refreshed before being reported as current, and step 13's final `validate_generated_context` run — not step 9's earlier one — is the result actually reported. Not executed.\n- [ ] **Independent delegation or Canvas unavailable.** Run this skill on a host that cannot dispatch an independent subagent and cannot open a Canvas. Confirm step 10 and step 11 each report their review as not performed rather than self-review labeled independent, quality assurance is reported as partial, the final result still appears in chat, and the scaffold still completes. Not executed.\n- [ ] **New module added without dropping existing monorepo index entries.** Add an approved new module to an existing, already-indexed monorepo. Confirm the existing repository index keeps its other module rows and their context links unchanged, only the new module's row and its own `AIDLC_CONTEXT.md` are added, and step 13's final validation covers the whole index, not only the new module. Not executed.\n\nReal-world smoke evaluation (not executed in this change; do not treat these as passed until actually run against a consumer checkout, and do not modify a consumer repository from this plugin work):\n\n- [ ] REST/backend service — compare generated context quality against previous shallow outputs.\n- [ ] Terraform/infrastructure repository — same comparison.\n- [ ] Frontend or small behaviorful service — same comparison.\n\nREADME onboarding (not executed in this change; do not treat these as passed until a person follows them in Cursor):\n\n- [ ] **Fresh unversioned project.** Create an empty directory that is not inside a Git repository. Follow the README `/scaffold-project` example. Confirm the proposal comes before any write, the destination is not given another repository's identity, and ignored local files are not required for the foundation.\n- [ ] **Existing monorepo.** Open a repository root that already contains more than one component. Run `/sync-context` from the README path. Confirm meaningful modules are discovered inside that one Git root and context is proposed before it is written.\n- [ ] **Multi-repo workspace with an unavailable sibling.** Open a local `.code-workspace` that includes one cloned repository and names another that is not on disk. Run `/sync-context`. Confirm the missing sibling is reported unavailable, is not described as verified, and the available repository can still be documented.\n- [ ] **First-time user from install to approval.** Follow the README from Team Marketplace or the documented local install through reload, the starting-point table, and one approved `/sync-context` or `/scaffold-project` run. Confirm the slash command is visible and nothing is written before approval.\n","inbound":[".cursor/skills/sync-context/references/context-quality.md","README.md"]},{"id":"README.md","kind":"package","name":"Simplified AI-DLC lifecycle","summary":"Simplified AI-DLC lifecycle","words":3460,"chars":22370,"lines":244,"links":["MANUAL_EVALUATION.md","references/repository-preflight.md",".cursor/skills/sync-context/references/legacy-migration.md","references/host-run-observation.md","references/jira-integration.md","references/project-onboarding.md","references/canvas-review.md","references/skill-composition.md","references/work-record.md"],"headings":[{"text":"Simplified AI-DLC lifecycle","line":1},{"text":"Start here","line":9},{"text":"Words used in this guide","line":17},{"text":"Where should I start?","line":27},{"text":"Install and connect","line":42},{"text":"What you need locally","line":80},{"text":"Jira, Git, and Figma","line":87},{"text":"First `/sync-context`","line":99},{"text":"First `/scaffold-project`","line":139},{"text":"What to run next","line":185},{"text":"When something looks wrong","line":211},{"text":"Maintainer notes","line":224}],"source":"# Simplified AI-DLC lifecycle\n\nThis Cursor plugin helps a team describe a product, plan the work, build a small technical foundation, and check that a change matches what was approved.\n\nYou run the workflows in **your product folders**. You do not edit the plugin installation to describe your application.\n\nThis package is still experimental. A clean install on a new machine, agent delegation, and the host integrations are listed in [MANUAL_EVALUATION.md](MANUAL_EVALUATION.md). Static checks in this repository do not prove those live steps.\n\n## Start here\n\n1. Install the plugin (below). Reload Cursor, then confirm the slash commands appear in agent chat.\n2. Open the product folder in the local Cursor IDE. Use the table to choose the folder and the first command.\n3. Read the proposal. Approve it before the agent writes files or changes Jira.\n\nThe local Cursor IDE is the path this guide describes. Open one repository, or an existing `.code-workspace`, in that IDE and use agent chat. Whether a separate Agents window treats a multi-root workspace the same way has not been verified. Use the IDE window.\n\n## Words used in this guide\n\n- **Plugin.** The installed set of skills, reviewer prompts, and rules. The manifest is `.cursor-plugin/plugin.json`.\n- **Skill.** One workflow. You start it with a slash command such as `/sync-context`.\n- **Project repository.** The Git repository that holds your application or infrastructure code.\n- **Module.** One component inside a single repository, such as a backend or a frontend package.\n- **Monorepo.** One Git repository that contains several components and one Git history.\n- **Multi-repository product.** Several independent Git repositories that belong to one product.\n- **Workspace.** An optional local `.code-workspace` file that opens those folders together in Cursor. It is not another way to organize Git repositories.\n\n## Where should I start?\n\n| Your situation | What to open | First command | What to expect |\n| --- | --- | --- | --- |\n| An existing application in one repository | That repository | `/sync-context` | A proposal for repository context, then files only after you approve |\n| An existing monorepo | The repository root | `/sync-context` | The skill looks for meaningful modules inside that one Git root |\n| An existing multi-repository product | The cloned repositories together, for example an existing `.code-workspace` | `/sync-context` | Each open Git root is recorded on its own. Product membership comes from confirmed `Product` and `Related repository` entries, not from folders that merely sit next to each other |\n| A new project in an empty directory | That empty directory | `/scaffold-project` | Questions about purpose first, then a proposed foundation |\n| A new component inside an existing monorepo | The monorepo root, and name the new component directory | `/scaffold-project` | One destination this run. A root manifest or workspace file changes only when the proposal names that file |\n| A new product that will use several repositories | The first folder you want created | `/scaffold-project` | Say that you want multiple repositories. This run scaffolds one destination. It does not run `git init`, create remotes, or clone the others |\n| A product that still uses the older AI-DLC coordinator | The existing product workspace | `/sync-context` | A migration proposal. Useful knowledge is preserved. Cleanup is a separate approval. Do not delete the old coordinator or methodology checkout before that review |\n| Only one repository of a multi-repository product is on this machine | The repository you have | `/sync-context` | Context for the repositories that are actually open. A missing sibling is reported as unavailable. It is not inspected and not described as verified. Run `/sync-context` again when that sibling is cloned |\n\nDetails for Git classification live in [repository preflight](references/repository-preflight.md). Migration limits live in [legacy migration](.cursor/skills/sync-context/references/legacy-migration.md).\n\n## Install and connect\n\nNormal use does not require cloning this repository. An admin imports it as a Team Marketplace:\n\n1. Dashboard → **Plugins & MCPs** → **Import from Repo**\n2. Use `https://github.com/nahuel-ramos-univar/ai-dlc`\n3. Cursor indexes `.cursor-plugin/marketplace.json` and lists `simplified-ai-dlc-lifecycle`\n4. Each developer installs it from **Customize**\n\n`Univar/digital-ai-dlc` is a different repository. Do not import it for this plugin.\n\nTo develop the plugin itself, clone it and reload:\n\n```sh\ngit clone https://github.com/nahuel-ramos-univar/ai-dlc.git \\\n  ~/.cursor/plugins/local/simplified-ai-dlc-lifecycle\n```\n\nThen run **Developer: Reload Window**. The plugin should appear as `simplified-ai-dlc-lifecycle` in Customize. Enterprise needs **Allow Local Plugin Imports**. If another plugin already uses the same name, the marketplace copy wins.\n\nAfter a reload, the agent chat should offer:\n\n```text\n/sync-context\n/scaffold-project\n/plan-work\n/refine-story\n/implement-change\n/validate-change\n/create-e2e-tests\n```\n\n`/sync-context` can also start from a plain request such as \"refresh the repository context\". The other six commands stay slash-only. Choosing a skill does not by itself approve a write.\n\nOptional Cursor run observation lives in [host-run-observation.md](references/host-run-observation.md). Copy it into a workspac
