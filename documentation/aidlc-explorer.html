ps://www.figma.com/design/EXAMPLE/file`\n- Figma role: `design-system`\n```\n\nSupported fields are `Jira site` (host only), `Jira project` (project key),\noptional `Jira board` (URL), optional `Figma reference` (URL), and optional\n`Figma role` (`approved-design`, `design-system`, or `inspiration`). Write\nonly confirmed values, through the approved config change. See\n[project-onboarding.md](../../../../references/project-onboarding.md).\n\nDo not create `.ai-dlc-config.md` in every source repository to record a\nBugbot decision. Store decisions under the configured artifact home, keyed by\nthe stable repository ID. A project-rule decision under\n`## Project rule decisions` (see [project-rules.md](project-rules.md)) is\ndifferent: its identity is the pair (stable repository ID, stable policy\nslug), because one repository can hold several independent policy decisions\nat once. Do not collapse that pair into the repository ID alone. A pull-request\ntemplate decision under `## Pull request template decisions` (see\n[pull-request-template.md](pull-request-template.md)) is keyed by stable\nrepository ID: one default template offer per repository. Approving Bugbot,\na project rule, or a pull-request template does not authorize the others.\n\n## Multi-repository `Root`\n\nFor a workspace that spans more than one repository (an engagement index that\nlinks to sibling repositories, or a repository index that links into a shared\npackage repository), record each linked repository's own `Root:` field\nrelative to the artifact home, for example `Root: ../payments-api` or\n`Root: ../../shared/design-system`. This `Root` is what\n[validation.md](validation.md) turns into an `authorized_roots` entry: a\nmapping from repository ID to that repository's actual root path, so\n`resolve_markdown_links` and `resolve_source_path` know which local\ndirectories are in scope without guessing from the filesystem or treating the\nwhole machine as authorized.\n\n`Root` in `.ai-dlc-config.md` must stay a path relative to the artifact home,\nnever an absolute local checkout path; only the running validator resolves it\nto an absolute path in memory for that one run. Do not write an absolute\nmachine-local path into `.ai-dlc-config.md`, `AIDLC_CONTEXT.md`, or any other\nportable generated document — a different checkout of the same workspace has\na different absolute path, and a committed absolute path would leak local\nmachine layout into shared, versioned context.\n\nA repository with no declared `Root` cannot be added to `authorized_roots`\nfor that validation run. Its own links and source paths report `unresolved`,\nnot silently `ok`; report this to the user as a workspace configuration gap,\nnot as a passing check.\n\n## Product membership: `Product` and `Related repository`\n\n`Root` above is for the coordinator and shared-package case: a repository\nwhose own validation run must read directly into a sibling's files. Most\nmulti-repository products do not work that way -- three or four independent\nGit repositories can each own their own distributed context with no shared\nread access and no coordinator at all, and still belong to the same product.\n`Product` and `Related repository` record that membership. Both are\noptional. Omit them entirely when membership is not yet confirmed; a missing\nentry means **unknown or unconfigured**, never proof that this repository\nhas no siblings, and never a reason to block unrelated work.\n\n```markdown\n## Context identities\n- Repository: `payments-api`\n  - Canonical remote: `github.com/example/payments-api`\n  - Placement: `distributed`\n  - Product: `checkout-platform`\n  - Artifact home: `.`\n  - Root: `.`\n- Module: `payments-api`\n  - ID: `payments-api`\n  - Source: `services/payments`\n- Related repository: `github.com/example/payments-web`\n  - Repository ID: `payments-web`\n  - Role: `frontend`\n  - Context index: `aidlc-docs/repository-context.md`\n```\n\n**`Product`** is a confirmed, free-text label on the `Repository:` block,\nread by `parse_labeled_fields` the same way `Placement` is. Write only a\nlabel the user actually confirmed. Do not derive it from the checkout\ndirectory name, from an open-workspace folder name, or from this\nrepository's own name or prefix -- a repository named `payments-web` is not\nthereby forced into a product labeled `payments`, and a renamed checkout\nmust not silently relabel the product.\n\n**`Related repository`** is a repeatable top-level entry, parsed by\n`parse_related_repositories` in `scripts/context_tools.py`, with the same\n`\"ok\"` / `\"missing\"` / `\"ambiguous\"` / `\"invalid\"` vocabulary as\n`ProjectReferences`. Its own label line carries the sibling's **canonical\nremote** directly, not a repository ID -- the ID a sibling will eventually\npersist for itself may not be known yet from this side, and a canonical\nremote is always determinable without guessing. That canonical remote must\nbe the documented `host/org/repo` form (currently `github.com/...` only, the\nsame host this plugin's identity layer already supports) or a raw GitHub\nSSH/HTTPS remote normalized to it. A trailing `.git` on that form is removed\nso it matches the checkout's normalized remote. A query string or fragment\nis invalid and is not kept as part of the identity. Anything else, including\na value that is not remote-shaped at all, is reported as invalid rather than\naccepted.\nNested fields are all optional, but when present must be well-formed -- a\nrecognized field written without the canonical backtick format, left empty,\nor duplicated, is reported as invalid, never silently treated as absent or\nresolved by picking one of the duplicates:\n\n- `Repository ID` -- the sibling's own persisted ID, once confirmed. Must\n  match `[a-z0-9-]`. Do not invent one; leave it absent until it is known.\n- `Role` -- a confirmed, free-text description (for example `frontend`,\n  `api`, `infrastructure`). This plugin does not define a fixed role enum.\n- `Context index` -- a path to the sibling's own\n  `aidlc-docs/repository-context.md` (or equivalent), relative to **that\n  sibling repository's own root**, not to this document or to this\n  repository. Must be a nonempty relative path that does not escape that\n  root (no absolute path, no URL, no `../` that climbs above the root, and\n  no Windows or UNC form). This is a syntax check only.\n  `resolve_related_context_index` then checks that the resolved path stays\n  inside the sibling root, including through a symlink. It does not check\n  that the file exists. The caller checks existence before reading it.\n\nDeclaring a `Related repository` does not add it to `authorized_roots` and\ngrants no read access by itself; it is a membership fact, not a\ncapability. Resolving a declared entry against a checkout actually open in\nthis session -- matching by canonical remote, never by directory or\nworkspace-folder name -- is `match_related_repositories`, called with\nwhatever the host already has in scope. See\n[context-retrieval.md](../../../../references/context-retrieval.md) for the\nfull repository-resolution procedure, and\n[legacy-migration.md](legacy-migration.md) for how this metadata is\nproposed during a distributed migration.\n\n**Membership differences are not automatically conflicts.** Repository A\nlisting repository B, with B not (yet) listing A back, is normal and\nexpected during a gradual rollout -- report it as unconfirmed on B's side,\nnot as a contradiction. The two precise, mechanical conflicts this plugin\nchecks are a genuine identity collision, in either direction:\n\n- The same `Repository ID` persisted for two different canonical remotes --\n  `detect_repository_id_collision`.\n- The same canonical remote persisted under two different `Repository ID`\n  values -- `detect_canonical_remote_collision`, the companion check for the\n  direction the first function does not cover. These are deliberately two\n  small functions, not one function overloaded to sometimes return a\n  canonical identity and sometimes return a repository ID depending on which\n  direction fired.\n\nReuse whichever of these two matches the shape of the mismatch once both\ndeclarations are actually available in this session; do not invent a third\ncollision function. Two checkouts or worktrees that are genuinely the same\nrepository (same `Repository ID`, same canonical remote) are not a\ncollision under either check. Do not treat an absent reciprocal entry, or a\ndifferent display label (such as two different `Product` names), as either\nkind of collision. Everything else -- whether a difference is stale,\nincomplete, or a genuine disagreement worth asking the user about -- is for\nthe agent to read and explain, not for a deterministic check to decide.\n\nDo not add a separate `single-repository` / `multi-repository` flag on top\nof this. Whether a repository has related repositories is already visible\nfrom whether any `Related repository` entry exists; a redundant flag could\ndisagree with the entries themselves.\n\n## Placement: distributed or adopted coordinator\n\nRecord the placement mode explicitly once it is established:\n\n```markdown\n## Context identities\n- Repository: `payments-api`\n  - Placement: `distributed`\n```\n\nor, when an external coordinator already owns this engagement's context:\n\n```markdown\n## Context identities\n- Repository: `payments-api`\n  - Placement: `adopted-coordinator`\n  - Coordinator: `payments-platform-aidlc`\n  - Coordinator root: `../payments-platform-aidlc`\n```\n\n**Distributed is the default.** Each product Git repository owns its own\ncontext unless adoption is established. Call `resolve_placement` in\n`scripts/context_tools.py` with the persisted value: missing config returns\n`distributed`, and any other string raises instead of choosing a\ndestination. A folder name is not an argument to that function.\n\n**Adopt a coordinator** only when the user has explicitly chosen to keep\nthat architecture (`retain-active-coordinator` on\n`legacy_architecture_prompt_required`). Never adopt a coordinator because a\nfolder or repository name happens to end in a particular suffix; a name is\nnot configuration. A structured operating-model table names the current\nlayout and the repositories that belong together. It does not record that\nchoice, and it does not authorize writing `Placement: adopted-coordinator`.\n\nWhen `detect_legacy_aidlc_installation` returns `full`, or\n`resolve_legacy_provenance` returns `confirmed`, call\n`legacy_architecture_prompt_required`. Do not pass\n`Placement: adopted-coordinator` into it. If it returns true, prepare the\ndistributed proposal instead of adopting the coordinator. A `partial` detection, and an `absent` detection that still has\n`legacy_supporting_evidence`, stays `inspect` until bounded inspection\nfinishes. Do not adopt, and do not start the migration, from `\"inspect\"`,\n`\"absent\"`, `\"ruled-out\"`, or `\"inspection-unavailable\"`. A directory name,\nan unread Operating Model heading, or a discovery path alone does not\nconfirm provenance. If there is no explicit choice and no confirmed legacy\ninstallation, stay distributed and say so rather than guessing.\n\n**In adopted-coordinator mode, module placement is policy, not a\nwritability fallback.** Call `module_context_destination(placement,\nrepository_id, module_id)`. For `adopted-coordinator` it always returns\n`aidlc-docs/context/\u003crepo-id>/\u003cmodule-id>.md`. Writability is not an\nargument, so a writable source repository cannot move that file. This is different from\nthe ordinary fallback described in\n[context-generation.md](context-generation.md), which only centralizes when\nthe module root cannot be written — adoption centralizes unconditionally,\nby the recorded policy, regardless of writability.\n\n**When the configured coordinator is unavailable** (only one source\nrepository is open, and the coordinator repository is not reachable from\nthis window): say plainly that the coordinator-owned index could not be read\nor updated, and that this run's findings for this repository are not yet\nreflected there. Continue read-only analysis of the repository that is open.\nDo not silently create a competing local index for that repository, and do\nnot write a fallback copy under this repository's own `aidlc-docs/` as if it\nwere canonical — propose it clearly as pending reconciliation with the\ncoordinator instead, and ask whether to persist it as a temporary local note\nor hold it until the coordinator is reachable.\n\n## Migrating from adopted coordinator to distributed\n\n**Distributed is the only supported migration destination.** There is no\n\"migrate to a different coordinator\" path; a migration always ends with each\nproduct repository owning its own context, per the placement rule above.\n\nA repository's existing `adopted-coordinator` configuration, and the legacy\ncoordinator repository it points to, are **evidence for discovering the\ncurrent layout** — which repositories exist, what each one currently\ndocuments, and what still needs to be preserved. That evidence must never\nsilently become the permanent destination of a new migration. Concretely,\ncall `migration_destination_placement(current_placement, migration_approved)`\nin `scripts/context_tools.py`. It validates `current_placement` through\n`resolve_placement` before choosing a destination. An unknown value raises\n`ValueError` whether or not the migration is approved; it is never rewritten\ninto `\"distributed\"`.\n\n- During discovery and proposal preparation (`migration_approved=False`),\n  it returns the validated current placement unchanged. Preparing a migration\n  proposal never flips persisted placement on its own.\n- Only an approved migration (`migration_approved=True`) returns\n  `\"distributed\"`, the value then persisted back into `## Context\n  identities`.\n- A repository that is already `distributed` is unaffected either way, so an\n  ordinary refresh of an already-distributed repository never changes\n  behavior through this function — it is only relevant once a migration from\n  `adopted-coordinator` is actually in play.\n\n`Placement: adopted-coordinator` records the operating mode of a repository\nthat uses a coordinator. It does not identify the repository currently being\nread as that coordinator. Coordinator identity comes only from a `Coordinator`\nor `Coordinator root` value, or from operating-model metadata whose subject\nis that repository, checked with `repository_is_named_coordinator`. See\n[legacy-migration.md](legacy-migration.md).\n\n**If the persisted configuration already explicitly selects\n`adopted-coordinator`**, and this repository is not a confirmed legacy\nAI-DLC installation, do not silently override it with the distributed\ndefault. Explain the difference between the current adopted-coordinator\nplacement and the proposed distributed destination in plain terms (where\ncontext currently lives versus where it would move), and include the\nplacement change explicitly as part of the proposal the user approves — the\nsame approval gate as any other change set A content. If the user chooses to\nkeep the adopted-coordinator architecture, record\n`retain-active-coordinator` and honor that choice: leave\n`Placement: adopted-coordinator` unchanged, and report plainly that\ndistributed migration was not completed, rather than reporting partial\ncompletion or asking again later in the same run.\n\n**If it is a confirmed legacy AI-DLC installation**, that persisted\nplacement is not the user's architectural decision. An earlier sync may\nhave written it from the operating-model table. Follow\n[legacy-migration.md](legacy-migration.md), \"Known legacy AI-DLC\ninstallation\". `retain-active-coordinator` is the only recorded value that\nkeeps the coordinator active. `retire-and-retain-checkout` keeps the\ncheckout as a historical copy after migration; it is not that choice, and\nit does not approve a later file inventory.\n\nPreparing distributed outputs and the mandatory retirement decision for the\nlegacy coordinator are both covered in\n[legacy-migration.md](legacy-migration.md).\n","inbound":[".cursor/skills/plan-work/references/single-story.md",".cursor/skills/scaffold-project/SKILL.md",".cursor/skills/sync-context/SKILL.md",".cursor/skills/sync-context/references/context-generation.md",".cursor/skills/sync-context/references/legacy-migration.md",".cursor/skills/sync-context/references/validation.md","references/context-retrieval.md"]},{"id":".cursor/skills/sync-context/references/bugbot-configuration.md","kind":"reference","name":"Bugbot configuration","summary":"Optional evidence-grounded BUGBOT.md guidance; not an executed code review.","words":697,"chars":5046,"lines":91,"links":[],"headings":[{"text":"Bugbot configuration","line":1},{"text":"Placement","line":10},{"text":"Rule quality","line":16},{"text":"Bugbot decisions","line":51},{"text":"Bugbot decisions","line":61},{"text":"Review focus","line":77},{"text":"Checkout review focus","line":86}],"source":"# Bugbot configuration\n\nComplete context discovery before offering Bugbot setup. Inspect each confirmed\nsource repository root for `.cursor/BUGBOT.md` and relevant nested\n`\u003cmodule>/.cursor/BUGBOT.md` files. Do not inspect inaccessible sibling\nrepositories.\n\nUse verified code, contracts, tests, and module context to decide whether a concise root file would help Bugbot find concrete regressions. Propose a nested file only when a module has distinct, actionable review concerns. Do not create files per folder or source file.\n\n## Placement\n\nAlways consider `\u003csource-root>/.cursor/BUGBOT.md`. Propose a nested `\u003cboundary>/.cursor/BUGBOT.md` only for a meaningful review boundary: distinct runtime, deployment, trust, framework, domain invariant, testing expectation, or high-risk integration.\n\nPrefer one root file. If two nested files would repeat a rule, lift it to the root. Do not create BUGBOT files under generated, vendor, build, coverage, lockfile, or fixture directories. A nested file supplements root guidance; it must not repeat it.\n\n## Rule quality\n\nEach proposed rule must name an observed path and helper, interface, or\ninvariant. State the concrete regression it prevents. One rule, one invariant.\nDo not mix unrelated tables, services, or contracts in the same bullet.\n\nReport actionable defects introduced by the change. Inspect surrounding code,\ncallers, dependencies, contracts, and tests as needed to establish impact.\nAvoid unrelated pre-existing defects and speculative findings. Prefer silence\nover speculation or generic security, style, formatter, lint, type-check, or\ntest-runner rules.\n\nUse the narrow shape: \"When a change in `\u003cpath>` affects `\u003cnamed invariant>`,\nverify `\u003cbehavior>` because failure would `\u003cimpact>`.\" Do not prescribe an\nimplementation order, algorithm, or storage sequence unless reversing it would\nitself cause a user-visible defect. Ownership, task assignment, approval\nceremonies, and Terraform apply authorization belong in governance. Concrete\nIAM or security defects introduced by a diff remain valid Bugbot concerns when\nrepository evidence supports them. Do not instruct Bugbot to generate IAM or\nexecute infrastructure changes.\n\nAdd a leave-alone rule only for an observed intentional, generated, fixture, snapshot, or compatibility pattern.\n\nThose approved BUGBOT paths are the only `.cursor/BUGBOT.md` writes allowed by\nthe context-generation contract. Show a preview with file paths and diffs. Ask\nonce per repository for initial setup. Persist the decision in the configured\nartifact home's configuration, keyed by stable repository ID. Do not create\nconfiguration in unrelated source repositories just to record a decision.\n\nExisting approval covers only the proposal the user approved. Later rule changes\nneed a targeted proposal. Preserve declined decisions until explicit\nreconsideration. A deferred decision is recorded and is not re-prompted during\nthe same run.\n\n```markdown\n## Bugbot decisions\n- Repository: `\u003cstable-repository-id>`\n  - Decision: declined\n  - Baseline: `\u003cgit-rev or unversioned>`\n  - Fingerprint: `\u003cfingerprint>`\n```\n\nUntracked consumer:\n\n```markdown\n## Bugbot decisions\n- Repository: `\u003cstable-repository-id>`\n  - Decision: declined\n  - Baseline: unversioned\n  - Fingerprint: `\u003cfingerprint>`\n```\n\nUse `approved`, `declined`, or `deferred`. Do not ask again after `declined` unless the user explicitly asks to reconsider. If a nested module root cannot be written, do not write `\u003cmodule>/.cursor/BUGBOT.md` there; keep the proposal as fallback-only or skip that nested file.\n\nIf BUGBOT files already exist, preserve them. Propose a narrow patch separately only when current evidence makes a rule stale, duplicated, contradictory, or tied to a missing path. Do not restate generic style guidance, invent company policy, duplicate unseen team rules, or claim that BUGBOT enables or invokes Bugbot.\n\nDo not assume Bugbot can read context, contracts, or `AIDLC_CONTEXT.md` stored only in a sibling repository. Write each `BUGBOT.md` so its review instructions are self-contained for the repository it lives in — point to a path inside that same repository, not to a document in another repository the review run may not be able to open.\n\nExample root proposal:\n\n```markdown\n# Review focus\n\n- Check public payment API changes against `contracts/payment.openapi.yaml`.\n- Check retry changes keep duplicate-charge protection covered by tests.\n```\n\nExample nested proposal:\n\n```markdown\n# Checkout review focus\n\n- When a change in `services/checkout/src/index.ts` affects `PUT /v1/carts/:cartId`, verify the path `cartId`, the DynamoDB item key, and the Redis key still identify the same cart, because a mismatch would return or persist the wrong cart.\n```\n\nColocated `AIDLC_CONTEXT.md` holds module workflow context. The artifact-home fallback exists when the source repository or that module root cannot be written. `.cursor/BUGBOT.md` holds Bugbot review instructions. Neither ordinary `.cursor/rules/*.mdc` files nor a BUGBOT file proves that `/review-bugbot` ran.\n","inbound":[".cursor/skills/scaffold-project/SKILL.md",".cursor/skills/scaffold-project/references/foundation-and-review.md",".cursor/skills/sync-context/SKILL.md",".cursor/skills/sync-context/references/context-generation.md",".cursor/skills/sync-context/references/legacy-migration.md",".cursor/skills/sync-context/references/project-rules.md","references/repository-preflight.md"]},{"id":".cursor/skills/sync-context/references/context-generation.md","kind":"reference","name":"Context generation","summary":"Generate accurate context from source; evidence, module responsibilities and boundaries.","words":2383,"chars":17562,"lines":301,"links":[".cursor/skills/sync-context/references/artifact-home.md",".cursor/skills/sync-context/references/bugbot-configuration.md",".cursor/skills/sync-context/references/project-rules.md",".cursor/skills/sync-context/references/pull-request-template.md",".cursor/skills/sync-context/references/legacy-migration.md",".cursor/skills/scaffold-project/references/foundation-and-review.md",".cursor/skills/sync-context/references/architecture-discovery.md","references/architecture-decisions.md",".cursor/skills/sync-context/references/context-quality.md",".cursor/skills/sync-context/references/context-templates.md"],"headings":[{"text":"Context generation","line":1},{"text":"Proposal staleness before applying","line":38},{"text":"Examples","line":232}],"source":"# Context generation\n\nRead [artifact-home.md](artifact-home.md) before selecting output paths. Confirm\nthe artifact home, source repository root, requested module scope, and approved\nmodule roots before writing. Write only under:\n\n- `\u003cartifact-home>/aidlc-docs/` (change set A)\n- `\u003cartifact-home>/.ai-dlc-config.md` (change set A, and the decisions for B).\n  An approved `## Project references` update belongs in this same file, after\n  `## Context identities`. It is not a separate config file. A missing or\n  present project-references section does not change identity parsing.\n- `\u003capproved-module-root>/AIDLC_CONTEXT.md` (change set A)\n- after the per-repository Bugbot approval in\n  [bugbot-configuration.md](bugbot-configuration.md) (change set B):\n  `\u003csource-root>/.cursor/BUGBOT.md` and\n  `\u003capproved-boundary-root>/.cursor/BUGBOT.md`\n- after the per-policy approval in [project-rules.md](project-rules.md)\n  (change set B): `\u003csource-root>/.cursor/rules/\u003cslug>.mdc`, one file per\n  confirmed policy, never a copy of this plugin's own skills, agents, or\n  shared references\n- after the per-repository approval in\n  [pull-request-template.md](pull-request-template.md) (change set B):\n  exactly one of `\u003csource-root>/.github/pull_request_template.md`,\n  `\u003csource-root>/.gitlab/merge_request_templates/Default.md`, or\n  `\u003csource-root>/.bitbucket/pull_request_template.md`, matching the verified\n  Git host. This is not permission to write other files under `.github/`,\n  `.gitlab/`, or `.bitbucket/`.\n\nNothing here authorizes change set C (legacy migration cleanup); that\nremains its own approval per [legacy-migration.md](legacy-migration.md).\n\nA plugin source directory inside another Git repository is not automatically the\nconsumer root. Do not write other Markdown in source trees. A nested tracked\nmodule uses its owning Git root for the baseline, but preserves the requested\nmodule as the analysis scope. An unversioned tree may be analyzed with baseline\n`unversioned`; save only when its artifact home and write scope are clear.\n\n## Proposal staleness before applying\n\nA proposal prepared in an earlier stage of the same run can go stale before\nit is applied: a user may edit a destination file, or source evidence may\nchange mid-conversation. Immediately before writing, recompute\n`content_fingerprint` for the proposal's declared source scope and read the\ncurrent content of each destination file. Call `proposal_is_current` with\nthe fingerprint and destination text captured when the proposal was\nprepared, and with the values just read. If it returns false, stop writing\nthat part of the proposal, recalculate the affected changes, preserve the\nintervening edit, and present the material difference for renewed approval\nbefore writing. Do not silently overwrite a destination\nfile that moved since the proposal was prepared. This check is for a\ncontext proposal that has not started writing. It still applies to\n`sync-context`. A scaffold that writes approved source files follows\n[foundation-and-review.md](../../scaffold-project/references/foundation-and-review.md)\nduring application and must not treat those approved writes as staleness\nof the original fingerprint.\n\nKeep `.ai-dlc-config.md` minimal. Keep `aidlc-docs/repository-context.md` as a short workspace index. It lists each actual Git root, its repository ID, meaningful modules, source paths, freshness marker, and links to colocated context. It is not a codebase dump.\n\nUse `\u003cmodule-root>/AIDLC_CONTEXT.md` for useful modules. A module has an\narchitectural responsibility: app, API, service, shared package, or\ninfrastructure stack. Do not infer a module from directory depth.\nRepository size or module count is not documentation depth. Every\nmeaningful architectural module listed in `## Modules` must have its own\nlocal `AIDLC_CONTEXT.md` (or the documented fallback). A module row with\nan empty or missing Context target is invalid. Create that file for a\nservice or application, a Lambda or backend with business behavior, a\nfrontend, an API, an integration service, Terraform or infrastructure with\nmeaningful runtime topology, a persistence or data component, or a\nbehaviorful library — even when the repository contains only one module.\nKeep the index alone only when there is genuinely no meaningful\narchitectural module: a documentation-only repository, a trivial metadata\nor config package, or an extremely small passive types or constants\npackage. Represent that as an empty `## Modules` table, not a listed\nmodule that points nowhere. Do not skip `AIDLC_CONTEXT.md` merely because\nthe repository is single-module. Do not create one context file per source\nfile or directory; generate module context only where it provides useful,\ndistinct information beyond the repository index.\n\nIf the source repository or module root cannot be written, use the documented\nfallback `\u003cartifact-home>/aidlc-docs/context/\u003crepo-id>/\u003cmodule-id>.md` and link\nit from the repository index. A read-only source remains analyzable. If no\nwritable artifact home exists, return a draft or proposal and do not claim files\nwere saved.\n\nGenerate IDs from stable, portable identity for the index and fallback only:\n\n- Reuse an existing persisted repository ID first.\n- Otherwise derive a first-time ID from a verified canonical remote. Normalize\n  only known equivalent SSH and HTTPS forms. Remove credentials. Combine a\n  readable slug with a short hash of the full canonical identity so similar\n  remotes do not collide.\n- Detect an ID collision against IDs already stored in the artifact home before\n  writing fallback paths or Bugbot decisions.\n- If no remote is usable, assign an explicit ID once and persist it in the\n  artifact-home configuration.\n- Never derive identity from absolute paths, clone directory names, workspace\n  collisions, or changing responsibility labels.\n- Preserve a module ID across a source move when evidence links the old and new\n  module. Report ambiguous duplicate documents rather than deleting them.\n\nReject IDs outside `[a-z0-9-]`. Never use raw user input as a path. Record\nrepository-relative source paths and the verified remote when available. Do not\nwrite absolute local checkout paths into generated context.\n\nEach module `AIDLC_CONTEXT.md` states repository identity, source paths,\nresponsibility, entry points, interfaces, representative runtime flows,\ncallers or dependencies, verified tests and commands, constraints, a\ncoverage table against the dimensions in\n[architecture-discovery.md](architecture-discovery.md), material\narchitecture details for the dimensions that actually matter, a canonical\nevidence catalog, freshness, and explicit unknowns. It is verified\ntechnical context for that module. It is not a backlog, a Story mirror, or\na sprint tracker. Durable architectural decisions stay in their own records\nand are linked when a module needs them. Follow\n[architecture-decisions.md](../../../../references/architecture-decisions.md).\nOrdinary sync does not write `architecture.md` or an ADR file. An\nexplicitly approved legacy migration may relocate or faithfully consolidate\nexisting records per [legacy-migration.md](legacy-migration.md); it still\ndoes not invent an accepted decision or rewrite a binding clause to match\ncode. Creating `architecture.md` is conditional. Recording a material\napproved decision is not optional. The Coverage table is\na summary of what was considered; `## Material architecture details`\npreserves the discovered knowledge a downstream agent needs. `## Evidence\nand existing docs` is the canonical catalog of repository-relative local\npaths used as supporting evidence. Any local path cited in Coverage,\nruntime flows, Material architecture details, or constraints must also\nappear there. Python only checks that those catalogued paths exist inside\nan authorized root; whether a path supports the surrounding claim is an\nAI-reviewer judgment. Run architecture discovery before drafting or\nmaterially refreshing a module document; see\n[architecture-discovery.md](architecture-discovery.md) for how deep that\nexploration goes for initial, material-change, and small-update syncs, and\n[context-quality.md](context-quality.md) for what the coverage table records\nand what makes the result good enough. Do not copy source, generated output,\nvendor content, cache content, or secrets.\n\nGround a material claim about architecture, behavior, integrations, configuration, security boundaries, or testing in source evidence: a repository-relative path plus the relevant symbol or configuration key. Avoid relying only on a line number, because it goes stale. A test file proves that test code exists, not that it passed. A CI configuration proves that a job is configured, not that it ran successfully. A declared dependency does not prove runtime usage. A configured integration does not prove authenticated connectivity. Repository documentation supports evidence; it does not automatically override current code.\n\nDistinguish a verified fact, an inference labeled as such, and an unresolved unknown. Do not list an assertion under Unknowns when the same or another generated document already states it as a verified fact elsewhere; that is a contradiction, not an unknown. For each material unknown, state briefly what remains unknown, what evidence is missing, and how it could be verified. Where code and documentation conflict, record the discrepancy rather than silently choosing a narrative. Skip a generic unknown that is irrelevant to the module's own responsibility.\n\nNever describe all tracked or fingerprinted files as examined, analyzed, or verified merely because their paths were listed by Git or included in a fingerprint. Reading a manifest does not verify every component it lists; reading part of a file does not verify the whole file. State the repository index's `Examined` field as the boundaries and representative paths actually inspected, not a count of tracked or fingerprinted files.\n\nFreshness is a deterministic content fingerprint of the declared source scope\nand its examined paths. Use `scripts/context_tools.py`:\n\n1. For a Git-backed scope, discover included files with Git: every tracked\n   path (`git ls-files`) plus every untracked path `.gitignore` does not\n   exclude (`git ls-files --others --exclude-standard`). A tracked file is\n   still included even if a later-added ignore pattern would exclude it if\n   it were untracked; only an untracked-and-ignored file is left out. For a\n   genuinely unversioned tree, apply that tree's own `.gitignore` with the\n   same temporary Git check, which is not created inside the project. If Git\n   cannot apply those rules, raise `GitDiscoveryError` instead of reading\n   ignored files. An\n   `untracked-tree` does not use the enclosing repository's exclude rules.\n   Git applies the ignore rules inside that tree, including negation and\n   nested rules, and drops ignored paths before reading file contents. A\n   genuinely empty destination stays an empty file list. A destination that\n   does not exist yet is an `absent` result from `destination_freshness`,\n   not an empty-directory fingerprint; do not create it merely to hash it.\n   The absent value also includes index and HEAD records for that destination\n   only. Those records are not part of `content_fingerprint`, and a staged\n   change outside the destination does not change them.\n   If Git cannot apply the in-scope rules, raise `GitDiscoveryError` and\n   report freshness as unresolved. A nested tracked module keeps the enclosing\n   exclude rules. The scope kind `untracked-tree` is not the kind\n   `unversioned`. A Git query\n   failure for a Git-backed scope raises; it is never silently replaced by\n   the filesystem walk.\n2. Sort normalized repository-relative paths.\n3. Hash each file's path and SHA-256 content hash with NUL delimiters.\n4. Hash that sequence with SHA-256 and record the first 16 hexadecimal\n   characters.\n5. This is a working-tree snapshot: each included file's content hash comes\n   from the bytes currently on disk, not from the Git index. If a file's\n   staged content differs from its current working-tree content, this\n   fingerprint reflects only the working tree; call\n   `staged_working_tree_divergence` to report that difference separately —\n   never describe this fingerprint itself as covering staged content.\n6. Exclude generated context (`AIDLC_CONTEXT.md`, `.ai-dlc-config.md`,\n   `aidlc-docs/`, and `.cursor/BUGBOT.md`), `.git`, nested Git checkouts,\n   caches, build output, vendor directories, recognized secret files\n   (`.env` and non-template `.env.*`, key/certificate files), and symlinks\n   outside authorized roots. Include committed templates such as `.env.example`.\n   Do not exclude product source under `.cursor/skills` or `.cursor/rules`.\n7. If the declared scope is missing, is not a directory, or the walk or Git\n   query fails for a reason other than \"not a Git repository,\" do not\n   record a fingerprint. Treat freshness as unavailable.\n\nRecord declared scope separately from examined files. The helper discovers\nadditions, deletions, and renames inside scope through the current sorted file\nset. Recheck affected evidence when a source or contract changes during\nanalysis; otherwise report a mixed snapshot as uncertain. A Git root or nested\ntracked module records its owning root revision plus the fingerprint when\n`HEAD` resolves to a commit. When the Git root exists but `HEAD` does not\nresolve, record `no-commit` plus the fingerprint and keep Git file discovery.\nDo not invent a SHA and do not switch that tree to the unversioned walk. An\nunversioned tree records `unversioned` plus the fingerprint. Never use a parent\nrevision that does not track the examined files.\n\nRefresh only modules affected by changed paths, requested scope, or stale\nevidence. Preserve human-authored sections. If a safe merge is unclear, show a\ntargeted diff. Current code and contracts override a stale summary. Create\n`integration-map.md` only for verified cross-module or cross-repository\ndependencies. When a legacy solution-wide integration map is migrated, each\nrepository's file includes only the verified relationships that repository\nparticipates in, not a copy of the whole map. Link existing ADRs when\nrelevant; never invent one. If `aidlc-docs/architecture.md` or another\nauthoritative ADR path exists, link it from the index and from any module\nthat the decision constrains. Do not copy the decision log into generated\ncontext.\n\nUse [context-templates.md](context-templates.md) for generated structure and\nsize budgets. Generated sections may refresh in place. Preserve human-authored\nsections. Existing documents without ownership markers receive a targeted merge\nproposal. Remove a deleted module only from active navigation after evidence;\nnever delete its document blindly. A second sync without relevant changes must\nproduce no content changes.\n\nWhen creating a new generated context document, use minimal ownership markers:\n\n```markdown\n\u003c!-- AI-DLC:generated:start -->\n\u003c!-- generated facts and links -->\n\u003c!-- AI-DLC:generated:end -->\n```\n\nOnly content inside those markers may refresh automatically. Human text outside\nthem is preserved. Do not retrofit markers into an existing human-authored\ndocument without showing a targeted proposal first.\n\n## Examples\n\nSingle-module service (behaviorful — payments, an API, a worker):\n\n```text\naidlc-docs/\n  repository-context.md\nAIDLC_CONTEXT.md\n```\n\n`repository-context.md` stays a short index. The module document holds\ncoverage as a summary, material architecture details, runtime flows, and\nthe rest of the architectural inventory. Do not skip `AIDLC_CONTEXT.md`\nfor this shape merely because it is a single module.\n\nDocumentation-only or genuinely passive repository (no meaningful module):\n\n```text\naidlc-docs/\n  repository-context.md\n```\n\nKeep an empty `## Modules` table. Do not list a module whose Context\ncolumn points nowhere.\n\nMonorepo:\n\n```text\naidlc-docs/\n  repository-context.md\napps/\n  storefront/\n    AIDLC_CONTEXT.md\nservices/\n  orders/\n    AIDLC_CONTEXT.md\n```\n\nMulti-repository workspace (distributed; each Git root keeps its own index):\n\n```text\nweb/                              # Git root\n  aidlc-docs/\n    repository-context.md\n  apps/\n    storefront/\n      AIDLC_CONTEXT.md\npayments/                         # Git root\n  aidlc-docs/\n    repository-context.md\n  AIDLC_CONTEXT.md\n```\n\nEach repository's `aidlc-docs/repository-context.md` is that repository's own index. A sibling is reached through a `Related repository` entry, not through one shared index above both Git roots. If `payments/` is a behaviorful service (handlers, a payment client, persistence), create `payments/AIDLC_CONTEXT.md` even though it is a single-module repository. List it in `## Modules` only when that local context file exists.\n\nExisting shared artifact home (compatibility with a configuration the user already authorized; not the destination of a distributed migration):\n\n```text\nengagement/                       # existing authorized artifact home, not itself a Git root\n  aidlc-docs/\n    repository-context.md\n    integration-map.md            # only after a verified web-to-payments contract\nweb/                              # Git root\n  apps/\n    storefront/\n      AIDLC_CONTEXT.md\npayments/                         # Git root\n```\n\nKeep this layout only when that shared home already exists and the user has authorized it. Do not propose it for a new multi-repository product, and do not use it as the destination when migrating away from a legacy coordinator.\n","inbound":[".cursor/skills/scaffold-project/SKILL.md",".cursor/skills/scaffold-project/references/foundation-and-review.md",".cursor/skills/sync-context/SKILL.md",".cursor/skills/sync-context/references/architecture-discovery.md",".cursor/skills/sync-context/references/artifact-home.md",".cursor/skills/sync-context/references/legacy-migration.md",".cursor/skills/sync-context/references/pull-request-template.md"]},{"id":".cursor/skills/sync-context/references/context-quality.md","kind":"reference","name":"Context quality","summary":"Accuracy/completeness bar for generated context and honest unknowns.","words":1238,"chars":8155,"lines":156,"links":[".cursor/skills/sync-context/references/architecture-discovery.md",".cursor/skills/sync-context/references/review-handoff.md","MANUAL_EVALUATION.md",".cursor/skills/sync-context/references/context-templates.md"],"headings":[{"text":"Context quality","line":1},{"text":"The coverage section","line":8},{"text":"Coverage","line":24},{"text":"Material architecture details","line":56},{"text":"Evidence catalog","line":78},{"text":"The quality bar","line":90},{"text":"What good and bad look like","line":119},{"text":"Relationship to line budgets","line":149}],"source":"# Context quality\n\nThis reference defines when a drafted or refreshed context document is good\nenough, and what the `## Coverage` section records. It replaces document\nlength as the signal for quality. A document can be short and excellent, or\nlong and shallow; neither line count nor section count decides which.\n\n## The coverage section\n\nA module `AIDLC_CONTEXT.md` records a `## Coverage` table naming the\ndimensions from\n[architecture-discovery.md](architecture-discovery.md) that belong in the\npublished document. Coverage is an index of architectural understanding,\nnot the full architecture documentation. `context-architect` evaluates\nevery dimension in its inventory and reports material findings. The\npublished table is a subset: material dimensions, relevant unknowns, and\na `not applicable` row only when that absence is important or\nnon-obvious to a downstream engineer. Do not pad the table with a\n`not applicable` row for every dimension on the master list. Do not\nreduce discovered persistence, auth, retries, feature flags, or\nintegrations to one-line Coverage rows.\n\n```markdown\n## Coverage\n\n| Dimension | State | Evidence |\n| --- | --- | --- |\n| Entry points | verified | `services/orders/handler.py` → `create_order` |\n| External integrations | verified | `services/orders/payment_client.py` → `charge()` |\n| Retry and idempotency | partial | retry exists in `payment_client.py`; idempotency key not confirmed |\n| Security and trust boundaries | unknown | auth middleware not inspected this pass |\n| Deployment topology | not applicable | library module; a downstream engineer might otherwise look for a deploy unit here |\n```\n\nNo deterministic validator counts rows, requires a fixed number of\ndimensions, or fails a document for an `unknown` or `not applicable` row.\n`context-reviewer` is where a coverage table gets checked against reality:\nwhether a row claiming `verified` is actually backed by the cited evidence,\nand whether a dimension that plainly matters to this module (for example\nsecurity on a module that handles payment data) was skipped without a\nstated reason. A dimension irrelevant to a given module does not need a\npublished row. Include `not applicable` only when the absence is important\nor non-obvious — for example a library that a reader might assume has its\nown deploy unit. Do not pad the table with `not applicable` rows for every\ndimension on the master list.\n\nA Coverage state of `verified` means the material aspects of that\ndimension within the declared inspection scope were directly inspected\nand the published claims are supported by that evidence. Opening some\nrelated file is not enough. Prefer `partial` when only part of a material\ndimension was inspected, `inferred` when evidence suggests but does not\ndirectly establish the claim, `unknown` when it could not be determined,\nand `not applicable` when it genuinely does not apply. An honest\n`unknown` is better than an unsupported `verified`.\n\n## Material architecture details\n\nAfter Coverage, the module document records `## Material architecture\ndetails`. Generate subsections only for dimensions that are materially\nimportant to that module. Examples, not a mandatory heading list:\n\n- Data and persistence\n- Security and trust boundaries\n- Failure handling, retries, and idempotency\n- Configuration and feature flags\n- Events and asynchronous processing\n- Observability\n- Deployment/runtime topology\n- Architectural constraints and invariants\n\nDo not create empty or generic sections merely to fill the template. The\nobjective is that Coverage tells a reader what was considered and at what\nconfidence, while Material architecture details tells a downstream\nplanning or implementation agent what it actually needs to know. The\nfinal context should preserve enough architectural information that those\nagents do not rediscover major system behavior from scratch.\n\n## Evidence catalog\n\n`## Evidence and existing docs` is the canonical catalog of\nrepository-relative local evidence paths referenced by the context. Any\nlocal path used as supporting evidence in Coverage, runtime flows,\nMaterial architecture details, or architectural decisions and constraints\nmust also appear there. Prose elsewhere may still name a symbol next to\nthe path (`src/auth.py` → `validate_token()`), but the path itself belongs\nin this catalog. Python only checks that a catalogued path exists inside\nan authorized root. `context-reviewer` judges whether the source actually\nsupports the claim.\n\n## The quality bar\n\nBefore treating a draft as ready for independent review (or, for a small\nupdate where review is skipped per\n[review-handoff.md](review-handoff.md), before closing the sync), check\nwhether the document actually answers the questions a downstream engineer\nwould ask. These are examples, not a Python-checkable list:\n\n1. If I need to change this module's main behavior, which file do I open\n   first?\n2. What does this module do when its main dependency is unavailable?\n3. What other module breaks if I change this module's public contract?\n4. Where does untrusted input first get validated here?\n5. If this module publishes or consumes an event, what happens on\n   duplicate delivery?\n6. What state does this module hold, and what happens to it on restart?\n7. Which configuration value would I change to alter this module's\n   behavior in production, and where is it read?\n8. What test would actually fail if I broke this module's main flow?\n9. What does this module's owner not yet know about it (the honest\n   unknowns), and why would that matter to my change?\n10. If I only read this document and never opened the source, what would I\n    get wrong?\n\nA document that cannot answer most of these for a module with real\nbehavior (not a thin pass-through or a pure data class) is not ready, no\nmatter how many lines it has. A short document that answers them plainly,\nciting evidence, is ready.\n\n## What good and bad look like\n\nSee [MANUAL_EVALUATION.md](../../../../MANUAL_EVALUATION.md) for named\nscenarios across repository types, and\n[tests/fixtures/context_review](../../../../tests/fixtures/context_review)\nfor a concrete fixture with seeded defects and an answer key used to\nevaluate whether review actually catches them. Four patterns are explicit\nregressions, never an acceptable output of this skill:\n\n- **Shallow service context** — a module with real external calls, state,\n  or a trust boundary gets a context document that only restates its\n  framework scaffolding (routes exist, a controller exists) with no\n  runtime flow, no integration detail, and no mention of what happens on\n  failure. Depth was available in the source and was not captured.\n- **False completeness** — a coverage row, an `Examined` field, or prose\n  claims a dimension is verified when it was not actually inspected (a\n  guess from the module's name or framework convention, not from reading\n  the file). This is worse than an honest unknown: it tells a downstream\n  reader something false with confidence.\n- **Length gaming** — padding a document toward a target line count with\n  generic, non-specific prose (\"this module handles orders and ensures\n  reliability\") instead of specific, evidence-backed statements, to look\n  thorough without being thorough.\n- **Honest unknown beats invented behavior.** When evidence genuinely runs\n  out, write `unknown` with what is missing and where it would likely be\n  found. Do not invent a plausible-sounding behavior to fill the gap. An\n  honest `unknown` is a correct answer; a confident guess is a defect even\n  when it happens to be right, because the next reader cannot tell the\n  difference between a verified fact and a lucky guess.\n\n## Relationship to line budgets\n\n[context-templates.md](context-templates.md)'s module-context budget is an\nauthoring guideline, not a quality gate: `validate_generated_context` never\nfails a document for exceeding it. Quality is judged by this reference and\nby `context-reviewer`, not by `scripts/context_tools.py` counting lines.\nDo not use an advisory budget as a reason to omit a dimension that matters,\nand do not treat \"under budget\" as evidence that a document is complete.\n","inbound":[".cursor/skills/sync-context/SKILL.md",".cursor/skills/sync-context/references/architecture-discovery.md",".cursor/skills/sync-context/references/context-generation.md",".cursor/skills/sync-context/references/context-templates.md",".cursor/skills/sync-context/references/review-handoff.md","MANUAL_EVALUATION.md"]},{"id":".cursor/skills/sync-context/references/context-templates.md","kind":"reference","name":"Context templates and budgets","summary":"Repository/module context shapes, coverage and fingerprint fields.","words":1743,"chars":11600,"lines":285,"links":[".cursor/skills/sync-context/references/context-quality.md",".cursor/skills/sync-context/references/architecture-discovery.md"],"headings":[{"text":"Context templates and budgets","line":1},{"text":"Budgets","line":7},{"text":"Repository index template","line":63},{"text":"Repository context","line":91},{"text":"Scope","line":95},{"text":"Modules","line":105},{"text":"Verified integration boundaries","line":111},{"text":"Architecture decisions","line":115},{"text":"Unknowns","line":119},{"text":"Repository context","line":134},{"text":"Scope","line":138},{"text":"Modules","line":144},{"text":"Verified integration boundaries","line":150},{"text":"Architecture decisions","line":154},{"text":"Unknowns","line":158},{"text":"Module context template","line":165},{"text":"AIDLC context — \u003cmodule name>","line":192},{"text":"Identity and scope","line":196},{"text":"Responsibility","line":204},{"text":"Entry points and interfaces","line":208},{"text":"Representative runtime flows","line":212},{"text":"Dependencies and consumers","line":220},{"text":"Tests and commands","line":224},{"text":"Coverage","line":228},{"text":"Material architecture details","line":240},{"text":"Evidence and existing docs","line":251},{"text":"Unknowns","line":261},{"text":"Integration map template","line":271},{"text":"Integration map","line":274},{"text":"Verified boundaries","line":276},{"text":"Unknowns","line":282}],"source":"# Context templates and budgets\n\nUse these templates only after the discovery mode selects an artifact home and\nmeaningful modules. They are generated-artifact templates, not instructions\nthat Cursor loads automatically.\n\n## Budgets\n\n| Artifact | Target | Guideline ceiling | Enforcement |\n| --- | --- | --- | --- |\n| `aidlc-docs/repository-context.md` | 60–100 lines | 150 lines | hard — `validate_generated_context` fails an over-cap index |\n| `AIDLC_CONTEXT.md` or fallback | 100–200 lines | 300 lines | metric only — not a validation result |\n| `.cursor/BUGBOT.md` | 30–100 lines | 150 lines | not validated by this module |\n| `SKILL.md` | — | 500 lines | checked by `tests/skill_contracts.py`, not a runtime gate |\n\nThese are authoring guidelines, not minimums, and for `AIDLC_CONTEXT.md` not a\ncorrectness property either: an AI-DLC policy choice about how much a document\nshould normally take to say, not a Cursor or Anthropic requirement and not\nproof that a document covers what it needs to cover. A module document under\nbudget can still be shallow; one slightly over budget because a module\ngenuinely has more verified integrations, flows, and failure modes to record\nis not thereby a defective document. Measure both line count and approximate\ncontext cost (`ceil(characters / 4)`) for visibility, not as a pass/fail gate\nfor module context. Do not apply these limits to application source,\nchangelogs, or unrelated user documents.\n\n**The repository index stays a hard target.** It is deliberately a short\nindex, not an architecture document, so `index:budget` in\n`validate_generated_context` still reports `failed` when it is over its\n150-line cap; an over-long index usually means module detail leaked into it\nrather than into the module's own document.\n\n**The module-context ceiling is advisory, not a validity gate.** Anthropic\nrecommends keeping `CLAUDE.md` under 200 lines and `SKILL.md` under 500 lines;\nour 300-line module-context guideline borrows that instinct for a different\nkind of document. `validate_generated_context` does not emit a\n`modules:budget` check at all. If you want the number, call `document_metrics`\nand report it as a metric (`lines: N`, `advisory guideline: 300`), never as\npassed or failed. See [context-quality.md](context-quality.md) for what\nactually decides whether a module document is good enough.\n`AIDLC_CONTEXT.md` is our own convention; Cursor does not load it implicitly.\n\nIf a generated artifact is noticeably larger than its target, look for\nduplicated generic prose first and link existing documentation instead of\nrestating it. Split only at real architectural boundaries. **Never cut a\nverified dimension, a runtime flow, or evidence just to land under the\nguideline ceiling** — a module that genuinely has more to say should say it,\nand the honest response to \"this got long\" is usually \"this module does more\nthan most,\" not \"shorten it.\" Never hide required evidence in a dense line or\nsilently drop it.\n\nRemediate a module document that has grown mostly from repetition, in this\norder: (1) remove repetition and unnecessary source-code narration; (2) link\nexisting authoritative documentation instead of restating it; (3) split only\nwhen a real architectural boundary justifies a new module document. Never\ntruncate a document silently and never create arbitrary numbered fragments\n(`repository-context-2.md`) to dodge a budget. Do not create one context file\nper source file or directory merely to stay under budget; generate module\ncontext only where it is useful and distinct. Do not introduce a minimum line\ncount either — a genuinely small module's accurate, evidence-backed document\ncan be short.\n\n## Repository index template\n\nUse one of the two shapes below. The instructions between them are not part\nof either document.\n\nA single-repository index declares `Index: \\`single-repository\\`` and one\n`Repository ID`. Its fingerprint covers that repository. Do not add a\n`Repository` column unless every row repeats that same repository ID.\nThe Context cell is a link to a local context file, not a URL or a\nsame-document anchor. Every module row requires that local file. An empty\nor missing Context cell is invalid. Index-only repositories keep the\nModules header and leave the table empty; they do not list a module that\npoints nowhere. Each generated index has one `## Scope` and one\n`## Modules`. Each module document has one `## Identity and scope`, one\n`## Coverage`, one `## Evidence and existing docs`, and one `## Unknowns`.\nThose four headings are the deterministic structural envelope. Runtime\nflows and `## Material architecture details` are not mechanically required.\n\nA Git working tree whose `HEAD` does not resolve to a commit uses baseline\n`no-commit` in this same field. That is not `unversioned`: a `.git` marker\nis present, and file discovery stays Git-based. Do not invent a SHA. The\nvalidator compares the fingerprint, not the baseline token, so `no-commit`\nneeds no second format. The module `Baseline and fingerprint` field uses the\nsame three tokens: a git revision, `no-commit`, or `unversioned`. A directory\nwithout Git records `unversioned` there too. Do not put `no-commit` on a tree\nthat has no Git root.\n\n```markdown\n# Repository context\n\n\u003c!-- AI-DLC:generated:start -->\n\n## Scope\n\n- Index: `single-repository`\n- Repository ID: `\u003cpersisted-id>`\n- Repository root: `\u003cportable workspace-relative path>`\n- Artifact home: `\u003cportable workspace-relative path>`\n- Baseline: `\u003cgit revision, no-commit, or unversioned>`\n- Fingerprint: `\u003cfingerprint>`\n- Examined: `\u003cpaths and boundaries>`\n\n## Modules\n\n| Module | Source | Context | Status |\n| --- | --- | --- | --- |\n| `\u003cmodule-id>` | `\u003cpath>` | `\u003crelative link>` | current / stale / unknown |\n\n## Verified integration boundaries\n\n\u003cLink to integration map only when verified.>\n\n## Architecture decisions\n\n\u003cLink `aidlc-docs/architecture.md` or the existing ADR location when that record exists. Omit this heading when it does not. Do not copy the decision log here.>\n\n## Unknowns\n\n- \u003cUnknown, evidence gap, or intentionally unexamined area.>\n\n\u003c!-- AI-DLC:generated:end -->\n```\n\nA multi-repository engagement index declares `Index: \\`multi-repository\\``\nand does not declare one `Repository ID` or one repository-wide fingerprint.\nEvery Modules row needs a `Repository` column. The same module ID may appear\nin two repositories. Without that column, validation cannot assign a source\npath and must not guess. The number of authorized roots does not decide\nwhich shape this is.\n\n```markdown\n# Repository context\n\n\u003c!-- AI-DLC:generated:start -->\n\n## Scope\n\n- Index: `multi-repository`\n- Artifact home: `\u003cportable workspace-relative path>`\n- Examined: `\u003cpaths and boundaries>`\n\n## Modules\n\n| Module | Repository | Source | Context | Status |\n| --- | --- | --- | --- | --- |\n| `\u003cmodule-id>` | `\u003crepository-id>` | `\u003cpath>` | `\u003crelative link>` | current / stale / unknown |\n\n## Verified integration boundaries\n\n\u003cLink to integration map only when verified.>\n\n## Architecture decisions\n\n\u003cLink each repository's own record, or the one explicit shared path. Do not duplicate a shared decision file.>\n\n## Unknowns\n\n- \u003cUnknown, evidence gap, or intentionally unexamined area.>\n\n\u003c!-- AI-DLC:generated:end -->\n```\n\n## Module context template\n\n`Repository ID`, `Module ID`, and `Source` must match the index row.\n`Source` is the repository-relative scope that freshness is computed\nagainst. The context file itself may live in the module directory or in an\nartifact-home fallback path.\n\nEvidence bullets have three path forms, and only those forms are checked:\n\n- A bullet that is only a Markdown link is resolved relative to this\n  document. Use it for a file in this checkout, including a sibling\n  repository when that repository is an authorized root.\n- A bullet that is only `` `apps/storefront/index.ts` `` (a slash, or a\n  filename extension, and nothing else in the bullet) is resolved in this\n  module's owning repository.\n- A bullet that is only `` `payments-api:services/payments/handler.ts` ``\n  is a path in another authorized repository. The text before the colon is\n  the repository ID.\n\nA symbol name such as `` `OrderPlacedEvent` `` is not a file path. Prose\nthat mentions a path inline is not checked. A path that exists is not proof\nthat it supports the surrounding claim. A catalog with no path references\nis mechanically `not_applicable` (`no local evidence paths to resolve`),\nnot a semantic pass. A missing `## Evidence and existing docs` heading\nfails structural validation.\n\n```markdown\n# AIDLC context — \u003cmodule name>\n\n\u003c!-- AI-DLC:generated:start -->\n\n## Identity and scope\n\n- Repository ID: `\u003cpersisted-id>`\n- Module ID: `\u003cstable-id>`\n- Source: `\u003crepository-relative directory>`\n- Baseline and fingerprint: `\u003cgit revision, no-commit, or unversioned>` / `\u003cfingerprint>`\n- Examined: `\u003csource, contracts, tests>`\n\n## Responsibility\n\n\u003cWhat this module owns and explicit boundary with neighbours.>\n\n## Entry points and interfaces\n\n- `\u003centry point or contract>` — `\u003cobservable behavior>`\n\n## Representative runtime flows\n\n\u003cOne end-to-end flow per behavior that matters, in the shape defined in\n[architecture-discovery.md](architecture-discovery.md): trigger, each hop\nwith its file path, outcome, and failure path when known. State\n`not applicable` with a reason for a module that has no flow of its own,\nfor example a pure helper library.>\n\n## Dependencies and consumers\n\n- `\u003cdependency or consumer>` — `\u003cverified relationship>`\n\n## Tests and commands\n\n- `\u003cverified command>` — `\u003cwhat it covers>`\n\n## Coverage\n\n\u003cThe published coverage table from [context-quality.md](context-quality.md).\nThe architecture inventory evaluates every dimension. This table includes\nmaterial dimensions, relevant unknowns, and a `not applicable` row only\nwhen that absence is important or non-obvious. Do not pad it with every\ndimension from the master list.>\n\n| Dimension | State | Evidence |\n| --- | --- | --- |\n| `\u003cdimension>` | verified / partial / inferred / unknown / not applicable | `\u003cpath and symbol, or reason>` |\n\n## Material architecture details\n\n\u003cSubsections only for dimensions that are materially important to this\nmodule. Coverage is a summary; this section preserves the discovered\narchitecture a downstream agent needs. Do not emit empty or generic\nheadings. Example subsection names, not a mandatory list: Data and\npersistence; Security and trust boundaries; Failure handling, retries,\nand idempotency; Configuration and feature flags; Events and asynchronous\nprocessing; Observability; Deployment/runtime topology; Architectural\nconstraints and invariants.>\n\n## Evidence and existing docs\n\n\u003cCanonical catalog of repository-relative local evidence paths. Any local\npath used as supporting evidence in Coverage, runtime flows, Material\narchitecture details, or constraints must also appear here.>\n\n- `services/payments/handler.ts`\n- document-relative Markdown link to `services/payments/handler.ts`\n- `aidlc-docs/architecture.md` (only when this module is constrained by that record)\n\n## Unknowns\n\n- \u003cEvidence that was not available or not inspected.>\n\n\u003c!-- AI-DLC:generated:end -->\n```\n\nUse the same body for an artifact-home fallback module context. Its title must\nalso state the original source root and why the colocated file was unavailable.\n\n## Integration map template\n\n```markdown\n# Integration map\n\n## Verified boundaries\n\n| From | To | Contract | Evidence |\n| --- | --- | --- | --- |\n| `\u003cmodule>` | `\u003cmodule or external system>` | `\u003cHTTP/event/schema>` | `\u003crelative path>` |\n\n## Unknowns\n\n- \u003cUnverified relationship or absent runtime evidence.>\n```\n","inbound":[".cursor/skills/scaffold-project/SKILL.md",".cursor/skills/scaffold-project/references/foundation-and-review.md",".cursor/skills/sync-context/SKILL.md",".cursor/skills/sync-context/references/architecture-discovery.md",".cursor/skills/sync-context/references/context-generation.md",".cursor/skills/sync-context/references/context-quality.md",".cursor/skills/sync-context/references/validation.md"]},{"id":".cursor/skills/sync-context/references/incremental-refresh.md","kind":"reference","name":"Discovery and incremental refresh","summary":"Classify changed evidence and update only relevant context.","words":1478,"chars":10325,"lines":134,"links":["references/architecture-decisions.md"],"headings":[{"text":"Discovery and incremental refresh","line":1},{"text":"Initial discovery","line":5},{"text":"Incremental refresh","line":21},{"text":"Staged versus working-tree divergence","line":48},{"text":"No relevant changes","line":70},{"text":"Submodules and unavailable related repositories","line":115}],"source":"# Discovery and incremental refresh\n\nUse code and versioned contracts as current evidence. Pick one internal mode.\n\n## Initial discovery\n\nUse initial discovery when the repository index or usable module context is\nmissing, when the user asks for a full refresh, or when the prior baseline\ncannot be compared. Identify meaningful modules from workspace configuration,\nmanifests, deployment boundaries, entry points, contracts, and test structure.\nInspect representative source and relevant dependencies. Do not require a dirty\ndiff and do not read every source file by default.\n\nRecord examined paths, declared scope, and unknowns. “Initial discovery\ncompleted” means only that the recorded scope was examined; it never means the\nwhole repository was read. Never equate a Git listing or a fingerprint's file\nset with having examined, analyzed, or verified every one of those files;\ninventoried, inspected, and verified are different evidence levels and the\ngenerated record must not blur them.\n\n## Incremental refresh\n\nUse incremental refresh only when usable prior context exists. Compare its\nrecorded baseline and fingerprint to current source plus staged, unstaged, and\nrelevant untracked changes. Refresh affected modules and index entries.\nExpand to downstream consumers when shared contracts, packages, configuration,\nor interfaces change. Detect new, removed, and renamed files or modules. If the\nold baseline is unavailable, use bounded rediscovery instead of claiming\nfreshness.\n\nPreserve unchanged content and avoid timestamp-only rewrites.\n\nEach repository or module context record must include:\n\n- repository path and, when the consumer is a Git root or nested tracked path,\n  that Git root's revision;\n- a freshness fingerprint of examined source paths; generated context files do\n  not participate in that hash;\n- relevant uncommitted modifications, without copying sensitive values;\n- paths examined and direct dependencies;\n- observed facts versus assumptions;\n- a freshness boundary such as \"valid for `src/payments/**` at revision `abc123`, fingerprint `a1b2c3d4`\" or, for an unversioned tree, \"unversioned; fingerprint `a1b2c3d4` for `services/checkout/**`\".\n\nDo not use a parent repository revision as freshness when that revision does not track the examined files.\n\nThe fingerprint algorithm is `content_fingerprint` in `scripts/context_tools.py`: a deterministic SHA-256 over each examined file's repository-relative path and content hash, truncated to 16 hexadecimal characters. For a Git-backed scope, `iter_fingerprint_files` discovers the included files with Git — every tracked file plus every untracked file `.gitignore` does not exclude — so an ignored-and-untracked file never enters the hash, and a tracked file is never dropped merely because a later ignore rule would have excluded it if it were untracked; for a genuinely unversioned tree Git applies that tree's own ignore rules through a temporary Git directory that is not created in the project, and a failure leaves freshness unresolved instead of reading ignored files. An `untracked-tree` does not use the enclosing repository's exclude rules, so a parent ignore cannot hide that tree's source or make a source edit look fresh. Git applies the ignore rules inside that tree, including negation and nested rules, and a Git failure while applying them leaves freshness unresolved. A path that does not exist yet is an `absent` destination from `destination_freshness`, not an empty-directory fingerprint. That absent value includes index and HEAD records scoped to the destination; those records are separate from `content_fingerprint`, and a staged change outside the destination does not change them. A nested tracked module keeps the enclosing exclude rules. A directory that has a `.git` marker, including a nested module of that checkout, is not unversioned when Git cannot read the metadata: that failure is reported instead of falling back to the walk. A Git query failure for a Git-backed scope raises rather than silently falling back to that walk. The fingerprint detects a change in the included inputs; it does not prove semantic accuracy or that every file was fully inspected. It is a working-tree snapshot: each included file's content hash comes from the bytes currently on disk, never from the Git index. A recorded Git revision by itself does not cover uncommitted working-tree changes, so the fingerprint reflects the actual working tree rather than only the last commit — but it does not separately reflect staged (Git index) content. When a file's staged content differs from its current working-tree content, report that with `staged_working_tree_divergence`; never describe the fingerprint itself as covering staged content. If the prior baseline is missing or incompatible with the current scope, perform a fresh scoped inspection and report that limitation rather than reusing a stale comparison. Generated context files never enter their own source fingerprint, so refreshing context never invalidates itself on the next run.\n\n### Staged versus working-tree divergence\n\nA file can be staged (added to the Git index) and then edited again before\ncommit, so its staged content and its current on-disk content differ.\n`content_fingerprint` never sees the staged copy, only the working tree.\nCall `staged_working_tree_divergence(scope_root)` to list the\nrepository-relative paths where this applies, and report them separately\nfrom the freshness fingerprint — never resolve the difference silently in\neither direction. An empty result means Git checked and found no\ndifference. If the helper raises `GitDiscoveryError`, report the\nstaged-versus-working-tree comparison as unavailable. Do not describe\nthat failure as no difference.\n\nCompare the previous module source paths with the paths found now using\n`diff_module_sources`. Report added and removed paths explicitly. Do not\ntreat two different paths as a rename unless other evidence links them.\n\nSummarize availability with `scope_verification_status`. `\"complete\"` is\nallowed only when every requested scope was available. Any unavailable\nrepository, submodule, or dependency is `\"partial\"` or `\"unavailable\"`,\nnever a claim that the whole scope is current.\n\n## No relevant changes\n\nClassify the recorded fingerprint with `classify_fingerprint_change`, then\ncombine it with the other change sets using `context_sync_outcome`. Missing\nevidence is not a successful no-op.\n\n- `\"unavailable\"` — no usable prior fingerprint. This is first-time\n  generation or an incompatible baseline, not \"no relevant changes.\"\n- `\"unchanged\"` — the source documents in change set A need no rewrite and\n  no approval. The closing result is still shown. This covers only `content_fingerprint`'s source\n  inputs; it says nothing about a pending `## Project references` update,\n  which is also part of change set A but never enters that fingerprint\n  (see below). Still evaluate pending work in set B (Bugbot, project\n  rules, and a pull-request template) and set C (legacy cleanup). Respect a declined decision, and do\n  not re-prompt an unchanged deferred proposal in the same run. Existing\n  approval covers only its recorded scope and content.\n- `\"changed\"` — set A needs a proposal.\n\nA confirmed, user-requested `## Project references` change (switching the\nconfigured Jira board or Figma reference, for example) is part of change\nset A, but `classify_fingerprint_change` cannot see it: `content_fingerprint`\nonly hashes source paths, and generated configuration never enters that\nhash on purpose, so refreshing context never invalidates itself. Treating an\n`\"unchanged\"` source fingerprint as \"all of set A needs no update\" would\nmake that pending configuration change unreachable. Pass it explicitly as\n`project_reference_pending` to `context_sync_outcome` instead. A confirmed\nmembership change (`Product` or a `Related repository` entry) is the same\nshape: pass it as `membership_pending`. A pending pull-request template\noffer is set B work: pass it as `pr_template_pending`. Do not fold that\nflag into `bugbot_pending` or `project_rule_pending`.\n\n`context_sync_outcome(context_change, bugbot_pending, project_rule_pending,\nlegacy_cleanup_pending, project_reference_pending=False,\nmembership_pending=False, pr_template_pending=False)` returns\n`\"no_relevant_changes\"` only when the source fingerprint is `\"unchanged\"`,\nno project-reference or membership update is pending, and sets B and C have no actionable\nwork. That is the only full no-op: no writes and no new approval question.\nIt returns `\"context_current_migration_pending\"` when the source is\nunchanged and nothing is pending for `## Project references` or membership, but B or C\nstill has work. It returns `\"relevant_updates_found\"` for every other\ncombination — including a pending project-reference update on its own, with\nan otherwise-unchanged source fingerprint. An unchanged source fingerprint\nmust not end the run while a project-reference update, membership update, B, or C still has\nwork.\n\n## Submodules and unavailable related repositories\n\nA nested `.git` marker is not proof of a real Git submodule; confirm against\n`.gitmodules` with `is_declared_submodule` before treating a nested path\ndifferently from an ordinary nested repository. A declared submodule that is\nnot checked out, is detached, or is otherwise unreachable from the current\nwindow produces **partial status** for that specific path: report exactly\nwhat could and could not be verified for it, continue the rest of the sync\nwhere it is safe to do so, and never report the whole scope as current\nbecause the unavailable part was skipped.\n\nPreserve human-authored content where it does not conflict with source. Flag and\nrefresh a stale summary; code and contracts remain authoritative. Do not scan\nvendor, build, cache, generated, or inaccessible sibling directories.\n\nDo not create an integration map for imports within one module. Create it only after observing a dependency across services, repositories, deployable systems, or a public contract boundary.\n\nADRs record approved architectural decisions. Discovery alone is not an ADR trigger.\nLink an existing record per [architecture-decisions.md](../../../../references/architecture-decisions.md).\nDo not invent one, and do not rewrite an accepted binding clause to match the code.\n","inbound":[".cursor/skills/sync-context/SKILL.md"]},{"id":".cursor/skills/sync-context/references/legacy-migration.md","kind":"reference","name":"Legacy migration","summary":"Known legacy recognition, preservation/migration/retirement and checkout deletion gates.","words":6293,"chars":45656,"lines":752,"links":[".cursor/skills/sync-context/references/artifact-home.md",".cursor/skills/sync-context/SKILL.md","references/project-onboarding.md",".cursor/skills/sync-context/references/project-rules.md","references/canvas-review.md",".cursor/skills/sync-context/references/bugbot-configuration.md",".cursor/skills/sync-context/references/validation.md",".cursor/skills/sync-context/references/review-handoff.md",".cursor/skills/sync-context/references/context-generation.md"],"headings":[{"text":"Legacy migration","line":1},{"text":"Known legacy AI-DLC installation","line":27},{"text":"Standard-file treatment","line":108},{"text":"Generators and historical outputs","line":155},{"text":"Architecture decision records","line":180},{"text":"Legacy CI workflows","line":253},{"text":"Workspace references to the framework being replaced","line":268},{"text":"Classify repository role before classifying components","line":278},{"text":"Inventory before classifying","line":334},{"text":"Classify, do not bulk-delete","line":362},{"text":"Present one cleanup set, then wait","line":421},{"text":"Mandatory coordinator-retirement decision","line":438},{"text":"Checkout deletion preconditions","line":501},{"text":"Preserving the workspace file before coordinator removal","line":567},{"text":"Reviewing a migration in Canvas","line":625},{"text":"Applying a migration in a recoverable sequence","line":659}],"source":"# Legacy migration\n\nThis is change set C. Migration stays inside `sync-context`, but context\ngeneration (set A) and cleanup (set C) are different change sets with\ndifferent evidence and different approval. A run that generated new context\nwhile cleanup remains pending must report exactly that, and must not claim\nmigration is complete. Only an applied, verified cleanup set earns that\nclaim.\n\nA full migration away from a legacy adopted coordinator touches both sets at\nonce: set A creates each product repository's own distributed context (see\n[artifact-home.md](artifact-home.md), \"Migrating from adopted coordinator to\ndistributed\"), and set C retires the coordinator's superseded files and\nwalks through the mandatory retirement decision below. This is still not a\nseparate skill or a new orchestration engine — it is the existing seven-stage\npipeline in [SKILL.md](../SKILL.md), applied to both sets in the same run,\nwith the usual independent approval per set.\n\n**This reference describes a generic migration path for any engagement.**\nNo product or repository name is hardcoded into this behavior; every example\nrepository name below is illustrative. The one concrete installation this\npath recognizes is the legacy digital-ai-dlc framework, by the instruction\nmarkers below. Recognizing it selects the distributed proposal and the\nstandard-fi
