ated Jira or Figma synchronization; crawling an entire Figma project or file; a new MCP client, authentication layer, or integration framework; automatic screenshots, exports, or attachments.\n\nMissing design is not a universal blocker. A Story may be drafted and published without a Figma reference. Flag the gap only when the missing design is needed to resolve a material requirement for the requested work.\n\n## Semantic precedence\n\nWhen more than one of these sections exists, none of them silently overrides another:\n\n- acceptance criteria state required observable behavior;\n- scope and exclusions state explicit boundaries;\n- open questions state unresolved product decisions;\n- a Story-specific goal or measure states a desired outcome; it cannot override acceptance criteria;\n- testing and validation expectations state how existing behavior may be exercised; they cannot introduce or override behavior;\n- a design reference is supporting evidence; it cannot silently override an explicitly approved requirement.\n\nIf two sources conflict — for example the acceptance criteria require error and empty states to be distinguishable, but the referenced design shows the same UI for both — surface that conflict for the Product Owner to resolve. Do not silently decide which source wins.\n\n## Keep output concise through omission, not information loss\n\nMinimum sufficient context, with no duplication, is the goal — not the shortest possible Story. A Story needs only the sections that add real information; a perfectly valid Story may be only title, story statement, acceptance criteria, and scope. Do not fill an optional section merely because it exists in this list. Do not shorten acceptance criteria by removing a distinction that changes behavior, such as empty state versus error state, authenticated versus unauthenticated behavior, or in-scope versus out-of-scope behavior.\n","inbound":[".cursor/skills/plan-work/SKILL.md",".cursor/skills/plan-work/references/jira-story-template.md",".cursor/skills/plan-work/references/task.md",".cursor/skills/plan-work/references/update-existing.md"]},{"id":".cursor/skills/plan-work/references/sprint-backlog.md","kind":"reference","name":"Sprint backlog proposal","summary":"Candidate work, goal and dependencies without invented capacity.","words":114,"chars":765,"lines":5,"links":[],"headings":[{"text":"Sprint backlog proposal","line":1}],"source":"# Sprint backlog proposal\n\nPropose a backlog from approved work, current dependencies, and evidence of readiness. Do not invent team capacity, commitments, sprint identifiers, priorities, or dates; report them as unknown when evidence is missing and material.\n\nFor each candidate, state whether it already exists in Jira and is being **selected** into the backlog, or whether it still needs to be **created** and defined; do not blur that distinction. State the user outcome, prerequisite work, uncertainty, and why it may be ready. Surface sprint goal coherence, dependency order, missing prerequisite work, and blockers. Present alternatives where dependency order is uncertain, and report known team capacity only when the evidence for it is actually available.\n","inbound":[]},{"id":".cursor/skills/plan-work/references/task.md","kind":"reference","name":"Task","summary":"A coherent work item without forcing a fake user story.","words":244,"chars":1522,"lines":19,"links":[".cursor/skills/plan-work/references/single-story.md",".cursor/skills/plan-work/references/epic-discovery.md","references/jira-integration.md"],"headings":[{"text":"Task","line":1}],"source":"# Task\n\nUse this route for work that is not naturally a user-facing Story: technical or supporting work with no genuine user or product outcome of its own.\n\nDo not create a fake persona to force Story wording, for example \"As a developer, I want to configure the API Gateway, so that...\" when there is no real user outcome behind it. If the work does genuinely deliver a user or product outcome, route it to [single-story.md](single-story.md) instead.\n\nPropose:\n\n- title;\n- objective, stated as the technical outcome this work produces;\n- reason or context: why this work is needed now;\n- parent User Story or Epic, when one applies — see [epic-discovery.md](epic-discovery.md) for a Story or Epic parent recommendation. That parent is a logical relationship (\"this Task supports that Story\"), not a Jira issue type. When preparing the Jira write, discover the site's hierarchy and let the Product Owner approve the exact issue type: a Jira Subtask under the Story, or a Jira Task linked to the Story. Do not silently change a Task into a Subtask. See [Jira integration](../../../../references/jira-integration.md);\n- completion criteria, observable and specific;\n- affected area or repository, when known from context already read;\n- dependencies;\n- validation expectations;\n- open questions.\n\nA Task does not require all three hierarchy levels above it. Do not publish a Task with the User Story description template. Keep the Jira mutation boundary in the main skill workflow. Do not run a standalone duplicate search.\n","inbound":[".cursor/skills/plan-work/references/epic-discovery.md",".cursor/skills/plan-work/references/jira-story-template.md",".cursor/skills/plan-work/references/single-story.md"]},{"id":".cursor/skills/plan-work/references/update-existing.md","kind":"reference","name":"Update existing work","summary":"Minimal field-level update preserving unrelated approved content.","words":192,"chars":1319,"lines":11,"links":[".cursor/skills/plan-work/references/single-story.md"],"headings":[{"text":"Update existing work","line":1}],"source":"# Update existing work\n\nRead the current issue fields, comments needed for context, linked work, and relevant implementation. Preserve unrelated text. Preserve content the Product Owner already approved unless newly read evidence actually conflicts with it; when it does, surface the conflict and let the Product Owner decide rather than silently overwriting the approved value. That includes an existing Story-specific design URL or node identifier; do not replace it with the project-level Figma URL. Collection of a newly supplied or already-linked design reference follows [single-story.md](single-story.md), Design reference. Do not move or duplicate acceptance criteria between the acceptance-criteria field and Description without showing that change in the field-level diff. Running this on an unchanged item must not create a duplicate planning artifact.\n\nShow changes as a field-level diff:\n\n- current value or \"unchanged\";\n- proposed value;\n- reason and supporting evidence.\n\nDo not run a standalone duplicate search. If an obvious duplicate is encountered incidentally while reading the current issue or an explicitly referenced issue, surface it. If a prior partial write is possible, identify the existing record by key and content before retrying. That re-read is write recovery, not a duplicate search.\n","inbound":[]},{"id":".cursor/skills/refine-story/SKILL.md","kind":"skill","name":"Refine story","summary":"Refine an approved Jira Epic, Story, Task, or Bug into an evidence-based technical implementation proposal while preserving business acceptance criteria.","words":2424,"chars":17129,"lines":71,"links":["references/response-style.md","references/context-retrieval.md","references/jira-integration.md","references/criterion-ids.md","references/verification-evidence.md","references/architecture-decisions.md",".cursor/skills/refine-story/references/review-profiles.md",".cursor/skills/refine-story/references/modes-and-drift.md",".cursor/skills/refine-story/references/technical-task-template.md","references/approval-contract.md","references/canvas-review.md","references/skill-composition.md","references/work-record.md","references/model-evaluation.md"],"headings":[{"text":"Refine story","line":7},{"text":"Response shape","line":9},{"text":"Context retrieval","line":12},{"text":"Input","line":15},{"text":"Workflow","line":33},{"text":"Approval boundary","line":49},{"text":"Output","line":54},{"text":"Reference loading","line":59}],"source":"---\nname: refine-story\ndescription: Refine an approved Jira Epic, Story, Task, or Bug into an evidence-based technical implementation proposal while preserving business acceptance criteria.\ndisable-model-invocation: true\n---\n\n# Refine story\n\n## Response shape\nFollow the shared [compact response style](../../../references/response-style.md).\n\n## Context retrieval\nUse [context retrieval](../../../references/context-retrieval.md). Read selected module context and current contracts before deeper development or QA refinement.\n\n## Input\nAccept a Jira key or URL, or an approved local draft, plus `development`, `qa`, or `combined` mode. Read the issue through Jira MCP using the Jira integration contract when available; otherwise require supplied content and mark the result local-only. A missing parent is not the same as missing approval. An approved standalone technical draft does not need an artificial parent or a `/plan-work` handoff. Provide a `/plan-work` handoff before creating a Task or Subtask only when the draft has neither approved business scope nor approved standalone technical scope.\n\nRead the supplied issue, its relevant parent, approved business acceptance criteria, relevant existing subtasks and issue links, and decisions already recorded. Read affected code, contracts, and tests from the repository. Retrieve only comments and linked work relevant to this refinement; do not crawl the whole project. Use context documents to navigate, then verify every implementation claim against current source — a context document is a map, not proof.\n\nName the business source: the issue whose approved acceptance criteria this technical work implements. A Jira parent is not automatically that source. A Subtask's parent is a Story, Task, or Bug. A Task may sit under an Epic while its business source is a linked Story. Record the source's key and URL and the approved relationship. Do not treat every dependency link as the business source. If more than one linked issue could be the source, ask one focused question. Technical work that starts from an Epic may name that Epic. Approved standalone technical work does not need an invented business parent.\n\nIf a required repository or Jira capability is unavailable, state that limitation and separate verified facts from assumptions. Keep drafting the parts that do not depend on the missing capability; do not claim a complete assessment.\n\nRoute by the supplied issue's type:\n\n- **Epic** — refine it directly when it supports meaningful technical enablement, dependencies, or decomposition. Do not force the developer through an artificial intermediate Story first. Return unresolved business scope to the Product Owner through `/plan-work` rather than guessing it. Do not parent a Subtask under an Epic.\n- **Story** — refine the implementation and validation of its already-approved business outcome.\n- **Technical Task** — prefer updating that existing item over creating another one, when the update stays coherent.\n- **Bug** — inspect the reproduction, the expected behavior, the available evidence, and what still needs investigation. Do not invent a root cause.\n\nDiscover the connected site's actual Jira issue types and hierarchy before proposing a relationship. This plugin's own planning levels (Epic, User Story, Task) are a conceptual model, not Jira's parent rules — see [Jira integration](../../../references/jira-integration.md).\n\n## Workflow\n1. Record the issue's current revision, the analyzed Git baseline, affected paths, and local modifications.\n2. Confirm each business acceptance criterion stays business-facing before adding technical detail. Recover approved constraints even when they sit outside the Acceptance Criteria heading; keep each source. Do not invent thresholds. Preserve existing criterion identifiers; propose new local ids only in the approved publication payload. Follow [criterion identifiers](../../../references/criterion-ids.md). If this analysis uncovers a pending business decision, return it to the Product Owner through `/plan-work`. Do not resolve it unilaterally, and do not modify approved business acceptance criteria.\n3. In development mode, inspect behavior, callers, contracts, dependencies, compatibility, rollback, and risk. Name relevant existing behavior that current tests do not protect, including observable contracts and affected consumers. The listed files orient that search; they do not exclude a relevant dependency. Follow [verification evidence](../../../references/verification-evidence.md), \"Characterization of existing behavior.\"\n4. In QA mode, map every criterion to positive, negative, boundary, regression, fixture, environment, and automation needs. Include characterization of unprotected existing behavior where it applies.\n5. In combined mode, resolve conflicts between development feasibility and acceptance evidence. The main chat performs this analysis; do not delegate drafting of the refinement to a specialist agent.\n6. **Technical discussion and challenge — always runs, at a depth proportional to the change, regardless of the review profile selected in step 9.** Check what applies: existing functionality that could be reused instead of new code, affected contracts and consumers, data changes and compatibility, failure handling, retries, concurrency, and idempotency, security and operational consequences, testing feasibility, and whether a simpler alternative exists. Reuse accepted architecture decisions. Challenge a material alternative and include any proposed architecture-decision update in this same reviewable change set — see [architecture-decisions.md](../../../references/architecture-decisions.md). Persist a material, explicitly approved decision in the authoritative record; do not leave it only in chat. Creating the file is conditional. Recording a material approved decision is not optional. Persist a new or superseded entry only after the existing approval covers that exact content. Copy each new binding clause exactly; do not paraphrase it later. Create `aidlc-docs/architecture.md` only when the first such decision needs a record and no authoritative ADR location already exists. Otherwise reuse the existing location. Do not create an empty or duplicate record. A pending decision stays in the proposal; do not mark it accepted. If persistence is not authorized or cannot be completed, report it as pending; do not claim the decision was recorded. When this run creates the first decision record, include the minimum index and module navigation-link edits in that same approved change set. Preserve unrelated context. Verify the links resolve before reporting completion. If the record is written and the required link cannot be updated, report partial completion. Do not start `/sync-context` to finish that handoff. A routine implementation choice is not an ADR. Keep an unresolved business decision with Product through `/plan-work`. Challenge a material weakness with evidence and a concrete explanation. The developer may accept, rebut, or revise the proposal; revise the recommendation when the developer's evidence is stronger. Do not invent an objection just to satisfy this step — if nothing material turns up, briefly say what was checked and move on. Ask only questions that change scope, implementation, or validation; do not run a generic questionnaire or a fixed number of rounds.\n7. Decide the work breakdown. Prefer one coherent technical item when it is sufficient; this is a default, not a hard limit. Split only when justified by independently verifiable outcomes, distinct ownership or permissions, independent deployment or execution, an explicit prerequisite or dependency, or a size that genuinely prevents useful implementation as one item. A change that touches both the database and the frontend does not by itself require separate items. Do not create empty subtasks by convention. If this project has an applicable DevOps-task-split policy — for example a workspace rule that routes IAM, network, or other platform-owned work into a standalone DevOps task — respect it and explain the split in those terms; do not assume every project this skill runs in has that policy, and do not embed it here as a universal rule for every consumer of this plugin.\n8. Before independent review, finish the proposed technical items and check existing child and linked items scoped to this issue, so the proposal does not duplicate technical work already captured. This check covers a new item and an update to an existing one.\n9. Select fast, standard, or deep review from semantic risk, uncertainty, and blast radius — see [review-profiles.md](references/review-profiles.md). This selection governs only the independent `refinement-reviewer` delegation, never the challenge in step 6. Fast review may skip independent review; say why. Standard and deep review request an independent `refinement-reviewer` assessment through a supported host agent facility. Give it a bounded handoff: pass reason (first review after this analysis, or re-review of a material revision), proposal version, the delta since the previous review when this is a re-review, the original issue, the identified business source, approved business acceptance criteria, the proposed technical item(s), agreed decisions and material rejected alternatives, source references and baseline, and known uncertainty. Do not send the full conversation.\n10. If independent delegation is unavailable, disclose the limitation. Never present the main chat's own refinement as an independent review. A documented fast skip is complete. When standard or deep review cannot run, required review stays pending. Do not invent a policy exception. If no applicable project policy explicitly permits publishing without that review, keep publication pending. Drafting can continue.\n11. Consolidate only relevant reviewer findings with the developer; avoid an open-ended review loop. Resolve blocking findings before publication. If a finding changes approved business scope, provide a `/plan-work` handoff before changing the issue.\n12. Before publication, revalidate the recorded baseline — see [modes-and-drift.md](references/modes-and-drift.md). This applies when creating a new technical item and when updating an existing one. Re-read the business source and, when updating, the technical issue. Check the source files, contracts, and dependencies that supported a material decision. Do not rescan the whole repository because an unrelated file changed. A revision change is not by itself a material semantic change. If relevant evidence materially changed, explain the impact, revise the affected proposal, review that affected scope again, and get renewed approval when the authorized change set changed. Route a business-scope change to the Product Owner. If the relevant evidence cannot be re-read, do not claim freshness was verified, and keep the affected publication pending unless an applicable project policy explicitly permits proceeding with that uncertainty disclosed. Do not claim the Jira read and the later write are atomic, and do not invent an optimistic-locking API.\n13. If the proposal materially changes after review — scope, approach, affected contracts, work breakdown, or acceptance criteria — review that affected scope again before publication. A formatting-only change does not need a new review.\n14. Propose the Jira change set using [technical-task-template.md](references/technical-task-template.md) only when publication is allowed: blocking findings are resolved, and required review is complete, legitimately skipped under fast review, or covered by an explicit alternative the applicable project policy already permits. Developer approval of the payload does not waive required review. The change set is an update to the existing technical issue, a meaningful Subtask under an eligible parent (a Story, a Task, or a Bug — never an Epic), a linked Task or other issue type the target project supports, or more than one item only for a reason recorded in step 7. Never replace business acceptance criteria; the technical content supplements them.\n\n## Approval boundary\nFollow the shared [approval-contract.md](../../../references/approval-contract.md). An authorized developer may approve one complete, reviewable change set for work that stays inside the already-approved business scope — not a separate confirmation per field. That change set may include Jira mutations and repository ADR or context mutations. Before approval, show both mutation classes that apply: the Jira target, issue identifier, and fields or payload being changed; and, when an architecture record is in scope, the exact ADR destination path, the exact proposed ADR content or patch, and the exact context or navigation edits triggered by that persistence. One approval may authorize both Jira and repository mutations, but only when both mutation classes are explicitly included in the reviewed change set. Approval of a Jira payload alone does not implicitly authorize unlisted repository writes. If the user approves Jira changes and excludes the ADR, do not write the ADR. If the architecture decision is required to make the Jira refinement valid, surface that dependency rather than silently proceeding. Do not persist an ADR merely because this run inferred an architectural decision; show the proposed record in the same change set and persist it only after that exact content is approved. That approval does not waive required review. A change to business scope, expected behavior, or business acceptance criteria requires Product Owner approval through `/plan-work` before this skill writes it. Completing independent review, or an edit left in a Canvas, is not publication approval by itself. Do not create a PR or a mandatory technical-plan document.\n\nIf one mutation succeeds and the other fails, report partial completion. Inspect the actual current state. Do not pretend the whole operation failed atomically, and do not blindly retry both operations. Retry only the unresolved mutation after validating freshness or current state. Perform Jira read-back according to existing Jira mutation rules. Require the normal freshness checks before retrying a failed repository write. Do not attempt distributed rollback. Clearly report unresolved state to the user.\n\n## Output\nFollow [canvas review](../../../references/canvas-review.md) for the approval-ready proposal and again after the Jira read-back. Use the host Canvas capability when this host can open one. Otherwise show the same sections in chat and say Canvas is unavailable on this host. A short status with nothing new to show does not need a Canvas.\n\nReturn the analyzed baseline, the identified business source, scoped findings with file references, the challenge-and-response from step 6, review readiness, uncertainty, recommended test coverage, and the complete change set. For Jira, list items to create or update, their actual issue types, parent or link relationships, exact description and field changes, dependencies, and remaining blockers. For repository mutations in the same set, list the exact ADR destination and content and the related context or navigation edits. After an approved write, re-read the affected Jira records and repository files and confirm the actual issues, links, relevant fields, that the technical acceptance criteria were persisted in the acceptance-criteria field or in the approved description section, and that any authorized ADR or navigation write matches the approved set. If they were not, do not declare the handoff complete. If only one mutation class landed, report partial completion and leave the already-applied mutation in place. Do not claim transactional or idempotent behavior a tool does not document. Do not copy the ADR log into `AIDLC_CONTEXT.md`; keep that file as current-state navigation.\n\n## Reference loading\nThe links below are an allowlist. Do not open every file at the start of the run.\n\n- [modes-and-drift.md](references/modes-and-drift.md) when recording the baseline or revalidating before publication.\n- [review-profiles.md](references/review-profiles.md) when selecting fast, standard, or deep independent review.\n- [technical-task-template.md](references/technical-task-template.md) only when publication is allowed (step 14).\n- [canvas review](../../../references/canvas-review.md) when showing the approval-ready proposal or the post-write result.\n- [Jira integration](../../../references/jira-integration.md) when reading or preparing Jira.\n- [skill composition](../../../references/skill-composition.md) when dispatching the reviewer or handing off.\n- [criterion identifiers](../../../references/criterion-ids.md) when recovering or proposing criterion ids.\n- [work record](../../../references/work-record.md) when the publication record is in play.\n- [architecture decisions](../../../references/architecture-decisions.md) when a material architecture decision is in this change set.\n- [model evaluation](../../../references/model-evaluation.md) only when the change affects model or generative-system behavior.\n","inbound":[]},{"id":".cursor/skills/refine-story/references/modes-and-drift.md","kind":"reference","name":"Modes and drift","summary":"DEV/QA/combined scope and freshness before publication.","words":280,"chars":1924,"lines":15,"links":[],"headings":[{"text":"Modes and drift","line":1},{"text":"Before publication","line":5},{"text":"Before implementation","line":13}],"source":"# Modes and drift\n\nDevelopment refinement explains how current code behaves, the affected callers and contracts, compatibility risks, and dependencies. QA refinement describes evidence needed to prove each acceptance criterion, including failure paths.\n\n## Before publication\n\nRe-read the business source and, when the change updates an existing technical issue, that issue. Check the source files, contracts, and dependencies that supported a material refinement decision. This check covers creating a new technical item, not only updating an existing one. Reuse the baseline recorded at the start of the refinement. Do not rescan the entire repository because an unrelated file changed.\n\nA revision change, such as a new comment or a whitespace edit, is not by itself a material semantic change. If acceptance criteria, the business source, contracts, or the code behind a material decision actually changed, explain the impact and revise only the affected part of the proposal. Review that affected scope again before publication, and get renewed approval when the authorized change set changed. Route a change to business scope, expected behavior, or business acceptance criteria to the Product Owner through `/plan-work`.\n\nIf that evidence cannot be re-read, do not claim freshness was verified. Keep the affected publication pending unless an applicable project policy explicitly permits proceeding with the uncertainty disclosed. Do not claim the Jira read and the later write are atomic, and do not invent an optimistic-locking API.\n\n## Before implementation\n\nImmediately before implementation, re-read the business source and the technical item, and inspect the affected code, dependencies, and local modifications. If acceptance criteria, baseline, contracts, or relevant callers materially changed, stop and perform focused re-refinement. Record the new baseline rather than treating the old analysis as current.\n","inbound":[".cursor/skills/refine-story/SKILL.md"]},{"id":".cursor/skills/refine-story/references/review-profiles.md","kind":"reference","name":"Refinement review profiles","summary":"Fast/standard/deep refinement review based on semantic risk.","words":141,"chars":1056,"lines":11,"links":[],"headings":[{"text":"Refinement review profiles","line":1}],"source":"# Refinement review profiles\n\nUse **fast** review for isolated, reversible changes with clear acceptance criteria and known code paths. The main chat may skip independent refinement review. Say why. A documented fast skip is complete.\n\nUse **standard** review when behavior, contracts, regression coverage, or cross-component dependencies may change. Request an independent `refinement-reviewer` assessment.\n\nUse **deep** review for authentication, authorization, payments, data integrity, public contracts, migrations, infrastructure, sensitive data, or substantial uncertainty. Request independent review and identify policy concerns and required approvals. Dedicated governance integration is deferred.\n\nWhen standard or deep review cannot run, required review stays pending. That does not authorize publication, and the main chat's own refinement is not an independent review. Do not invent a policy exception.\n\nRisk comes from semantic impact, uncertainty, and blast radius. It does not come from file count, file extension, or document format alone.\n","inbound":[".cursor/skills/refine-story/SKILL.md"]},{"id":".cursor/skills/refine-story/references/technical-task-template.md","kind":"reference","name":"Technical implementation template","summary":"Implementation-ready technical item while preserving business AC.","words":842,"chars":5529,"lines":77,"links":["references/architecture-decisions.md","references/jira-integration.md"],"headings":[{"text":"Technical implementation template","line":1},{"text":"Technical acceptance criteria","line":50},{"text":"Business source and issue type","line":67},{"text":"QA-mode emphasis","line":75}],"source":"# Technical implementation template\n\nUse this template for the Jira technical item `refine-story` proposes or updates — a Task, a Subtask, or an updated existing technical issue. It supplements the business source's acceptance criteria; it does not replace them.\n\nOmit a section that has no real content for this change. Do not fill a section with generic boilerplate just to appear complete, and do not require every section for trivial work. Do not invent a file path, an API, an architecture decision, or a test command that was not actually read or run. A proposed architecture-decision update belongs in the same reviewable change set and is persisted only after approval, per [architecture-decisions.md](../../../../references/architecture-decisions.md). Leave an open question open rather than promising implementation will never need clarification.\n\nThe fenced block below is description content. When the approved destination is the writable acceptance-criteria field, technical acceptance criteria stay out of this block.\n\n```markdown\n#### 🎯 Objective\n[The technical outcome this item produces, and how it serves the business source's outcome.]\n\n#### 📌 Business source\n- Issue: [key and URL of the issue whose approved acceptance criteria this work implements, or \"standalone technical work — no business source\".]\n- Relationship: [how this item connects to that issue: Jira parent, or a named issue link such as \"implements PAY-123\". Not a dependency.]\n\n#### 📦 Scope\n- In scope: [what this item covers.]\n- Out of scope: [what it deliberately does not cover, and why — for example, routed to a separate item or a DevOps task.]\n\n#### 🔎 Verified current implementation\n[What the code actually does today, with file references. State only what was read, not what is assumed.]\n\n#### 🛠️ Proposed approach\n[The approach, and the reasoning behind the decisions that matter — including a material alternative that was considered and rejected, and why.]\n\n#### 🧩 Implementation details\n- [Affected component or area]: [what changes.]\n\n#### 🔗 Contracts, data, and compatibility\n[Public contracts, data shape changes, and backward-compatibility impact, when relevant to this item. Omit if nothing changes here.]\n\n#### 🚧 Dependencies\n- **Dependency:** [what this item needs, as a plain-language relationship — see [Jira integration](../../../../references/jira-integration.md), \"Dependencies as issue links,\" for how it becomes a real Jira link at publication. A dependency is not the business source.]\n\n#### 🧪 Validation strategy\n[Test scenarios, test data, and expected outcomes. Name unprotected existing behavior that needs characterization. For QA-mode refinement, cover positive, negative, boundary, regression, fixture, and environment needs explicitly.]\n\n#### 🔐 Security and operational considerations\n[Only when relevant to this item — permissions, data exposure, rollback, monitoring, or operational risk.]\n\n#### ❓ Open questions\n- **Blocking:** [cannot proceed without an answer.]\n- **Nonblocking:** [known uncertainty that does not stop implementation.]\n\n#### 📚 Source references\n[Files, contracts, and tests actually inspected, and the Git baseline used.]\n```\n\n## Technical acceptance criteria\n\nDiscover the issue type's acceptance-criteria field. Do not hardcode a custom field id.\n\n- Identified and writable: write the technical criteria only there. Do not also place them in the description.\n- Confirmed absent: offer to store them as a `Technical acceptance criteria` section in the description, inside the same approved payload. Do not leave them only in the chat.\n- Exists but not writable, incomplete metadata, or access error: do not treat the field as absent. Report the limitation and agree the destination inside the approved payload. Do not write to a field Jira will reject.\n- When neither location is approved, keep publication pending. Keep the criteria in the proposal. Do not declare the handoff complete.\n\nAfter the write, re-read the issue and confirm the criteria are stored in the field or in that description section. If they are not, say so and do not treat the handoff as complete.\n\n```markdown\n- [Observable, verifiable result. Supplements the business source's acceptance criteria; does not replace them.]\n```\n\nWhen identifiers are authorized, prefix technical criteria with `TAC-01` and keep them distinct from inherited business `AC-01`. Preserve existing ids. Do not renumber an existing ticket silently.\n\n## Business source and issue type\n\nThe business source is the issue whose approved acceptance criteria this work implements. The Jira parent is a separate fact. Do not treat every dependency link as the business source. If more than one linked issue could be the source, ask one focused question instead of picking one.\n\nA Subtask's parent is a Story, a Task, or a Bug. Do not parent a Subtask under an Epic. For work that starts from an Epic, create a Task linked to that Epic, or another issue type the site actually allows under an Epic. Approved standalone technical work records \"no business source\" rather than an invented parent.\n\nDiscover the target project's actual Jira hierarchy and let the approver the calling skill authorizes approve the exact issue type. Do not silently change a Task into a Subtask.\n\n## QA-mode emphasis\n\nWhen refining in `qa` mode, lead with scenarios, regressions, test layers, fixtures, environments, and the evidence each criterion needs. Create a separate QA item only when it is independently verifiable or owned on its own — not by convention.\n","inbound":[".cursor/skills/refine-story/SKILL.md","references/canvas-review.md"]},{"id":".cursor/skills/scaffold-project/SKILL.md","kind":"skill","name":"Scaffold project","summary":"Establish an approved minimal technical foundation for a new project. Use when the user asks to scaffold, bootstrap, or set up a new application project.","words":3791,"chars":27505,"lines":97,"links":["references/response-style.md",".cursor/skills/scaffold-project/references/product-purpose.md","references/project-onboarding.md",".cursor/skills/scaffold-project/references/foundation-and-review.md",".cursor/skills/sync-context/references/artifact-home.md","references/repository-preflight.md",".cursor/skills/sync-context/references/context-generation.md",".cursor/skills/sync-context/references/context-templates.md","references/architecture-decisions.md","agents/implementation-reviewer.md","references/skill-composition.md","agents/context-reviewer.md",".cursor/skills/sync-context/references/pull-request-template.md","references/canvas-review.md",".cursor/skills/sync-context/references/validation.md",".cursor/skills/sync-context/references/bugbot-configuration.md",".cursor/skills/sync-context/references/project-rules.md",".cursor/skills/sync-context/references/review-handoff.md"],"headings":[{"text":"Scaffold project","line":7},{"text":"Response shape","line":9},{"text":"Workflow","line":12},{"text":"Boundaries","line":48},{"text":"Output","line":76},{"text":"Reference loading","line":81}],"source":"---\nname: scaffold-project\ndescription: Establish an approved minimal technical foundation for a new project. Use when the user asks to scaffold, bootstrap, or set up a new application project.\ndisable-model-invocation: true\n---\n\n# Scaffold project\n\n## Response shape\nFollow the shared [compact response style](../../../references/response-style.md).\n\n## Workflow\n1. Inspect the requested destination, existing files, project configuration, and unrelated changes. Do not assume the current directory is the project root. Discover an existing Git root and remotes with local Git. Do not initialize Git, clone, or create a remote.\n2. Before identifying a stack, establish the product's purpose, its users or consumers, its primary interaction, and whether the request is a technical foundation, a navigable prototype, or a working business feature — see [product purpose and scaffolding boundary](references/product-purpose.md). Reuse facts already supplied in the request or confirmed references; ask only a small, focused batch when they are missing, and allow an explicit generic-starter choice instead of inventing a purpose. Identify the requested application type and technologies already decided. Ask only questions needed to define a minimal foundation. Read [project onboarding](../../../references/project-onboarding.md) only when project references are missing, ambiguous, or explicitly being reconsidered. This is an instruction for the current run, not a conditional loader. `parse_project_references`'s `\"invalid\"` status is also a gap, not a confirmed value — treat it the same as missing or ambiguous. `\"ok\"` only means the fields that are present passed syntax checks; do not treat a missing optional board or Figma reference as a reason to ask every onboarding question again. Include confirmed conventions in the proposal below. Do not start `sync-context` to repeat that step.\n3. Resolve the project's repository organization explicitly, as its own decision, before proposing a stack. If the explicit request, existing configuration that already applies to it, or context already confirmed earlier in this session does not already establish it, ask:\n\n   \"How would you like to organize this project?\n   - One application in one repository.\n   - A monorepo containing multiple components.\n   - Multiple related repositories.\"\n\n   Explain the three choices briefly, in plain language the user understands: one repository is simplest for one deployable unit; a monorepo keeps several components (for example a backend and a frontend) in one repository and one Git history; multiple repositories version and deploy each component independently. Recommend one option when the confirmed product needs make it clearly better, with a short reason. Do not assume that having a frontend, a backend, and infrastructure by itself requires separate repositories — a monorepo can hold all three.\n\n   If the user, the request, or confirmed context already selected an organization, reuse it, summarize it in the proposal, and do not ask again. A destination that happens to sit next to a sibling repository with a confirmed `Product` label, or that shares a directory-name prefix with one, is a discovery hint worth surfacing in that one focused question, never automatic membership on its own — an adjacent folder, a similar directory name, or an enclosing Git repository is not evidence of product membership by itself.\n\n   For a **monorepo**, establish its components and the directory each will live in before proposing files.\n\n   For **multiple repositories**, establish: the responsibility of each repository; which repositories already exist versus which project directories this run will actually scaffold; which components stay planned or deferred; and confirmed product membership plus any already-known remotes, using the existing identity and membership conventions in [foundation and review](references/foundation-and-review.md) and [artifact-home.md](../sync-context/references/artifact-home.md) — never inferred from location alone. Confirming product membership for a new, separate sibling repository never adopts that sibling's or any other repository's Git identity for this destination; only an explicit confirmation that this destination becomes a tracked module of the very repository found at its own enclosing Git root does that — see [foundation and review](references/foundation-and-review.md).\n\n   This skill scaffolds one destination safely per run. For a new multi-repository product, state that limit and propose a bounded sequence — one approved run per repository — rather than silently building a multi-repository orchestration pass. Creating a project directory is not creating a Git repository: do not claim a repository exists, or that Git tracks it, merely because this run created its folder and files. For a repository that does not exist yet, say which directories this run can scaffold now, and that the actual Git setup (`git init`, a remote, a hosted repository) stays a developer step this skill does not perform. See [repository organization and workspace](references/foundation-and-review.md#repository-organization-and-workspace) for the full detail.\n\n3a. Offer a local Cursor workspace as a decision separate from repository organization. For **multiple repositories**, explicitly ask:\n\n   \"Would you like a `.code-workspace` file to open these project folders together in Cursor locally?\"\n\n   If an existing `.code-workspace` already fits, propose reusing or updating it instead of creating a duplicate. For a **single application** or a **monorepo**, a workspace file is optional and normally unnecessary; do not require one. Follow the existing `.code-workspace` contract in [repository preflight](../../../references/repository-preflight.md): the exact file location and folder entries, portable relative paths, preserved JSONC comments and unrelated settings, and the creation or modification included in the approved change set. Distinguish a folder that already exists, a folder this run creates, and a folder that stays deferred — do not claim a deferred or not-yet-created folder is ready to open. Do not introduce a coordinator repository merely to hold the workspace file. This is a local IDE convenience; do not introduce a Cloud Agent environment or claim it controls cloud repository cloning.\n4. Classify the destination as a directory without a Git root, a Git repository without a remote, or a repository with an established identity. Establish separately whether a Git root exists, whether HEAD resolves to a commit, whether a canonical remote is established, and whether a repository ID is already persisted or explicitly assigned. Follow [foundation and review](references/foundation-and-review.md). Never fabricate a remote, a revision, or a claim that an identity was verified. Record a revision only when HEAD resolves; otherwise a Git working tree uses baseline `no-commit` and stays on Git file discovery. If the existing context format cannot represent a required value honestly, defer that artifact and say why. Do not invent a second context format, and do not initialize Git to satisfy context validation. `classify_repository_scope`'s `untracked-tree` kind — inside an enclosing Git root but not tracked there — reports that enclosing root as a fact only, never as this destination's own identity; only step 3's explicit confirmation that this destination is a module of that same repository — not merely a sibling repository confirmed as part of one product — adopts that repository's identity. See [foundation and review](references/foundation-and-review.md) for the full case breakdown.\n5. If an application already exists, propose a bounded addition or stop for clarification. A destructive overwrite and an approved edit are different. A narrowly scoped edit to an existing manifest, workspace file, index, or README is allowed when the proposal names that file and that edit. Preserve unrelated content and local changes. Stop when ownership or a conflicting edit is ambiguous. Preserving existing files does not forbid a legitimate monorepo update the proposal named.\n6. Present a short proposal before writing anything. Open the proposal with the confirmed purpose summary — purpose, users or consumers, primary interaction, what this scaffold enables, and what stays out of scope — before the technical detail, and for each major component say briefly whether it is user-selected, a verified constraint, or a recommendation that still needs approval; see [product purpose and scaffolding boundary](references/product-purpose.md). Follow that with the selected repository organization and why it fits, the components and their responsibilities, which repositories or directories already exist versus which this run will create, and whether a workspace will be reused, updated, created, or omitted. Then include destination, stack, assumptions that still need confirmation, repository structure, files to create, existing files to modify, a minimal entrypoint or representative smoke behavior, required configuration with safe example values, any install or generator command, how to start and validate the result, and which context files can be generated now. A library does not need an application server. A documentation-only foundation does not need an artificial build pipeline. Also name the initial context artifacts this scaffold will generate (a repository index and, for each created module, concise module context -- see [context-generation.md](../sync-context/references/context-generation.md) and [context-templates.md](../sync-context/references/context-templates.md), reused rather than reinvented here) and, when this scaffold is part of a multi-repository product, the planned `Product` label and `Related repository` entries (per [artifact-home.md](../sync-context/references/artifact-home.md)) and whether a local multi-root `.code-workspace` would help. Mark every component this proposal does not actually create as planned, not implemented or verified -- a proposal describing three repositories when only one is being scaffolded now must say so plainly, and the same separation applies to context: propose generating context only for what this run actually creates, never for a sibling or a not-yet-written component. When the approved foundation has a material architectural decision, include the exact record in this same proposal per [architecture-decisions.md](../../../references/architecture-decisions.md). Creating `aidlc-docs/architecture.md` is conditional. Recording a material approved decision is not optional. A pending decision stays in the proposal; do not mark it accepted. If persistence is not authorized or cannot be completed, report it as pending; do not claim the decision was recorded.\n7. Obtain approval for that exact proposal before writing. Approval of a prose project rule does not authorize dependency installation or execution of a project generator. If a generator initializes Git or performs another out-of-scope action, use a supported way to disable that action or propose a safe alternative. Do not run it blindly.\n8. Create only the approved foundation, including a `.code-workspace` file when approved -- preserve any existing one's unrelated settings, tasks, and comments (treat it as JSONC, not plain JSON) rather than overwriting it wholesale. Once, before applying the approved change set, recompute freshness for the proposal's source scope and read every destination, including a path expected not to exist. For a destination that does not exist yet, call `destination_freshness` and keep the `absent` result. Do not create the directory just to fingerprint it, and do not reuse an empty-directory fingerprint for an absent path. The absent value includes index and HEAD records for that destination only; a staged change somewhere else does not make it stale, and those records stay separate from `content_fingerprint`. For a destination that already exists, `content_fingerprint` is the file snapshot inside that freshness value. Call `proposal_is_current` with the fingerprint and destination text captured for the proposal and with the values just read. If it returns false, preserve the unexpected edit and ask again before any write. During application, do not compare the evolving source tree to that original fingerprint. This run's approved writes are expected. Before each write, compare only that destination with its expected state: the pre-run text if this run has not written it, or the last text this run wrote. A new path must still be absent; if it appeared, preserve it and do not overwrite it. If an unexpected edit appears after some writes, stop the affected work, report what was already applied and what remains pending, preserve the intervening edit, and do not claim the writes were atomic. Ask again only for the part of the proposal that changed. Then generate the repository index and module context from the actual resulting source, scoped to the files this run actually created -- one meaningful module context per real, approved module, never one per arbitrary directory. Reuse the existing context-generation conventions and size budget ([context-generation.md](../sync-context/references/context-generation.md)); do not invent a second context format for a scaffolded project. For each Git case, write only the context and metadata that case supports, as stated in [foundation and review](references/foundation-and-review.md). Do not launch `sync-context` from inside this skill to perform this generation; this skill writes the initial context directly, reusing the same references. Include a concise README with actual setup and validation instructions.\n9. Run the relevant available checks, including `validate_generated_context` on the index and module context this run wrote. Report each check as passed, failed, skipped, or unable to run, with the reason. Separate mechanically valid context, source-supported prose, and a check that was not executable. A passing validation check does not prove the prose. Do not launch `sync-context` to validate this context.\n10. Start a new independent `implementation-reviewer` delegation in scaffolding review mode. Use the host's real independent-delegation facility. Prefer the named plugin agent `implementation-reviewer`. If the host exposes only a general-purpose independent subagent, give it [implementation-reviewer.md](../../../agents/implementation-reviewer.md) as bounded task context and report that as general-purpose independent review, not native named-agent dispatch. Follow [skill composition](../../../references/skill-composition.md). Wait for that result, or a documented unavailable or pending outcome, before treating the scaffold as independently reviewed. Give the reviewer the confirmed purpose and the scaffolding boundary alongside its usual input — see [product purpose and scaffolding boundary](references/product-purpose.md). The main chat creates the scaffold; the reviewer is read-only and must inspect the generated files, not only this chat's summary. Skip this dispatch only for a trivial structural or documentation-only scaffold that created no runnable application, library, or generated executable config. Say why. That documented review skip is complete for that trivial case. A generated web app, API, infrastructure, or multi-component foundation is not that skip. When a required review cannot run, say independent review was not performed, do not label a self-review as independent, and leave that review pending. A paragraph in this chat claiming a review ran is not the review. The host must actually start a new independent agent. Static contract tests in this plugin do not prove that a reviewer agent was invoked. Resolve a concrete blocker inside the approved scope and rerun the affected checks. If that fix changes source evidence, refresh the affected context before reporting it as current. Scope expansion needs a new proposal and a new approval. Do not open an unbounded review loop, and do not write a review report into the consumer repository.\n11. Start a new independent `context-reviewer` delegation for the index and module context this run generated, per [independent context review](references/foundation-and-review.md#independent-context-review). Use the same dispatch rules as step 10, with [context-reviewer.md](../../../agents/context-reviewer.md). Wait for that result, or a documented unavailable or pending outcome. This is separate from step 10's `implementation-reviewer` assessment — it checks the generated context documents' own accuracy and completeness, not whether the scaffold runs. The documents under review are only those this run generated or changed. The reviewer may still read dependencies, consumers, and relevant configuration inside the authorized scope. Do not rescan an unrelated repository. When independent delegation is unavailable, say context review was not performed, do not label a self-review as independent, and report quality assurance for this run as partial. A trivial structural or documentation-only scaffold may skip step 10; it does not skip this step. Static contract tests in this plugin do not prove that a reviewer agent was invoked.\n12. When this run created or changed code, attempt the real supported Bugbot invocation in this chat without asking the user to request it again — see [scaffold Bugbot review](references/foundation-and-review.md#scaffold-bugbot-review). Use a supported host facility to run the official review-bugbot skill or the host `bugbot` subagent. If that facility is not available, ask the developer to run `/review-bugbot` and mark Bugbot pending. Never invent findings. Never claim it ran without a real result. Do not ask the reviewers to invoke Bugbot. Do not treat writing `BUGBOT.md`, or explaining that it is later guidance, as a substitute for attempting Bugbot. Independent scaffolding and context reviews are not Bugbot. Report them as not Bugbot, then still attempt the Bugbot run. Then evaluate repository review configuration — an initial Bugbot guidance file, any project-rule decision, and an optional pull-request template — per [repository review configuration](references/foundation-and-review.md#repository-review-configuration). Do this after steps 10 and 11, not before them: a review fix can still change the source a rule would be grounded in. This is its own change set, prepared after steps 8–11 already wrote and reviewed other files; immediately before writing an approved file here, recompute the fingerprint and re-read the destination instead of reusing the read from before steps 10–11 ran. This completes the same initial setup `sync-context` would otherwise be the only place to offer; the user should not need to run `sync-context` immediately after this skill merely to get it. Show the exact proposed path and content before writing. When there is nothing concrete yet to ground a rule in, say so and record `deferred`, distinct from an explicit `declined`; do not write an empty or generic file. A pull-request template follows [pull-request-template.md](../sync-context/references/pull-request-template.md): load that contract before deciding, proposing, or writing; discover the Git host from remote hostnames and any existing supported template first. Do not assume GitHub. Do not overwrite a customization. A declined or deferred result does not fail the scaffold. Report the Bugbot review of the generated code separately from the Bugbot guidance-file decision. Report each configuration decision with its own status, including an explicit `declined`. Static contract tests in this plugin do not prove that Bugbot was invoked.\n13. Close with [finalization order](references/foundation-and-review.md#finalization-order): after every write from steps 8 and 10–12 that could affect source or context, refresh the affected context once, then run `validate_generated_context` once more against the final files on disk. The stored `Fingerprint:` value is `content_fingerprint` of the declared scope, not `destination_freshness`. If that refresh changed semantic content (not only the fingerprint), run one targeted `context-reviewer` follow-up on the changed content before this step, per [independent context review](references/foundation-and-review.md#independent-context-review) — step 11's result stays valid only when the refresh was mechanical. Report that result, not step 9's earlier one, as this run's authoritative mechanical check. If it fails, report the failure; do not report the context as current and do not suggest `sync-context` as the routine way to finish this skill's own responsibilities.\n\n## Boundaries\nPreserve user files and changes. Follow existing project conventions when present.\nDo not implement business features; create Jira work; initialize or restructure Git;\ncommit, push, open a PR, merge, deploy, or provision infrastructure; generate\ncredentials or write secrets. Do not add authentication, databases, containers,\ncontinuous integration, or end-to-end testing unless the approved scope includes it.\nApproval of a prose project rule does not authorize dependency installation or\nCI changes. A missing Figma or Jira reference does not block a local scaffold.\nDo not fabricate a remote URL, a commit revision, or a claim that identity\nwas verified for a repository that has no Git root yet; a folder without a\nGit root is not yet a verified Git repository. An explicit repository ID the\nuser confirms for an unversioned tree or a repository without a remote is an\nassigned ID, not a verified remote identity. Evaluate each confirmed `Related repository` entry on its own. The entry\nneeds the referenced repository's real canonical remote, not this project's\nremote. Defer only the entry whose target remote cannot be established, name\nthat entry and why, and proceed with the rest of the approved scaffold\ninstead of inventing a value. Do not launch another `sync-context`\nsession from inside this skill; reuse [artifact-home.md](../sync-context/references/artifact-home.md)\nand [repository preflight](../../../references/repository-preflight.md)\ndirectly.\n\nWhen the requested outcome includes real business behavior beyond a technical foundation, explain that boundary and provide a `/plan-work` handoff instead of expanding this skill into backlog creation or feature implementation — see [product purpose and scaffolding boundary](references/product-purpose.md).\n\nEvaluating and offering Bugbot review guidance, a project-rule proposal, and an optional pull-request template, per [repository review configuration](references/foundation-and-review.md#repository-review-configuration), is in scope for this skill — it is not the authentication, database, or CI work the paragraph above excludes. Creating or changing any of those files still needs its own approval of the exact content and path; reuse an approval already given in this conversation for that exact proposal instead of asking again. Keep five things distinct: the initial repository index and module context are a required part of this skill's own result, per the existing prerequisites above; a Bugbot review of generated code is a real `/review-bugbot` or host `bugbot` run in this chat when this run created or changed code; `BUGBOT.md` is optional guidance and only proposed when real evidence supports a rule; a project rule is optional and only proposed for a durable, confirmed policy; a pull-request template is optional, host-specific, and never implied by GitHub. Writing `BUGBOT.md` only records review guidance for a human or an already-configured Bugbot integration to read later — it does not install or enable Bugbot, and it is not evidence that `/review-bugbot` ran. The code review in step 12 is that run. Writing a pull-request template does not authorize commit, push, pull-request creation, or merge.\n\nDo not claim a named slash command ran automatically. If a later context sync or\nvalidation would help, describe it honestly as a next step.\n\n## Output\nReturn the approved scope, files created, files modified, how to run the foundation, checks passed, failed, skipped, or unavailable from step 13's final validation run, implementation-review status and any unresolved finding, context-review status and any unresolved finding, Bugbot review of the generated code (passed, failed, pending, not-applicable, or unavailable), Bugbot review guidance status (created, unchanged, declined, or deferred) and why, project-rule status (created, unchanged, declined, not applicable, or deferred) and why, pull-request template status (created, unchanged, declined, not applicable, or deferred) and why, context artifacts generated or deferred and the missing prerequisite for each deferred artifact, and remaining prerequisites. Show this with [canvas review](../../../references/canvas-review.md): the host's Canvas when available, the same sections in chat otherwise. A working Canvas is never required to finish this skill.\n\nA generated file tree alone does not prove the foundation works. A successful build does not prove all runtime behavior works. Review completion does not replace executable validation.\n\n## Reference loading\nThe links below are an allowlist. Do not open every file at the start of the run.\n\n- [foundation and review](references/foundation-and-review.md) when classifying the destination, applying identity rules, running independent context review, attempting Bugbot, or closing through finalization.\n- [product purpose and scaffolding boundary](references/product-purpose.md) before choosing a stack, when writing the proposal, and when handing that purpose to the scaffolding reviewer.\n- [repository preflight](../../../references/repository-preflight.md) for Git classification, authorization, preservation, and an approved `.code-workspace` write.\n- [artifact-home.md](../sync-context/references/artifact-home.md) when confirming `Product` or `Related repository` membership.\n- [context-generation.md](../sync-context/references/context-generation.md) and [context-templates.md](../sync-context/references/context-templates.md) when proposing or writing the initial repository index and module context.\n- [validation.md](../sync-context/references/validation.md) when running `validate_generated_context`.\n- [bugbot-configuration.md](../sync-context/references/bugbot-configuration.md) and [project-rules.md](../sync-context/references/project-rules.md) during step 12 repository review configuration.\n- [pull-request-template.md](../sync-context/references/pull-request-template.md) before deciding, proposing, or writing a pull-request template.\n- [review-handoff.md](../sync-context/references/review-handoff.md) when dispatching `context-reviewer` in step 11.\n- [canvas review](../../../references/canvas-review.md) when closing with the review view.\n- [skill composition](../../../references/skill-composition.md) when dispatching a reviewer or naming another skill.\n- [architecture-decisions.md](../../../references/architecture-decisions.md) when a material, explicitly approved decision must persist after the same proposal approval.\n\nCreating the file is conditional. Recording a material approved decision is not optional. The context-discovery write list does not apply to approved scaffold files, except that the `.code-workspace` write still follows the bounded conditions in [repository preflight](../../../references/repository-preflight.md).\n","inbound":[]},{"id":".cursor/skills/scaffold-project/references/foundation-and-review.md","kind":"reference","name":"Foundation, identity, and review","summary":"Scaffold identity, writes, reviews, optional configuration and final context refresh.","words":5015,"chars":34120,"lines":171,"links":["references/architecture-decisions.md","references/repository-preflight.md",".cursor/skills/sync-context/references/context-generation.md",".cursor/skills/sync-context/references/validation.md",".cursor/skills/sync-context/references/context-templates.md",".cursor/skills/sync-context/references/bugbot-configuration.md",".cursor/skills/sync-context/references/project-rules.md",".cursor/skills/sync-context/references/pull-request-template.md",".cursor/skills/sync-context/references/review-handoff.md","references/skill-composition.md",".cursor/skills/scaffold-project/references/product-purpose.md","references/canvas-review.md"],"headings":[{"text":"Foundation, identity, and review","line":1},{"text":"Usable foundation","line":5},{"text":"Repository organization and workspace","line":25},{"text":"Git identity","line":37},{"text":"Related repository entries","line":57},{"text":"Bounded edits","line":65},{"text":"Context validation","line":77},{"text":"Repository review configuration","line":91},{"text":"Scaffold Bugbot review","line":111},{"text":"Independent context review","line":121},{"text":"Proportionate review","line":131},{"text":"Finalization order","line":151}],"source":"# Foundation, identity, and review\n\nUse this from `scaffold-project`. It does not add a second context format or a second validator.\n\n## Usable foundation\n\nThe proposal shown before approval names, for this project type:\n\n- destination, and whether the result is a single repository, a monorepo, or a new repository beside others;\n- the chosen stack, and any assumption that still needs confirmation;\n- files to create, and existing files to modify;\n- a minimal entrypoint or one representative smoke behavior;\n- required configuration, with safe example values only;\n- a dependency install or generator command, when the approved scope needs one;\n- how to start the result and how to validate it;\n- which context files can be generated in this run, and which stay deferred;\n- material architecture decisions to record, when the approved foundation actually has one — see [architecture-decisions.md](../../../../references/architecture-decisions.md). Persist each such decision in the authoritative record; do not leave it only in chat. Creating the file is conditional. Recording a material approved decision is not optional. Include each new entry's binding clause in this same proposal, and the minimum index and module navigation links in that same approved change set. Create `aidlc-docs/architecture.md` only when the first such decision needs a record and no authoritative ADR location already exists. Otherwise reuse the existing location. Do not create an empty or duplicate record. Do not invent an ADR for a routine file or library choice. A pending decision stays in the proposal; do not mark it accepted. If persistence is not authorized or cannot be completed, report it as pending; do not claim the decision was recorded. If the record is written and the required link cannot be updated, report partial completion. Do not start `/sync-context` to finish that handoff.\n\nAdapt the list to the project. A library does not need an application server. A documentation-only foundation does not need an artificial build pipeline. Omit a line that does not apply, and say why.\n\nDo not add authentication, databases, containers, continuous integration, deployment, business features, or end-to-end tooling unless that item is in the approved scope.\n\nApproval of a prose project rule does not authorize dependency installation or execution of a project generator. If a generator initializes Git or does anything else outside the approved scope, use a supported way to disable that action, or propose a safe alternative. Do not run it blindly.\n\n## Repository organization and workspace\n\nResolve organization (single repository, monorepo, or multiple related repositories) and the optional local workspace as two separate decisions, per `SKILL.md` steps 3 and 3a. Neither decision infers membership from an adjacent folder, a similar directory name, or an enclosing Git repository.\n\nA recommendation is about the confirmed product's needs, not the presence of multiple technical layers. A product with a frontend, a backend, and infrastructure still fits comfortably in one monorepo; recommend separate repositories only when a confirmed need actually calls for independent versioning, independent deployment, or a separate team boundary — state that reason plainly.\n\nFor a confirmed multi-repository product, track three distinct sets so the proposal never conflates them: repositories that already exist (with their own identity, resolved per [Git identity](#git-identity) below), project directories this run will actually create, and components that stay planned or deferred because this run does not scaffold them. A proposal describing three repositories when only one is being scaffolded now must say so plainly — the same separation [the usable foundation](#usable-foundation) and `## Related repository entries` already require for context generation and sibling references.\n\nThis skill scaffolds one destination per run. A new multi-repository product needs one approved run per repository; state that limit instead of writing files across several repository roots in one pass. Creating a project directory, including one later confirmed to be a monorepo module or a sibling repository's folder, is never itself proof that a Git repository exists there — `classify_repository_scope` still reports `unversioned` or `untracked-tree` for that folder until a real `.git` root is discovered or that destination is explicitly confirmed as a module of one. Say explicitly that Git setup (`git init`, a remote, a hosted repository) is a developer step this skill does not perform, for every repository this run did not already find with a Git root.\n\nFor the optional workspace, reuse the exact JSONC, path, and bounded-write rules already defined in [repository preflight](../../../../references/repository-preflight.md) under \"`.code-workspace` writes\" — this section does not restate them. A workspace is a local Cursor convenience; it never substitutes for the repository-organization decision, and recommending one is never a reason to skip asking the organization question first.\n\n## Git identity\n\nClassify the destination with [repository preflight](../../../../references/repository-preflight.md), then establish these four facts separately with read-only Git. Never fabricate a remote, a revision, or a claim that an identity was verified. Never run `git init`, create a commit, or invent a SHA to make validation pass. A missing commit does not block the approved scaffold.\n\n1. **Git root.** `git rev-parse --show-toplevel` succeeds. If it fails and a `.git` marker exists at or above the destination, the repository is broken or inaccessible. Report that error. Do not record `unversioned` or `no-commit`, and do not treat it as a directory without Git. `classify_repository_scope` returns `unversioned` whenever toplevel fails, including this broken case, so do not use that one label by itself. A successful toplevel only reports the nearest enclosing Git root; it does not by itself make the destination part of that repository (see fact 1a).\n1a. **Ownership, not just presence.** `classify_repository_scope` reports one of four kinds for the destination: `unversioned` (no `.git` marker anywhere above it), `git-root` (the destination is the toplevel itself), `nested-tracked` (inside a Git root, and Git already tracks it there), or `untracked-tree` (inside a Git root, but Git does not track it there — `git_root` is `None`, and the enclosing root is recorded only as `enclosing_git_root`, a fact, not an identity). Do not treat `enclosing_git_root` as this destination's own Git root unless step 3's membership confirmation — never inferred from location alone — says this destination is a module of that same repository, not merely a sibling repository confirmed as part of one product. Confirming product membership for a separate sibling repository never adopts any repository's Git identity for this destination; it only governs `Related repository` entries below.\n2. **HEAD commit.** Only when a Git root exists, run `git rev-parse --verify HEAD`. Record that revision only when it resolves. An expected unborn HEAD fails with \"Needed a single revision\" or \"unknown revision\" while toplevel still succeeds. That baseline is `no-commit`, in the existing Baseline field. Any other Git error is not an empty repository; report it and do not disguise it as `no-commit`.\n3. **Canonical remote.** Read the configured remote and normalize it with `normalize_remote`. Write `Canonical remote` only when that succeeds on an actual remote. A configured remote does not mean a commit exists.\n4. **Repository ID.** Reuse a persisted ID. Do not ask for a new one merely because no remote exists. If none is persisted and no verified remote can derive one, ask once and assign an explicit ID with `stable_repository_id`. Say that this ID was assigned, not verified from a remote.\n\n**Directory without a Git root (`unversioned` kind, no enclosing root).** No `.git` marker exists anywhere above the destination, and toplevel fails outright. This is an unversioned tree. The baseline is `unversioned`. `content_fingerprint` applies this tree's own `.gitignore` through a temporary Git check that is not created inside the destination. If that check cannot run, freshness is unresolved. Do not record a commit SHA. Omit this project's `Canonical remote`. The repository ID follows fact 4. The index and module context may still be written when the artifact home is explicit and writable.\n\n**Untracked tree inside an enclosing Git root (`untracked-tree` kind).** This is the common case for a brand-new, standalone project created inside an existing checkout — for example a sibling folder next to other repositories. Unless step 3 already confirmed this destination is a module of that same enclosing repository — distinct from confirming it is a sibling repository in the same product, which never adopts that repository's identity — give it the same identity as **Directory without a Git root**: baseline `unversioned`, no inherited revision, no inherited remote, no inherited repository ID. The scope kind `untracked-tree` is not the kind `unversioned`. The baseline token is `unversioned` only because this destination has no commit of its own. `content_fingerprint` does not use the enclosing repository's exclude rules for this kind. It lists the destination's files without that checkout's `.gitignore`, and it still drops generated context, caches, nested repositories, symlink escapes, secrets, and files excluded by an ignore rule inside the destination. Listing files this way does not grant this destination the enclosing repository's identity. An enclosing rule such as `new-project/` must not hide source or make a later edit look fresh. Git applies ignore rules that live inside the destination, including a bare directory name, negation, and nested rules, and drops ignored paths before reading file contents. A genuinely empty destination still has an empty fingerprint. A destination that does not exist yet is `absent` from `destination_freshness`, which is not the empty-directory fingerprint; do not create the directory merely to hash it. That absent value also includes index and HEAD records scoped to the destination. Those records are tracking metadata, not the working-tree content fingerprint. A staged or committed change outside the destination does not change them. If Git cannot apply the in-scope rules, report freshness as unresolved. Never run `git init`, stage files, or otherwise modify the enclosing repository to force a different classification. Confirming monorepo membership changes the recorded identity, not this discovery rule. Enclosing exclude rules apply again only once Git tracks the path (`nested-tracked`).\n\n**Confirmed new module of an existing monorepo.** When step 3's explicit confirmation — never inferred from location alone, and distinct from confirming only product membership for a sibling repository — says this destination is a new module of the same repository found at `enclosing_git_root`, that repository's own identity governs: its persisted repository ID, its real `HEAD` revision when one resolves, and its real canonical remote. Allowed writes are the approved files inside that module plus any explicitly named shared file in the approved proposal, such as a root manifest, workspace file, index, or README, and only the edit that proposal describes. Membership in the monorepo does not authorize an arbitrary edit at the repository root. Preserve unrelated content and local changes. Do not restage the repository or touch a file the proposal did not name.\n\n**Git repository without a remote (`git-root` kind, no canonical remote).** A Git root exists and no canonical remote normalizes. Do not invent a remote. Omit `Canonical remote`. The fingerprint uses Git file discovery, not the unversioned walk, including when there are no commits. Do not classify that working tree as a directory without Git. If HEAD resolves, the baseline is that revision. If HEAD is an expected unborn HEAD, the baseline is `no-commit`. The repository ID follows fact 4.\n\n**Established identity (`git-root` kind, with a remote or a persisted ID).** A canonical remote normalizes, or a persisted repository ID already exists. Keep that persisted ID. Derive an ID from the remote with `stable_repository_id` and `normalize_remote` only when no ID is persisted yet. The same HEAD rule applies here: a configured remote does not guarantee a commit. Record the revision only when HEAD resolves; otherwise record `no-commit`. The fingerprint stays Git-based.\n\n## Related repository entries\n\nEvaluate each proposed `Related repository` entry on its own. The entry stores the referenced repository's canonical remote, not this project's remote. This project's missing Git root or missing remote does not defer that entry.\n\nExample: `payments-web` is being scaffolded and has no remote yet. Its product membership is already confirmed. `payments-api` already has the verified remote `github.com/example/payments-api`. Record the outgoing reference from `payments-web` to `payments-api` using that remote. Do not write the reverse reference into `payments-api` unless that sibling checkout is authorized for this write. Do not invent a reciprocal entry.\n\nRequire the referenced repository's real canonical remote, normalized the same way as any other remote. Adjacency or a similar directory name does not establish membership. Defer only the entry whose target remote cannot be established, name that entry, and say why. Keep every entry whose target remote is real. Do not create another membership format.\n\n## Bounded edits\n\nA destructive overwrite and an approved edit are different. An approved addition may edit an existing manifest, workspace file, index, or README when the proposal names that file and that edit. Preserve unrelated content and local changes. Stop and clarify when ownership or a conflicting edit
