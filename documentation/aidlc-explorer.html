tructure checks","Exact approved Jira payload, then verified issue keys/links"],"states":["Drafted","Ready for review","Independent review","Reviewed / blocked","Local plan approved","Exact write approved","Persisted + read back"],"agents":[["product-reviewer","At the end of a PO drafting round, even with open questions. Delta-only re-review after material revisions."]],"reads":["Route to Epic, Story, Task, Sprint or update model.","Read enough context for product claims, not implementation design by default.","Jira template applies at payload preparation; footer currently includes it in the reading list."],"writes":"Dry-run first. Local-plan approval and exact Jira-mutation approval are distinct. No Story mirror in the repository.","gotcha":"Reviewed does not mean ready to implement, approved, or published. A renderer must not invent requirements.","example":"/plan-work Help me define shopper registration, sign-in and password recovery. Ask product questions, challenge gaps, and prepare a draft before any Jira write.","source":".cursor/skills/plan-work/SKILL.md","words":2471,"chars":17093,"links":["references/response-style.md","references/context-retrieval.md","references/jira-integration.md",".cursor/skills/plan-work/references/jira-story-template.md",".cursor/skills/plan-work/references/single-story.md","references/architecture-decisions.md",".cursor/skills/plan-work/references/epic-discovery.md",".cursor/skills/sync-context/references/validation.md",".cursor/skills/plan-work/references/product-review.md","references/approval-contract.md","references/canvas-review.md","references/skill-composition.md","references/work-record.md","references/criterion-ids.md","references/model-evaluation.md"],"refWords":13650,"sourceHash":"e453d6cbc586"},{"id":"refine-story","group":"Engineering","title":"Make implementation actionable","summary":"Translate approved scope into technical DEV, QA or combined work without changing business criteria.","inputs":["Jira key/URL or approved standalone technical draft","Development, QA or combined mode","Current code, contracts, tests, business source and decisions"],"outputs":["Technical implementation/QA items and justified split","Challenge, evidence, test needs and review outcome","Exact Jira + approved ADR/navigation change set"],"states":["Recover approved scope","Inspect source","Discuss + challenge","Choose breakdown","Risk-based review","Revalidate baseline","Approve exact mutations","Persist + read back"],"agents":[["refinement-reviewer","Fast may skip with reason. Standard/deep require independent review."]],"reads":["Relevant parent, children, links and business source—not all project comments.","Mode, risk profile, technical task format and applicable architecture clauses.","Before publication: current sources and relevant Jira state again."],"writes":"Authorized developer approves technical scope. Business changes go to the PO. Accepted material ADRs are recorded with exact authorized content.","gotcha":"DEV and QA are different deliverables. Touching backend and frontend alone is not sufficient reason to split.","example":"/refine-story Refine these three approved auth Stories in QA mode. Cover positive, negative, boundary and regression scenarios; show the proposed items before publishing.","source":".cursor/skills/refine-story/SKILL.md","words":2424,"chars":17129,"links":["references/response-style.md","references/context-retrieval.md","references/jira-integration.md","references/criterion-ids.md","references/verification-evidence.md","references/architecture-decisions.md",".cursor/skills/refine-story/references/review-profiles.md",".cursor/skills/refine-story/references/modes-and-drift.md",".cursor/skills/refine-story/references/technical-task-template.md","references/approval-contract.md","references/canvas-review.md","references/skill-composition.md","references/work-record.md","references/model-evaluation.md"],"refWords":9946,"sourceHash":"344afd2826b0"},{"id":"implement-change","group":"Engineering","title":"Build within approved scope","summary":"Implement a scoped item with current evidence, characterization, focused tests and regression checks.","inputs":["Approved Story/Task/Subtask or defect reproduction","Authorized repository and functional scope","Applicable ADR clauses, requirements snapshot and current local changes"],"outputs":["Scoped source/test/config changes","Baseline and after-change evidence with mock boundaries","Implementation handoff or authorized continuation to validation"],"states":["Preflight + snapshot","Baseline tests","Approach","Conditional approach review","Implement + regression","Compare requirements","Handoff / continue"],"agents":[["implementation-reviewer","Before code only when a material new decision or uncertainty changes the reviewed approach."],["implementer","Optional bounded delegation when separate context or parallel work is useful."]],"reads":["Current source, approved business + technical criteria and dependencies.","Verification contract, requirement snapshot and applicable ADR clauses.","E2E environment only if modifying/running existing E2E coverage."],"writes":"Authorized local code, tests and setup documentation. No automatic Jira, commit, push, PR, apply or deploy.","gotcha":"Implementation completion is not delivery-ready validation. A named QA item is not included by implication.","example":"/implement-change Implement this approved DEV subtask and continue into /validate-change. Work locally; no deploy, Jira write, commit or push.","source":".cursor/skills/implement-change/SKILL.md","words":1713,"chars":12647,"links":["references/response-style.md","references/context-retrieval.md","references/architecture-decisions.md","references/requirement-snapshot.md","references/verification-evidence.md","references/e2e-environment.md",".cursor/skills/implement-change/references/risk-and-specialists.md",".cursor/skills/validate-change/SKILL.md","references/repository-preflight.md","references/jira-integration.md","references/skill-composition.md","references/work-record.md","references/criterion-ids.md","references/model-evaluation.md"],"refWords":11679,"sourceHash":"bc07f8db679f"},{"id":"validate-change","group":"Assurance","title":"Challenge the evidence","summary":"Coordinate a fresh independent validator, Bugbot and an honest, mechanically checked close-out.","inputs":["Authorized change and complete requirements baseline","Current diff including relevant untracked files","Commands, environment limits and prior evidence as claims"],"outputs":["Criterion → evidence map, including approved NFR constraints","Regression results, gaps and Bugbot status tied to code state","Coherent delivery-readiness result and optional Jira-comment proposal"],"states":["Preflight + compare","Fresh validator","Bugbot coordination","Classify evidence","Scoped fix if authorized","Fresh delta validation","Closeout helper","Report readiness"],"agents":[["validator","New independent delegation every invocation, and a new delta delegation after fixes. Read-only."]],"reads":["Current criteria, source and binding clauses; do not trust an implementer summary.","Prior matrix + changed scope; preserve standing evidence after a delta pass.","Only relevant checks, not an automatic whole-suite replay."],"writes":"Targeted in-scope fixes unless review-only. Independent validator cannot edit sources/requirements. External publication remains separate.","gotcha":"closeout-validate checks declared coherence; it cannot prove a reviewer or test actually ran.","example":"/validate-change Review this local change against its approved Jira criteria. No code edits; report independent evidence, Bugbot and remaining blockers separately.","source":".cursor/skills/validate-change/SKILL.md","words":1821,"chars":13430,"links":["references/response-style.md","references/context-retrieval.md","agents/validator.md","references/skill-composition.md","references/repository-preflight.md","references/requirement-snapshot.md","references/architecture-decisions.md",".cursor/skills/validate-change/references/evidence-and-bugbot.md","references/verification-evidence.md","references/work-record.md","references/approval-contract.md","references/criterion-ids.md","references/e2e-environment.md","references/model-evaluation.md"],"refWords":9647,"sourceHash":"96447d0f9828"},{"id":"create-e2e-tests","group":"Assurance","title":"Exercise observable journeys","summary":"Create end-to-end coverage for real implemented flows with an explicitly classified environment.","inputs":["Approved journeys and available UI/API implementation","Existing test runner, selectors and test data","Authorized environment and setup scope"],"outputs":["E2E specs and necessary approved runner configuration","Execution evidence or precise blocked/skipped reasons","Clear real vs simulated backend boundaries"],"states":["Discover runner + app","Classify environment","Map journeys","Approve necessary setup","Write tests","Run if authorized","Report limits"],"agents":[],"reads":["Relevant app, tests and existing runner configuration.","Shared E2E environment contract and repository preflight.","No invented screens or selectors for unimplemented behavior."],"writes":"Approved specs and necessary setup. No automatic deployment or remote mutation; install/start/run are distinct actions.","gotcha":"A browser test with a stubbed API is frontend E2E evidence, not deployed AWS integration. Creating a spec is not a pass.","example":"/create-e2e-tests Cover sign-in and password recovery for the implemented UI. Reuse the runner and report clearly what is simulated; no deployment.","source":".cursor/skills/create-e2e-tests/SKILL.md","words":665,"chars":4517,"links":["references/response-style.md","references/context-retrieval.md","references/repository-preflight.md","references/e2e-environment.md","references/skill-composition.md"],"refWords":3584,"sourceHash":"a358c3bcf807"}],"nodes":[{"id":".cursor-plugin/plugin.json","kind":"package","name":"plugin","summary":"plugin","words":34,"chars":386,"lines":14,"links":[],"headings":[],"source":"{\n  \"name\": \"simplified-ai-dlc-lifecycle\",\n  \"version\": \"0.16.0\",\n  \"description\": \"A compact AI-DLC lifecycle for context, planning, scaffolding, refinement, implementation, validation, and end-to-end tests.\",\n  \"keywords\": [\n    \"ai-dlc\",\n    \"planning\",\n    \"software-delivery\",\n    \"project-scaffolding\"\n  ],\n  \"skills\": \".cursor/skills\",\n  \"agents\": \"agents\",\n  \"rules\": \"rules\"\n}\n","inbound":[]},{"id":".cursor/skills/create-e2e-tests/SKILL.md","kind":"skill","name":"Create end-to-end tests","summary":"Create or update end-to-end tests for a story, acceptance criteria, or user journey. Use when the user asks for browser or end-to-end coverage. Optional and independently invocable.","words":665,"chars":4517,"lines":43,"links":["references/response-style.md","references/context-retrieval.md","references/repository-preflight.md","references/e2e-environment.md","references/skill-composition.md"],"headings":[{"text":"Create end-to-end tests","line":7},{"text":"Response shape","line":9},{"text":"Context retrieval","line":12},{"text":"Inputs","line":15},{"text":"Workflow","line":18},{"text":"Boundaries","line":28},{"text":"Output","line":35},{"text":"Reference loading","line":38}],"source":"---\nname: create-e2e-tests\ndescription: Create or update end-to-end tests for a story, acceptance criteria, or user journey. Use when the user asks for browser or end-to-end coverage. Optional and independently invocable.\ndisable-model-invocation: true\n---\n\n# Create end-to-end tests\n\n## Response shape\nFollow the shared [compact response style](../../../references/response-style.md).\n\n## Context retrieval\nUse [context retrieval](../../../references/context-retrieval.md). Read the selected module context, then the current end-to-end tests, fixtures, and runner config before adding coverage.\n\n## Inputs\nAccept a Story, acceptance criteria, a user journey, or a scoped natural-language request. Ask a focused question only when the behavior or the journey boundary is still unclear.\n\n## Workflow\n1. Run [repository preflight](../../../references/repository-preflight.md). Confirm the working directory, Git root, and unrelated changes to preserve. Do not inspect a repository that is not in the authorized scope merely because it sits nearby.\n2. Discover the environment before assuming one. Follow [end-to-end environment](../../../references/e2e-environment.md). Inspect existing tests, the runner and its config, start/build/test scripts, README and development docs, fixtures and authentication helpers, secret-free env examples, CI, and Docker or Compose when they exist. Do not print or persist secrets.\n3. Classify the run: a locally executable application, an application already deployed to a confirmed Dev or QA target, a local UI with a simulated backend, or coverage that can be authored but cannot currently execute. A configuration file does not prove the environment works and does not authorize remote execution. Ask only for an unresolved choice that materially affects the work.\n4. Reuse the existing framework. When none exists, propose the smallest setup that matches the repository and stop for approval before adding it. Playwright is a candidate for a web UI, not a universal requirement. Do not force browser tests onto a service with no UI.\n5. Add or update only the tests and files that the requested journey needs. This skill owns new journeys, a first suite, and framework setup. Do not invent selectors, routes, or UI behavior that does not exist. Do not embed credentials or secrets. Keep auth state and sensitive artifacts out of Git. Do not rewrite unrelated tests.\n6. Keep authoring distinct from installing dependencies or browsers, starting services, and running tests. For remote execution, confirm the authorized target, test data, expected effects, and cleanup first. Having a URL or credentials does not authorize mutations. Do not run against production by default.\n7. Run the applicable tests when scope and environment allow. Report the command and result. Identify simulated-backend tests as such. Creating a test is not the same as a successful execution. Proposed coverage is not an executable suite.\n8. When a run is not possible, say exactly what could not run and why, and which checks were still possible.\n\n## Boundaries\nThis skill is optional. It is not a mandatory lifecycle stage, and no other skill invokes it automatically. `implement-change` may update an existing end-to-end spec for authorized behavior; that does not start this skill. `validate-change` may run end-to-end tests that already exist. It does not run this skill. Naming this skill does not execute it.\n\nReuse Docker or Compose only when it already exists and is relevant. A test-runner container is not the application stack. Propose a new container only for a concrete need inside the approved scope. Do not install Docker or introduce a cloud emulator by default.\n\nDo not commit, push, open a pull request, merge, or deploy. Do not invent a passing result. Do not add a new agent or command wrapper.\n\n## Output\nReturn the environment class, journeys covered, files added or updated, the command that ran or the reason it did not, whether a simulated backend was used, any setup still waiting for approval, and remaining execution requirements.\n\n## Reference loading\nThe links below are an allowlist. Do not open every file at the start of the run.\n\n- [repository preflight](../../../references/repository-preflight.md) at the start of the run.\n- [end-to-end environment](../../../references/e2e-environment.md) when discovering or classifying the environment, and before a remote run.\n- [skill composition](../../../references/skill-composition.md) when handing off or naming another skill.\n","inbound":[]},{"id":".cursor/skills/implement-change/SKILL.md","kind":"skill","name":"Implement change","summary":"Implement an approved application, frontend, backend, infrastructure, or integration change with scoped analysis and baseline revalidation. May update existing end-to-end tests when the authorized behavior requires it.","words":1713,"chars":12647,"lines":66,"links":["references/response-style.md","references/context-retrieval.md","references/architecture-decisions.md","references/requirement-snapshot.md","references/verification-evidence.md","references/e2e-environment.md",".cursor/skills/implement-change/references/risk-and-specialists.md",".cursor/skills/validate-change/SKILL.md","references/repository-preflight.md","references/jira-integration.md","references/skill-composition.md","references/work-record.md","references/criterion-ids.md","references/model-evaluation.md"],"headings":[{"text":"Implement change","line":7},{"text":"Response shape","line":9},{"text":"Context retrieval","line":12},{"text":"Prerequisites","line":15},{"text":"Input and scope","line":18},{"text":"Workflow","line":27},{"text":"Defect mode","line":38},{"text":"Boundaries","line":48},{"text":"Output","line":51},{"text":"Reference loading","line":54}],"source":"---\nname: implement-change\ndescription: Implement an approved application, frontend, backend, infrastructure, or integration change with scoped analysis and baseline revalidation. May update existing end-to-end tests when the authorized behavior requires it.\ndisable-model-invocation: true\n---\n\n# Implement change\n\n## Response shape\nFollow the shared [compact response style](../../../references/response-style.md).\n\n## Context retrieval\nUse [context retrieval](../../../references/context-retrieval.md). Read selected module context, then current source, tests, and contracts before editing or delegating.\n\n## Prerequisites\nRequire approved scope and acceptance criteria. Run repository preflight, then read the Story, or the refined technical Task or Subtask, through Jira MCP when available. When the input is a technical item, read its identified business source and that source's acceptance criteria. The Jira parent is not assumed to be that source: a Task may sit under an Epic while the business source is a linked Story. A Subtask's parent is the Story, Task, or Bug it sits under. Do not treat every dependency link as the business source, and the technical item supplements them, it does not replace them. Read the technical acceptance criteria from the issue's acceptance-criteria field, or from the description section named Technical acceptance criteria when that is where they were stored. Recover approved constraints even when they sit outside that heading; keep each source. Recover applicable accepted architecture decisions into that same `constraints` list — see [architecture-decisions.md](../../../references/architecture-decisions.md). Extract with `--repository-id` and `--root` set to the owning repository. Copy each binding clause exactly. Qualify each decision id with the persisted repository ID. If that source cannot be read, is unsupported, or its navigation link is missing, set `source_complete` to `false`. Do not treat a material deviation as an accepted decision. Also read relevant dependencies. Capture a [requirement snapshot](../../../references/requirement-snapshot.md) at the start. Revalidate the item against affected code, contracts, dependencies, and local modifications immediately before edits. Compare the snapshot again before close-out. If the business source, a dependency, or the baseline materially changed since refinement, or if material drift needs refinement, provide the user with a `/refine-story` handoff; do not claim it ran automatically. Do not declare the implementation current against outdated requirements.\n\n## Input and scope\nAccept a Jira key or URL, plus the repository to change. Resolve the authorized functional scope from the user's instruction and the items that already exist. Do not implement an Epic by implication.\n\nIf the instruction already names the items — for example every development Subtask under a Story — do not ask again. Identify development work versus QA work from each item's approved deliverable and its own content. Use the issue type or a label when one exists and agrees with that content. Do not depend on refine-story mode metadata that may not be persisted on the issue. Ask only when development work and QA work cannot be distinguished.\n\nA QA item is not included in an implementation run unless the instruction names it. When the named item is QA work, distinguish unit or integration tests (this skill) from new end-to-end authorship (`/create-e2e-tests`, a handoff only) from running validation (`/validate-change`). Naming `/create-e2e-tests` does not execute it.\n\nInspect stack, modules, related repositories, current code, tests, and policies before asking. Separate verified facts from open decisions. Do not re-ask a decision `refine-story` already resolved.\n\n## Workflow\n1. Confirm the requested working directory, actual Git root, intended remote and branch, baseline, and unrelated staged, unstaged, and untracked modifications to preserve. Before editing, follow the baseline in [verification evidence](../../../references/verification-evidence.md): discover existing relevant tests and commands, run them when they can run on this host, and record observed failures with the code state they belong to. If a relevant check is or includes an end-to-end run, load and apply [end-to-end environment](../../../references/e2e-environment.md) before executing it, including this baseline. Inspect the command and runner configuration for the target environment; a locally invoked runner can still reach a remote URL. Reuse an authorization already given in this session. If a baseline could not be obtained, say that limitation. Do not reset, clean, or move unrelated changes to obtain a baseline.\n2. Assess semantic risk: behavior, dependency impact, security, data integrity, reversibility, novelty, and uncertainty. See [risk-and-specialists.md](references/risk-and-specialists.md).\n3. Present a brief approach: what will be reused, what will change, affected behavior and contracts, runtime and commands found, required dependencies and configuration, which components the planned checks exercise versus replace, what can be verified in the available environment, and what needs a different environment or an unavailable dependency. Follow [verification evidence](../../../references/verification-evidence.md). Ask only for a material alternative, an irreversible decision, or an ambiguous scope.\n4. Request an independent `implementation-reviewer` assessment in **approach review mode**, before writing code, only when a material new decision, uncertainty, or a relevant change against the already-reviewed design appears — for example authentication, a shared contract, a data migration, or identity and access isolation. Presence of Terraform or IAM (identity and access management) files is not that trigger. If the approved refinement still covers the approach, skip this review and say why. When that review is required, give the reviewer a bounded handoff: pass reason, the approved refinement, the proposed approach, and the delta against that refinement. Do not send the full conversation. Then wait for its result. Resolve blocking findings and material pending decisions before editing the affected scope. Independent work may continue only when it does not depend on that decision. The reviewer does not review a later diff; Bugbot owns that, in `/validate-change`.\n5. If independent delegation is unavailable when that review is required, disclose it and leave the affected scope pending unless an explicit applicable policy permits an exception. Do not call an implementation self-review independent. Do not edit the gated scope while that review is pending.\n6. The main chat may delegate bounded frontend, backend, infrastructure, integration, or test work to the `implementer` agent only when separate context or parallel work is useful. Give objective, boundaries, story, criteria, baseline, paths, dependencies, constraints, expected output, validation responsibility, and stop conditions.\n7. Make minimal scoped changes and add the narrowest tests that prove the requested behavior. Follow [verification evidence](../../../references/verification-evidence.md) for characterization of unprotected existing behavior, mock boundaries, external-failure checks, required dependencies, a separate QA item, and after-change regression. After the change, run the new or updated tests and the affected existing regression, including consumers and shared contracts the change can affect. Run the full suite when that is reasonable; use a justified subset when it is expensive, not pertinent, or needs an unavailable environment. Do not call a failure pre-existing without evidence. Fix regressions introduced inside the authorized scope. Do not delete tests, add skips, weaken assertions, or update snapshots only to get a green result. An existing end-to-end spec may be updated when the authorized behavior requires it, even if the user did not name those files. Do not add a new journey, a first suite, or a framework. Do not weaken end-to-end assertions. Load and apply [end-to-end environment](../../../references/e2e-environment.md) before modifying or executing existing end-to-end coverage, including this regression. New end-to-end authorship is a `/create-e2e-tests` handoff; do not claim that skill ran. Shared files may change when the authorized behavior requires it; check affected contracts, consumers, and tests. Do not treat file paths as belonging to one Story. Avoid conflicting concurrent edits. Writing Terraform or similar files is not approval to apply them.\n8. Treat public contracts, migrations, and infrastructure as explicit scope. Do not add them by implication. Updating an existing end-to-end spec for authorized behavior is not a new journey and does not require the user to name those files.\n9. After implementation finishes, report changed behavior, files, baseline, tests, known risks, the approach-review result or skip reason, and the implementation [verification close-out](../../../references/verification-evidence.md). That report does not own independent validation or Bugbot. Do not invent those statuses. Do not start `/validate-change` or Bugbot unless the user authorized continuing into validation. If the user authorized continuing into validation in the same request, load and follow [validate-change](../validate-change/SKILL.md) and report the seam. That continuation still starts a new independent `validator`; this chat does not evaluate its own conclusions. Otherwise give a `/validate-change` handoff. Do not claim that slash command ran when the user did not authorize the successor workflow. An implementation-only close-out is not delivery-ready validation.\n\n## Defect mode\nUse this mode for a bug report, a supplied reproduction, or an existing ticket. Stay inside the authorized repository and a non-production environment.\n\n1. Try to reproduce the reported behavior. Say what you reproduced and what is still a hypothesis. Do not invent a confirmed root cause or a successful reproduction.\n2. Separate a defect from intended behavior, a configuration problem, and a new feature request. Return a feature request to `/plan-work`.\n3. State the expected outcome. Ask when that outcome is still unclear.\n4. Make a scoped fix and add a regression test that fails before the fix and passes after it, when the project can run that test.\n5. After the fix, follow the same validation continuation rule as step 9 of the main workflow.\n6. Do not create or update a Jira record unless the user authorizes that write.\n\n## Boundaries\nInfrastructure, IAM, security, data migration, and production-affecting changes require explicit review and scoped approval before state-changing operations. Dedicated governance integration is deferred. Use local Git for read-only baseline inspection. Do not commit, push, open a PR, or deploy. Do not run `terraform apply`, `sam deploy`, or an equivalent apply or deploy.\n\n## Output\nReturn changed behavior, files, baseline, tests added or updated, known risks, the approach-review outcome or skip reason, the implementation verification close-out, and either a validation continuation or a validation handoff. Do not invent independent-validation or Bugbot status on an implementation-only run.\n\n## Reference loading\nThe links below are an allowlist. Do not open every file at the start of the run.\n\n- [repository preflight](../../../references/repository-preflight.md) during start-of-run confirmation.\n- [requirement snapshot](../../../references/requirement-snapshot.md) when capturing or comparing requirements.\n- [risk-and-specialists.md](references/risk-and-specialists.md) when assessing semantic risk and whether approach review applies.\n- [verification evidence](../../../references/verification-evidence.md) for baseline, checks, and close-out.\n- [architecture decisions](../../../references/architecture-decisions.md) when recovering constraints.\n- [Jira integration](../../../references/jira-integration.md) when reading Jira.\n- [skill composition](../../../references/skill-composition.md) when dispatching, continuing into validate-change, or handing off.\n- [work record](../../../references/work-record.md) and [criterion identifiers](../../../references/criterion-ids.md) when those records are in play.\n- [end-to-end environment](../../../references/e2e-environment.md) before modifying or executing existing end-to-end coverage, including baseline and regression, not only when a spec changes.\n- [model evaluation](../../../references/model-evaluation.md) only when the change affects model or generative-system behavior.\n","inbound":[".cursor/skills/implement-change/references/risk-and-specialists.md"]},{"id":".cursor/skills/implement-change/references/risk-and-specialists.md","kind":"reference","name":"Risk and specialist handoffs","summary":"Conditional approach review and bounded implementation delegation.","words":306,"chars":2265,"lines":15,"links":[".cursor/skills/implement-change/SKILL.md"],"headings":[{"text":"Risk and specialist handoffs","line":1}],"source":"# Risk and specialist handoffs\n\nUse **fast** depth for well-understood, reversible, isolated changes. Independent approach review is optional.\n\nUse **standard** depth when behavior, contracts, regressions, or cross-component impact may change. Independent approach review still runs only when [implement-change](../SKILL.md) finds a material new decision, uncertainty, or a relevant change against the already-reviewed design.\n\nUse **deep** depth for security, identity, infrastructure, payments, data integrity, destructive operations, public or shared contracts, or substantial uncertainty. Identify required approvals. Dedicated governance integration is deferred. Approach review still requires that material-new-decision trigger. Presence of Terraform or IAM (identity and access management) files is not enough.\n\nWhen that trigger holds, the main chat requests `implementation-reviewer` in **approach review mode** before writing code, waits for the result, and treats it as a gate on the affected scope. The reviewer receives the approved refinement, current code evidence, and the proposed approach. It returns risks, alternatives, blocking findings, and pending decisions. Resolve those blockers before editing the gated scope. If the review is unavailable, leave that scope pending unless an explicit applicable policy permits an exception. Independent work may continue only when it does not depend on that decision. The reviewer does not review the later implementation diff. After code exists, Bugbot coordination belongs to `validate-change`. Do not use this reviewer as a substitute for Bugbot.\n\nThe main chat may use an `implementer` for bounded frontend, backend, infrastructure, integration, or testing work. Give the agent its objective, boundaries, baseline, paths, acceptance criteria, dependencies, constraints, expected output, validation responsibility, and stop conditions. Avoid concurrent edits to the same path.\n\nUse agents only when the host supports independent delegation. They must return concise findings with file references and uncertainty. Do not create mandatory reports merely because a specialist ran.\n\nChoose a model only through a verified supported configuration. If unavailable, recommend a depth and let the user choose.\n","inbound":[".cursor/skills/implement-change/SKILL.md"]},{"id":".cursor/skills/plan-work/SKILL.md","kind":"skill","name":"Plan work","summary":"Plan a business Epic, User Story, Task, proposed sprint backlog, or update to existing work from natural-language intent.","words":2471,"chars":17093,"lines":96,"links":["references/response-style.md","references/context-retrieval.md","references/jira-integration.md",".cursor/skills/plan-work/references/jira-story-template.md",".cursor/skills/plan-work/references/single-story.md","references/architecture-decisions.md",".cursor/skills/plan-work/references/epic-discovery.md",".cursor/skills/sync-context/references/validation.md",".cursor/skills/plan-work/references/product-review.md","references/approval-contract.md","references/canvas-review.md","references/skill-composition.md","references/work-record.md","references/criterion-ids.md","references/model-evaluation.md"],"headings":[{"text":"Plan work","line":7},{"text":"Purpose","line":9},{"text":"Response shape","line":12},{"text":"Context retrieval","line":15},{"text":"Planning hierarchy","line":18},{"text":"Input and routing","line":23},{"text":"Prerequisites","line":26},{"text":"Story description template","line":29},{"text":"Workflow","line":34},{"text":"Sprint Backlog mode","line":51},{"text":"Duplicate safety","line":54},{"text":"Plan state","line":59},{"text":"Approval boundary","line":72},{"text":"Final review","line":75},{"text":"Outputs","line":78},{"text":"Reference loading","line":81}],"source":"---\nname: plan-work\ndescription: Plan a business Epic, User Story, Task, proposed sprint backlog, or update to existing work from natural-language intent.\ndisable-model-invocation: true\n---\n\n# Plan work\n\n## Purpose\nAct as a Product Owner copilot: turn business intent into an editable, evidence-based proposal at the right planning level, without prematurely creating Jira work. A request to define one item is not a request to generate a full backlog.\n\n## Response shape\nFollow the shared [compact response style](../../../references/response-style.md).\n\n## Context retrieval\nUse [context retrieval](../../../references/context-retrieval.md). Read only enough current repository and Jira evidence to understand product impact; do not load implementation detail unless scope or feasibility requires it. This skill answers \"what work should we define from what we already know,\" not \"what do we know about this project.\" Missing or stale context triggers a `/sync-context` handoff only for claims that depend on current implementation evidence. It does not block business-only planning, and it does not mean stop drafting.\n\n## Planning hierarchy\nEpic → User Story → Task. A Task does not require a Story parent, and a Story does not require an Epic parent, when the methodology does not need one — do not force every item through all three levels. Sprint Backlog is a planning collection of selected work items; it is not a fourth parent level in this hierarchy.\n\nThis is this plugin's own conceptual drafting model. It is not Jira's issue-type hierarchy. A recommended parent is a logical relationship, for example \"this Task supports Story X\", not a Jira issue type. When preparing a Jira write for a Task that supports a Story, discover the site's issue types and hierarchy, then put the exact issue type in the payload the Product Owner approves. Offer the options the site actually allows, typically: create a Jira Subtask under that Story, or create a Jira Task and link it to that Story. Do not silently change a Task into a Subtask because a Story was recommended as its parent. See [Jira integration](../../../references/jira-integration.md).\n\n## Input and routing\nAccept natural language plus optional Jira key or URL and repository URL. Infer the planning level — Epic, User Story, Task, or Sprint Backlog — from the request's own language rather than defaulting every request to one level; route an update to existing work separately. Ask one focused question only when the level is genuinely ambiguous and the ambiguity is material to how the item should be defined.\n\n## Prerequisites\nRead current repository context when it already exists. A missing or stale repository context blocks only the parts of this skill that genuinely need it: a technical feasibility claim, a parent recommendation that depends on reading current code, or any statement about what the codebase already does. It does not block business-only planning — a Product Owner can define an Epic or a Story before any code exists. When context is missing or stale and this item needs it, say so, mark that part unavailable rather than guessed, and offer a `/sync-context` handoff; do not claim that it ran automatically, and do not refuse to draft the rest of the item while that part is pending. For existing work, read the current issue, linked work, and relevant implementation before proposing changes. Use the Jira integration contract to retrieve Jira data. If it is unavailable, request the issue content or produce a clearly labeled local-only proposal.\n\n## Story description template\nApply this when preparing a User Story's Jira write payload, not earlier. By that point the Product Owner and the draft already agree on the story's content, so this is a publication formatting choice, not a drafting one, and it must not compete with the product questions in step 2 of the workflow below. At that point, read any `## Planning template` decision from `.ai-dlc-config.md` and call `decision_reprompt_allowed(decision, same_run)`. With no recorded decision, or when it returns true, offer [jira-story-template.md](references/jira-story-template.md). The Product Owner may accept it, edit the headings, or decline it. A recorded `declined` is never re-offered without an explicit request to reconsider. A recorded `deferred` is not re-offered within the same run, but is offered again on a later run — a `## Planning template` section existing is not by itself \"already decided.\"\n\nDiscover the issue type's acceptance-criteria field before preparing the write. Do not hardcode a custom field id. Show the chosen location in the same payload the Product Owner approves. Do not ask for a second approval of an \"exception.\" Follow the location rules in [jira-story-template.md](references/jira-story-template.md): writable field, confirmed absent, or agree the destination when the field exists but is not writable, metadata is incomplete, or access failed. Never publish operational disclaimers about fields, MCP, or fallback inside the ticket.\n\n## Workflow\n1. Classify the request's planning level from the user's words and explain the classification in one sentence.\n2. Ask only the small number of Product Owner questions that materially improve this specific item, drawn from what the request, synchronized context, design, and Jira evidence do not already answer. Do not ask a generic questionnaire, do not re-ask something already supplied, and do not re-ask a decision already resolved on another Story in this draft. Product challenge rules live in [single-story.md](references/single-story.md); do not treat `refine-story` as the place to finish missing product behavior.\n3. Inspect scoped code and connected Jira work before claiming feasibility. When repository context is missing or stale and this item does not yet depend on existing code, continue with business-only planning and mark technical feasibility as not yet assessed instead of blocking the draft.\n4. Separate facts, constraints, and assumptions in business language. Read applicable accepted architecture decisions when the record exists — see [architecture-decisions.md](../../../references/architecture-decisions.md). Surface a conflict. Do not turn a product wish into an accepted technical decision.\n5. For a new User Story, read [epic-discovery.md](references/epic-discovery.md) and recommend a parent Epic, or recommend defining a new one. For a new Task, use the same reference to recommend a parent User Story when one genuinely applies, or an Epic directly only when none does. Never create a recommended parent silently.\n6. Use the routed reference to produce a proposal, in this skill's own planning model, that can be edited in chat. The main chat drafts; do not delegate drafting to a specialist agent. Do not apply the Jira Story description template at this step — see \"Story description template\" above for when that applies. A Story-specific design reference is collected here, when one exists, not by the Jira renderer.\n7. Run deterministic validation over the drafted proposal before requesting independent review. Resolve `scripts/context_tools.py` relative to this skill, the same way [validation.md](../sync-context/references/validation.md) resolves it for `/sync-context`. From this file the script is `../../../scripts/context_tools.py`. Do not resolve it from the consumer repository's working directory. Write the proposal JSON to a temporary file outside the consumer repository, or pass it on standard input with `python3 ../../../scripts/context_tools.py plan-validate -`. Do not create `proposal.json` inside the consumer repository. The JSON shape is documented on `plan_validate_proposal`. Resolve every failed or unresolved check before review. An `external` check names a Jira issue key that is not an item in this proposal. It is not a structural failure. Confirm that issue exists with a Jira read and give that evidence to the reviewer. Do not drop the dependency or invent a stub item to make the check disappear. Invalid input is a failed or unresolved check. Do not show a Python traceback as the result.\n8. When the Product Owner finishes a drafting round or asks to review, request independent review per [product-review.md](references/product-review.md). Open product questions do not delay that request. No exact phrase is required.\n9. If the host cannot delegate independently, keep independent review visibly pending. Do not present self-review as independent review. Allow a named human review or a policy-permitted exception; otherwise block publication while drafting continues.\n10. Consolidate blocking findings and only the PO questions needed to resolve business uncertainty. For a straightforward correctness or quality fix, the main chat may apply it before presenting the final review; for a finding that would change product scope, behavior, assumptions, or intent, surface it to the PO instead of deciding it silently. Re-run affected review scope only after a material revision, then surface unresolved disagreement to the human instead of looping.\n11. For existing work, show a minimal field-level update diff that preserves unrelated content and links; preserve previously approved content unless new evidence conflicts, and surface the conflict instead of silently overwriting it. Preserve an existing Story-specific design reference unless the Product Owner replaces it. A second identical run must not create a duplicate planning artifact.\n12. Mark the draft **ready for review** after PO drafting, including when open product questions remain. Record the independent review event as completed only when the reviewer responded, otherwise unavailable or pending. Set the item to `reviewed` only when that review finished with no unresolved blocker; if the reviewer named a Blocker, set the item to `blocked`. Resolve publication blockers, then request **approved for publication** only for the exact Jira mutation or optional Git intent PR. Approval of the local plan is never, by itself, approval to mutate Jira. Do not present the draft as ready to implement while a blocking product decision remains open.\n13. When preparing the Jira write payload for a new User Story, apply the Story description template above before showing the final payload for approval.\n14. At the same point, include each drafted dependency and any optional suggested field in that one publication confirmation. Approve each dependency as a plain-language relationship between draft identifiers, for example \"Story A blocks Story B\", not as a pair of Jira keys that do not exist yet. After the issues exist, create the link and re-read it — see [Jira integration](../../../references/jira-integration.md), \"Dependencies as issue links\" and \"Optional suggested fields,\" and [approval-contract.md](../../../references/approval-contract.md).\n15. After an approved write, re-read the written record, report publication completed, pending, or partially completed, and distinguish local persistence from confirmed Jira state. Reconcile an uncertain write before retrying.\n\n## Sprint Backlog mode\nAct as a Product Owner planning the sprint, not drafting one isolated item. Distinguish selecting already-defined work already visible in Jira from creating new work that still needs definition. Surface sprint goal, candidate items, dependency order, blockers, and open questions from available evidence. Never invent team capacity, velocity, story points, estimates, or dates; report them as unknown when evidence is missing and material. This capacity rule governs planning the whole sprint. Suggesting a Sprint or Story Points value for one item at publication time (see \"Optional suggested fields\" in [Jira integration](../../../references/jira-integration.md)) is a narrower, evidence-based action and never substitutes for this capacity rule.\n\n## Duplicate safety\nDo not run a standalone duplicate search in this version. If an obvious duplicate is encountered incidentally while inspecting the candidate parent or an explicitly referenced issue, surface it. Do not search Jira for duplicates of the item being drafted.\n\nA partial Jira write is not duplicate detection. Re-read the target record and reconcile it before retrying. That is write recovery, not a duplicate search.\n\n## Plan state\nEach item moves through one status, in order: `drafted`, then `reviewed`, then `approved`, then `persisted`. `blocked` and `unavailable` can apply at any point and are not approval.\n\n- `drafted` includes the moment the draft is marked ready for review. Ready for review is not approval. `local_plan_approved` is false. Open product questions do not prevent requesting independent review.\n- Independent review is recorded completed only when the reviewer responded, otherwise unavailable or pending. That event is not the item status.\n- `reviewed` means independent review finished with no unresolved blocker. `local_plan_approved` is still false.\n- `blocked` means a blocking review finding or an approval boundary is unresolved. A reviewer Blocker sets the item to `blocked`, not `reviewed`.\n- `approved` means the Product Owner approved the local plan. That sets `local_plan_approved` true. It does not approve a Jira write.\n- Jira publication approval is a separate decision, `jira_mutation_approved`. `jira_mutation_authorized` is true only when both are true. Ask for it only for the exact payload, after the local plan is `approved`.\n- `persisted` means the approved write was re-read from Jira.\n\nDo not set `local_plan_approved` from ready-for-review, from review completion, or from a Canvas edit.\n\n## Approval boundary\nPlanning is dry-run by default. Canvas edits do not authorize external writes. Reviewer findings never replace PO approval. A Jira write must name the project, the exact issue type, issue key or creation fields, issue links, and comments. Retry partial approved writes by reading the target record before retrying. That re-read is write recovery, not a duplicate search.\n\n## Final review\nShow the ready-for-review draft, and the result after an approved write, with the shared [canvas review](../../../references/canvas-review.md): use the host Canvas capability when available, otherwise the same sections go in chat and the reply says Canvas is unavailable on this host. Include the proposed item or backlog, acceptance criteria, Epic relationship, dependencies, assumptions, open questions, Jira parent recommendation, deterministic validation result, reviewer findings, and any change already applied from review. Reviewer findings must be readable in that view; a status word is not a substitute. A run with nothing to show gets a short chat reply, not a Canvas open or refresh.\n\n## Outputs\nReturn the route, evidence sources, editable proposal, approval-ready Jira payload or update diff, assumptions, and unresolved questions. Do not create Story mirrors, empty subtasks, or capacity commitments. A suggested Priority, Label, Fix Version, Sprint, or Story Points value is optional, sourced from existing evidence per \"Optional suggested fields\" in [Jira integration](../../../references/jira-integration.md), always shown as a suggestion, and included in the same publication confirmation as the rest of the payload. Return each approved dependency as the plain-language relationship that was confirmed, then the issue link created after the issues exist and checked by a re-read.\n\n## Reference loading\nThe links below are an allowlist. Do not open every file at the start of the run.\n\n- The routed drafting reference (`single-story.md`, `task.md`, `feature-or-epic.md`, `sprint-backlog.md`, or `update-existing.md`) when that route is selected.\n- [epic-discovery.md](references/epic-discovery.md) when recommending a parent for a new Story or Task.\n- [product-review.md](references/product-review.md) when independent review is due.\n- [jira-story-template.md](references/jira-story-template.md) only when preparing a User Story Jira write payload, as in \"Story description template\" above. Do not open it during product questions or while drafting.\n- [approval-contract.md](../../../references/approval-contract.md) when requesting approval or a Jira write.\n- [canvas review](../../../references/canvas-review.md) when closing with the review view.\n- [Jira integration](../../../references/jira-integration.md) when reading or preparing Jira.\n- [skill composition](../../../references/skill-composition.md) when dispatching a reviewer or handing off.\n- [work record](../../../references/work-record.md) and [criterion identifiers](../../../references/criterion-ids.md) when preparing or confirming publication.\n- [architecture decisions](../../../references/architecture-decisions.md) when an architecture record exists or a product wish might conflict with one.\n- [model evaluation](../../../references/model-evaluation.md) only when the planned work affects model or generative-system behavior.\n\nDo not invent NFR headings or thresholds. Propose local criterion identifiers only in the approved publication payload; do not overwrite a custom Product Owner template.\n","inbound":[]},{"id":".cursor/skills/plan-work/references/epic-discovery.md","kind":"reference","name":"Parent discovery for a new Story or Task","summary":"Scoped parent recommendation without standalone duplicate search.","words":332,"chars":1971,"lines":14,"links":[".cursor/skills/plan-work/references/task.md"],"headings":[{"text":"Parent discovery for a new Story or Task","line":1}],"source":"# Parent discovery for a new Story or Task\n\nWhen drafting a new User Story, find the right Epic to attach it to rather than leaving the relationship unresolved or guessing from word overlap. When drafting a new Task, find the most specific right parent instead: an existing or newly-defined User Story when the Task genuinely supports one, and an Epic directly only when no such Story applies — see [task.md](task.md), which allows either.\n\n1. State the product capability (for a Story) or the supporting purpose (for a Task) this item represents in one sentence.\n2. Search Jira using the Jira integration contract: Epics for a Story; both Stories and Epics for a Task. If no Jira project is confirmed for this engagement, report that as a limitation and hand off to `/sync-context`; do not run project onboarding from inside this skill.\n3. For each candidate, read enough to judge fit: title, summary, description, objective, labels or components, status, and already-declared scope.\n4. Compare the strongest candidates on semantic and product fit, not on matching words. Do not attach a Story to an Epic, or a Task to a Story or an Epic, merely because titles share terms.\n5. Report one of:\n   - a strong match, with a short explanation of why it fits;\n   - several plausible candidates, with the ambiguity stated so the Product Owner decides, not an arbitrary pick;\n   - no reasonable fit: for a Story, recommend defining a new Epic; for a Task, recommend defining a new User Story when one genuinely applies, or a new Epic directly only when none does. Help define the recommended parent if the Product Owner wants to proceed, but do not create it without explicit approval.\n\nThis step does not run a general semantic search for a duplicate Story, and it does not run a standalone duplicate search. If an obvious duplicate is encountered incidentally while inspecting the candidate parent or an explicitly referenced issue, surface it and do not propose creating it.\n","inbound":[".cursor/skills/plan-work/SKILL.md",".cursor/skills/plan-work/references/single-story.md",".cursor/skills/plan-work/references/task.md"]},{"id":".cursor/skills/plan-work/references/feature-or-epic.md","kind":"reference","name":"Feature or Epic","summary":"Product outcome, scope, actors and coherent Story decomposition.","words":174,"chars":1088,"lines":22,"links":[],"headings":[{"text":"Feature or Epic","line":1}],"source":"# Feature or Epic\n\nDefine the outcome, affected users, measurable success, boundaries, and independently valuable Story slices. Avoid technical decomposition unless it changes business scope. Do not split this into implementation Tasks unless the user asks for that.\n\nPropose:\n\n- title;\n- problem or opportunity;\n- objective;\n- business or user outcome;\n- actors or personas, where relevant;\n- scope;\n- out-of-scope boundaries;\n- major scenarios or capabilities;\n- success criteria;\n- known dependencies;\n- risks;\n- open questions.\n\nBefore treating the draft as ready, check that it states the problem, the expected outcome, and the scope. If the request did not supply enough context for one of those, say what is missing. Do not fill the gap with a guessed detail.\n\nAn initial set of likely Stories under this Epic may be proposed as candidates only, clearly labeled as not committed. Label ordering and dependency assumptions as proposals. Do not publish an Epic with the User Story description template. Do not create issues until the user approves the exact Epic and Story payloads.\n","inbound":[".cursor/skills/plan-work/references/jira-story-template.md",".cursor/skills/plan-work/references/single-story.md"]},{"id":".cursor/skills/plan-work/references/jira-story-template.md","kind":"reference","name":"User Story description template","summary":"Publication renderer with preserved approved content and AC field placement.","words":1262,"chars":8447,"lines":127,"links":["references/jira-integration.md",".cursor/skills/plan-work/references/task.md",".cursor/skills/plan-work/references/feature-or-epic.md",".cursor/skills/plan-work/references/single-story.md"],"headings":[{"text":"User Story description template","line":1},{"text":"Planning template","line":8},{"text":"Authoring rules","line":17},{"text":"Default description","line":50},{"text":"Acceptance criteria field","line":116}],"source":"# User Story description template\n\nOffer the template only when preparing the Jira publication payload, after the product content has been drafted and reviewed. Do not offer it while the Product Owner is still answering product questions or while the story is being drafted. The Product Owner may accept it, edit the headings, or decline it.\n\nRecord the decision in the artifact home `.ai-dlc-config.md`:\n\n```markdown\n## Planning template\n- Decision: `approved`\n- Source: `plugin-default`\n```\n\nUse `approved`, `declined`, or `deferred`. Pass that decision to `decision_reprompt_allowed`. An approved shape is reused. A decline is not offered again unless the Product Owner asks to reconsider. A defer is not offered again in the same run.\n\nIf the Product Owner edits the shape, show the edited template and wait for approval before writing it. Save the approved text at `aidlc-docs/planning-template.md` under the artifact home, and record `Source: aidlc-docs/planning-template.md` instead of `plugin-default`. Do not write an absolute local path. A Product Owner-edited template is the approved shape. Do not rewrite it into this default order.\n\n## Authoring rules\n\nAuthor the description in Markdown. Follow [Jira integration](../../../../references/jira-integration.md). Do not author Jira wiki markup. The Atlassian MCP treats the body as Markdown and converts it on write when that is the available write path. Wiki headings, wiki tables, and status icons are stored as literal text or escaped markers. When writing to Jira, use the format the available tool actually supports. Do not assume a raw Markdown `---` separator renders as a horizontal rule.\n\nDiscover the issue type's acceptance-criteria field before the write. Do not hardcode a custom field id. Write each criterion as an observable statement. Do not prefix criteria with status icons. Show the destination in the payload the Product Owner approves. Do not ask for a second approval of an \"exception.\"\n\n- Identified and writable: put business acceptance criteria only in that field. Omit the Acceptance Criteria heading below.\n- Confirmed absent: include the Acceptance Criteria heading below as the Description fallback. A Product Owner-edited template must still carry every approved criterion.\n- Exists but not writable, incomplete metadata, or access error: do not treat the field as absent. Report the limitation and agree the destination inside the approved payload.\n- Never publish operational disclaimers about Jira fields, MCP, or fallback inside the ticket.\n\nThis skeleton is for a User Story. Do not wrap a Task or an Epic in the \"As a …\" line. A Task uses [task.md](task.md). An Epic uses [feature-or-epic.md](feature-or-epic.md).\n\nWhen filling the skeleton:\n\n- Start with the user-story line. Do not add a Description heading above it.\n- Separate sections with Markdown `---`, surrounded by blank lines, in this skeleton.\n- Replace a bracket with approved content when it exists.\n- Preserve optional headings with reader-facing placeholders when approved content is absent. Do not omit an empty optional heading. This supersedes the previous omit-empty-optional-sections presentation rule.\n- Optional-section placeholders are not requirements or readiness blockers. Never invent content to fill them. Never replace actual unresolved questions with them.\n- Actor, capability, benefit, and Acceptance Criteria placeholders must never count as completed or approved requirements. Handle missing required content through the existing planning flow. Do not invent it.\n- Validation Notes may add a business-level scenario that exercises an existing acceptance criterion, per [single-story.md](single-story.md), \"Testing and validation expectations.\" It must not introduce new product behavior. If the approved Story has no such note, keep the heading and placeholder. Do not paraphrase the acceptance criteria.\n- Technical notes are known constraints in business language. Hand implementation detail to `refine-story`. If none were approved, keep the heading and placeholder.\n- Scope / Out of Scope publishes an approved boundary that is not already an Acceptance Criterion, per [single-story.md](single-story.md). Do not invent scope or exclusions. Do not copy Acceptance Criteria into this section. If none were approved, keep the heading and placeholder.\n- Goals & Metrics publishes a Story-specific outcome or measure, per [single-story.md](single-story.md), \"Story-specific goals and metrics.\" Do not invent one. If none was approved, keep the heading and placeholder.\n- Design / References publishes a Story-level design reference already in the approved Story, per [single-story.md](single-story.md), \"Design reference.\" Do not discover, infer, or inspect a design here. Retrieval happens while drafting or updating the proposal. If none was approved, keep the heading and placeholder.\n- Keep Stakeholder Questions as a Question / Answer table. Put real unresolved questions in that table. Do not replace them with the placeholder row.\n- Keep Acceptance Criteria last in Description only when Description is the approved destination for acceptance criteria. If a dedicated field is used, do not duplicate that section. Omit the Acceptance Criteria heading from Description in that case.\n- Do not invent goals, metrics, dependencies, risks, scope, exclusions, or a design reference.\n- If a custom Product Owner template is the approved shape, use that shape. Preserve all approved Story content. When stable criterion identifiers are authorized, propose how they fit that shape; do not overwrite the custom template.\n\nThis template renders the approved Story model; it does not define it. It keeps optional headings with reader-facing placeholders when approved content is absent. It may omit a restatement that would only duplicate content already published in another field of the same payload, such as Acceptance Criteria. Deduplication is allowed only when meaning and traceability are preserved. It must not infer or introduce product behavior, a goal, a metric, a validation expectation, a dependency, a risk, a design reference, a scope boundary, or any other semantic content that is absent from the approved Story proposal. It must preserve every meaningful approved requirement, boundary, unresolved question, dependency, and reference. Formatting and placeholders must not cause information loss.\n\n## Default description\n\n```markdown\nAs a [user], I want [capability], so that [benefit].\n\n---\n\n#### 🎯 Context\n\n[Add background a reader needs, if applicable]\n\n---\n\n#### 📌 Scope / Out of Scope\n\n- **In scope:** [Add an in-scope boundary, if applicable]\n- **Out of scope:** [Add an out-of-scope exclusion, if applicable]\n\n---\n\n#### 🎨 Design / References\n\n[Add a story-specific design reference, if applicable]\n\n---\n\n#### 💬 Stakeholder Questions\n\n| Question | Answer |\n| --- | --- |\n| [Open question] | [Answer, or \"open\"] |\n\n---\n\n#### 🛠️ Technical Notes\n\n[Add confirmed technical constraints, if applicable]\n\n---\n\n#### 🧪 Validation Notes\n\n[Add additional business validation guidance, if needed]\n\n---\n\n#### 📊 Goals & Metrics\n\n[Add a story-specific goal or metric, if applicable]\n\n---\n\n#### 🔗 Dependencies & Risks\n\n- **Dependency:** [Add a dependency, if applicable]\n- **Risk:** [Add a risk, if applicable]\n\n---\n\n#### ✅ Acceptance Criteria\n\n- [Observable result 1.]\n```\n\nThis prose line is human-readable context, not the operative relationship. An approved dependency is also created as a real Jira issue link at publication time — see [Jira integration](../../../../references/jira-integration.md), \"Dependencies as issue links.\" The two are not duplicates: the link is what Jira actually tracks, this text explains it in the story's own words.\n\n## Acceptance criteria field\n\nWhen the issue type has a writable acceptance-criteria field, put this content in that field, not under Description:\n\n```markdown\n- [Observable result 1.]\n- [Observable result 2.]\n```\n\nWhen identifiers are authorized for a new publication, prefix each criterion with a local id such as `AC-01`. Preserve ids that already exist. Do not renumber an existing ticket silently.\n\nWhen that field is confirmed absent, use the Acceptance Criteria heading in the Description skeleton above instead. Do not write both. If the field exists but is not writable, agree the destination in the approved payload rather than assuming Description. Do not add a sentence in the ticket explaining why.\n","inbound":[".cursor/skills/plan-work/SKILL.md",".cursor/skills/plan-work/references/single-story.md"]},{"id":".cursor/skills/plan-work/references/product-review.md","kind":"reference","name":"Product review gate","summary":"Independent business review gate, findings, changed-scope re-review and readiness.","words":564,"chars":3987,"lines":22,"links":["references/skill-composition.md"],"headings":[{"text":"Product review gate","line":1}],"source":"# Product review gate\n\nThe product owner owns the draft. **Ready for review** is when the Product Owner finishes a drafting round or asks to review. No exact phrase is required. Open product questions do not delay that review. **Ready to implement** and **approved for publication** stay separate: a blocking unresolved product decision must not be treated as ready to implement, even after review ran.\n\nWhen review is due, request an independent `product-reviewer` assessment through a supported host agent facility, following [skill composition](../../../../references/skill-composition.md). If the host cannot invoke that named agent, a general-purpose independent subagent may take the `product-reviewer` file as bounded task context; report that as general-purpose independent review, not native named-agent dispatch. If no independent subagent is available, say so and keep review unavailable or pending. Never present the main chat's own assessment as independent review.\n\nGive the reviewer a bounded handoff. Every handoff names:\n\n- pass reason: first review after this drafting round, or re-review of a material revision;\n- draft version identifier;\n- delta since the previous review when this is a re-review: what changed, and what is unchanged;\n- the sources the reviewer must read: affected work, scoped context, the deterministic validation result, open product questions, and any obvious duplicate noticed in passing while reading a candidate parent Epic.\n\nDo not send the full conversation. Do not re-review unchanged scope. Do not pass a duplicate-candidates list as if a search ran, and do not ask the reviewer to search Jira for duplicates. This skill does not run a dedicated duplicate search, so there are no search limits to report. The reviewer evaluates open questions and names which ones block implementation or publication. It returns evidence-based blocking findings, optional improvements, open questions, and a readiness recommendation.\n\nReport the reviewed scope and draft version, findings or a visible \"no findings\" result, and the actual delegation outcome, in the same closing view the Product Owner sees. Do not replace that with a status phrase. Mark review `completed` only when the reviewer responded. If delegation is unavailable, keep the requirement visible. A named human review or a policy-permitted exception may satisfy it; otherwise publication stays blocked while drafting can continue.\n\nThe reviewer inspects clarity, product value, scope, correct granularity, acceptance-criteria quality and testability, missing important scenarios, unsupported assumptions, contradictions, ambiguous behavior, dependency correctness, parent Epic fit, a Task incorrectly modeled as a Story, a Story that is really Epic-sized, implementation detail leaking into the product requirement, implementation-readiness, and whether an open question materially blocks implementation. For a Sprint Backlog, the reviewer also checks sprint-goal coherence, dependency ordering, missing prerequisite work, blockers, and scope coherence given any capacity information actually supplied. Findings use a small severity vocabulary: Blocker, Major, Minor, Suggestion. **No findings** within reviewed scope is a valid, complete review result — a reviewer must never manufacture a finding merely to show that review happened.\n\nThe main chat consolidates findings. Ask the product owner only questions that resolve business uncertainty. Re-review only the changed scope after material revisions, including a proposal materially changed by an incidental-duplicate finding. If the reviewer and product owner disagree, present the disagreement and request a human decision.\n\n**Approved for publication** is separate. It requires product-owner approval of the exact Jira or Git changes after blockers are resolved. The reviewer cannot approve publication. After a write, record publication as completed, pending, or partially completed and reconcile uncertainty before retrying.\n","inbound":[".cursor/skills/plan-work/SKILL.md"]},{"id":".cursor/skills/plan-work/references/single-story.md","kind":"reference","name":"Single Story","summary":"Canonical product semantics, scenarios, ambiguity, validation notes and design references.","words":1722,"chars":11592,"lines":106,"links":[".cursor/skills/plan-work/references/task.md",".cursor/skills/plan-work/references/epic-discovery.md",".cursor/skills/plan-work/references/jira-story-template.md",".cursor/skills/plan-work/references/feature-or-epic.md",".cursor/skills/sync-context/references/artifact-home.md","references/project-onboarding.md"],"headings":[{"text":"Single Story","line":1},{"text":"Testing and validation expectations","line":39},{"text":"Story-specific goals and metrics","line":51},{"text":"Open questions and ambiguity","line":59},{"text":"Design reference","line":70},{"text":"Semantic precedence","line":91},{"text":"Keep output concise through omission, not information loss","line":104}],"source":"# Single Story\n\nAsk about the user outcome, primary actor, observable success, exclusions, and open business questions. Do not ask implementation, schema, deployment, or test-runner questions.\n\nUse the outcome-oriented form \"As a [user or actor], I want [capability], so that [outcome]\" when it fits the work. Do not force technical work into fake user-story wording; route that to [task.md](task.md) instead.\n\nPropose:\n\n- title;\n- story statement or objective;\n- business or user value;\n- recommended parent Epic — see [epic-discovery.md](epic-discovery.md);\n- scope;\n- acceptance criteria expressed as observable, testable behavior; Given/When/Then is optional, not mandatory;\n- approved non-functional constraints when they are real requirements, each with a source, without empty headings or invented thresholds;\n- conflicts with an accepted architecture decision, when that record exists, without turning a product wish into a new accepted decision;\n- relevant scenarios;\n- exclusions;\n- dependencies;\n- assumptions and technical constraints, clearly labeled;\n- validation or testing expectations, where appropriate — see [Testing and validation expectations](#testing-and-validation-expectations) below;\n- a Story-specific goal or success measure, only when one actually exists — see [Story-specific goals and metrics](#story-specific-goals-and-metrics) below;\n- a Story-level design reference, only when one actually exists — see [Design reference](#design-reference) below;\n- source or traceability: what evidence this item is based on;\n- any obvious duplicate noticed incidentally while inspecting a candidate parent or an explicitly referenced issue. Do not run a standalone duplicate search.\n\nDo not invent behavior purely to make the acceptance criteria look complete; leave unresolved behavior as an explicit open question instead — see [Open questions and ambiguity](#open-questions-and-ambiguity) below. Technical constraints should explain the impact in business language. Hand implementation details to `refine-story`.\n\nDo not fill or offer [jira-story-template.md](jira-story-template.md) while drafting. That template is a publication-payload step in the main skill, after the product content has been drafted and reviewed. Where accepted business criteria are stored at publication — the issue type's acceptance-criteria field, or Description when that field is confirmed absent — is a publication rule in the main skill and that template. It is not a product decision.\n\nWhile drafting, check that required behavior and observable result are defined well enough to challenge, and that Stories in this draft cohere: the same decision must not be asked twice, and one Story must not silently contradict another.\n\nAsk only about material product decisions that the request, existing context, design, or another Story in this draft has not already resolved. Do not run a universal questionnaire of empty states, errors, login, or clicks. Do not invent requirements or exclusions. Label each boundary as confirmed, assumed, or proposed. Do not duplicate Value, Acceptance Criteria, and Scope when they say the same thing.\n\nOpen product questions do not block independent review. The reviewer evaluates them and names which ones block implementation or publication. Do not present the draft as ready to implement, or as approved for publication, while a blocking product decision remains open. Hand implementation detail, and only that, to `refine-story`. If later technical work uncovers a still-unresolved business decision, it returns here; it does not invent the product answer.\n\nApproved scope and exclusions must survive that publication. Render them as Scope / Out of Scope when they state a boundary that is not already an Acceptance Criterion. Do not drop an approved exclusion because another section has no place for it.\n\n## Testing and validation expectations\n\nAcceptance criteria define required observable product behavior. Testing or validation expectations are different: they may add useful business-level scenarios, examples, or conditions that help exercise an acceptance criterion that already exists. They must not introduce a new required behavior, expected outcome, UX decision, or implementation decision that is absent from the acceptance criteria or another authoritative source.\n\nIf a candidate testing note would introduce new required product behavior, it does not belong in testing. Move it into the acceptance criteria if the Product Owner confirms it, or surface it as an open question if it is still unresolved.\n\nA Product Owner note belongs in Testing only when it adds information that is not already in the acceptance criteria. Omit Testing entirely when the note would only restate or paraphrase them.\n\nFor example, an acceptance criterion already says the order list shows each order's status. The Product Owner then asks to exercise that list with an account that has both a completed order and one still in progress. That covering condition is a valid testing note: it names data to use, not a new required behavior. \"A signed-out shopper is redirected to `/login`\" is not a valid testing note unless that redirect is already defined; on its own it introduces new product behavior, so it belongs in the acceptance criteria or as an open question.\n\nDo not introduce technical testing detail such as mocks, a unit-versus-integration strategy, environments, implementation-specific fixtures, or a test-framework choice, unless the Product Owner already supplied that as source evidence. Technical validation design belongs downstream, in `refine-story` and later implementation planning, not in this Story.\n\n## Story-specific goals and metrics\n\nA Story-specific goal or success measure is the exception, not the default. Include one only when the Product Owner or supporting evidence explicitly provides it and it adds information that is not already expressed by the acceptance criteria. Do not infer, derive, or invent a metric merely because the publication format supports one.\n\n\"Allow shoppers to see their orders\" is not a Story-specific goal when that is already the Story or an acceptance criterion — it is redundant, not a measure. \"Reduce order-status support contacts by X%\" is a genuine example, but only when the Product Owner or authoritative evidence actually supplied it.\n\nEpic- and Feature-level outcomes and success criteria remain owned by [feature-or-epic.md](feature-or-epic.md). Do not duplicate an Epic's goal into every child Story.\n\n## Open questions and ambiguity\n\nPreserve the rule above: do not invent behavior, and leave anything unresolved as an explicit open question. These are reusable ambiguity patterns worth challenging before finalizing a Story, not a checklist tied to any one domain:\n\n- a label or status value whose user-facing meaning is unclear — it could mean the raw persisted value, a mapped business status, or a user-facing label;\n- an access restriction with an unspecified resulting experience — \"cannot access\" does not say whether that means a redirect, an authentication prompt, an error page, or only an HTTP status;\n- an error condition without defined observable behavior — \"handle failures\" does not say what the user sees;\n- a term with more than one plausible product interpretation that would change implementation or the user experience.\n\nUse existing project context, design, or product conventions first when they already resolve the ambiguity. Ask the Product Owner only when the available evidence does not resolve it.\n\n## Design reference\n\n`.ai-dlc-config.md`'s `## Project references` (see [artifact-home.md](../../sync-context/references/artifact-home.md)) tells AI-DLC where the project's design context lives in general. A Story-level design reference is narrower: it points to the specific design artifact relevant to this one Story — a Figma file, frame, page, section, prototype, or other specific artifact — when one actually exists.\n\nReuse the project-level Figma reference and role concepts; do not duplicate the whole project configuration into every Story. Carry only the concrete evidence relevant to this Story, for example the URL plus the node or frame identifier when available. Do not invent a design reference. Omit it when no Story-specific design exists. Do not replace a Story-specific reference with the project-level Figma URL.\n\nThis skill collects that reference while drafting a new Story or updating an existing one. The Jira publication template does not discover, infer, or inspect designs; it only publishes a reference already in the approved proposal.\n\nDuring drafting or update-existing:\n\n- Reuse a design URL the Product Owner supplied, or one already present on the target Jira issue.\n- If an explicitly linked Design ticket is relevant and reachable with existing tools, retrieve that reference inside that issue. Do not crawl a Figma project or file.\n- Preserve the concrete URL and the node or frame identifier when available.\n- Distinguish a reference that was supplied or found from a design whose contents were inspected. A URL alone is not proof that its contents were read.\n- Inspect design contents only when an existing supported host tool is available and this workflow authorizes that read. Follow the Figma access rule in [project-onboarding.md](../../../../references/project-onboarding.md): do not add a Figma client. If access is missing, keep the link as confirmed and unverified. Report unavailable access honestly; do not claim inspection.\n- If several references conflict, or their relevance is unclear, ask one focused question rather than silently choosing one.\n\nStill out of scope: a design lifecycle or readiness-state model; autom
